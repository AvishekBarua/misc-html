ficomin taksinkuljettajan kokeen vaatimukset TRAFICOM/523956/03.04.03.00/2019: kuljettajan yleisvastuu kuljetettavista sekä lasten avun tarpeen tunnistaminen ja avustaminen."}, {"id": "M04", "slug": "accessible-taxi-lift-ramp-and-wheelchair-securement", "title": "Accessible Taxi Lift Ramp And Wheelchair Securement", "en": "The driver of an accessible taxi always operates the wheelchair lift and ramp according to the manufacturer's instructions. A professional driver tests the lift before the start of every shift: the driver runs it fully up and down, checks the platform's roll-stop barrier and makes sure the emergency lowering function works. The ramp is placed on a level, firm surface, and its anti-slip surface and locking are checked before a passenger uses it.\n  [Simplified: Test the lift every day before you drive. Run it all the way up and down. Check that the roll-stop barrier and the emergency lowering work. Always put the ramp on a flat, firm surface.]\n\nThe lift's safety interlocks protect against dangerous situations: the lift normally operates only when the vehicle is parked with the parking brake applied, and the roll-stop barrier keeps the wheelchair from rolling off the platform. The maximum rated load of the lift and ramp is marked on the manufacturer's plate and must never be exceeded — remember that the weight of the wheelchair, the passenger and any aids all count together. In the wheelchair space, the wheelchair is secured with a four-point tie-down system and the passenger wears a separate seat belt. The driver personally checks every securement before moving off.\n  [Simplified: The lift works only when the car is standing still and the parking brake is on. Check the maximum weight on the lift's plate and never go over it. Secure the wheelchair with four straps. Give the passenger their own seat belt. Always check the fastenings yourself.]\n\nA driver arrives to pick up a customer who uses a wheelchair outside a shopping centre. He parks on level ground, applies the parking brake and lowers the ramp firmly onto the surface. Once the customer is on board, the driver secures the wheelchair at four points, fastens the passenger's seat belt and gives the chair a gentle tug to confirm it cannot move. Only then does he drive off.\n\nThe most common mistake is relying on the wheelchair's own brakes and skipping the tie-down straps or the passenger's seat belt. Even ordinary braking can tip an unsecured wheelchair and seriously injure the passenger.\n\nRemember for the exam and on the job: test the lift before your shift, never exceed the load limit marked by the manufacturer, and always secure both the wheelchair at four points and the passenger with a seat belt.\n\nIf the lift or ramp fails, the driver never tries to compensate by lifting the passenger by hand — that endangers both the passenger and the driver. The fault is reported immediately to dispatch or the transport operator, and a replacement accessible vehicle is arranged for the customer. The driver explains the situation calmly and keeps the customer informed about when the replacement ride will arrive. Faulty equipment is not used again until it has been repaired and tested.\n  [Simplified: If the lift does not work, do not lift the passenger by hand. Call dispatch right away. Ask for another accessible car for the customer. Calmly tell the customer what is happening. Do not use broken equipment.]", "fi": "Esteettömän taksin kuljettaja käyttää pyörätuolinostinta ja ramppia aina valmistajan ohjeiden mukaisesti. Ammattikuljettaja testaa nostimen toiminnan ennen jokaisen vuoron alkua: hän ajaa nostimen kokonaan ylös ja alas, tarkistaa lavan reunaesteen ja varmistaa, että hätälaskutoiminto toimii. Ramppi asetetaan tasaiselle ja tukevalle alustalle, ja sen liukuesteet ja lukitus tarkistetaan ennen kuin matkustaja nousee sille.\n  [Simplified: Testaa nostin joka päivä ennen ajoa. Aja nostin ylös ja alas. Tarkista, että reunaeste ja hätälasku toimivat. Laita ramppi aina tasaiselle ja tukevalle paikalle.]\n\nNostimen turvalukitukset suojaavat vaaratilanteilta: nostin toimii yleensä vain, kun auto on pysäköity ja käsijarru kytketty, ja reunaeste estää pyörätuolia vierimästä lavalta. Nostimen ja rampin suurin sallittu kuormitus on merkitty valmistajan kilpeen, eikä sitä saa koskaan ylittää – muista, että pyörätuolin, matkustajan ja apuvälineiden paino lasketaan yhteen. Pyörätuolipaikalla pyörätuoli kiinnitetään neljästä pisteestä kiinnitysvöillä ja matkustajalle kiinnitetään erillinen turvavyö. Kuljettaja tarkistaa kaikki kiinnitykset itse ennen liikkeelle lähtöä.\n  [Simplified: Nostin toimii vain, kun auto seisoo paikallaan ja käsijarru on päällä. Katso suurin sallittu paino nostimen kilvestä, äläkä ylitä sitä. Kiinnitä pyörätuoli neljällä vyöllä. Laita matkustajalle oma turvavyö. Tarkista kiinnitykset aina itse.]\n\nKuljettaja saapuu hakemaan pyörätuolia käyttävää asiakasta kauppakeskuksen edestä. Hän pysäköi tasaiselle kohdalle, kytkee käsijarrun ja laskee rampin tukevasti maahan. Kun asiakas on noussut kyytiin, kuljettaja kiinnittää pyörätuolin neljästä pisteestä, kiinnittää matkustajan turvavyön ja kokeilee kevyesti nykäisemällä, ettei tuoli liiku. Vasta sitten hän lähtee liikkeelle.\n\nYleisin virhe on luottaa pelkkiin pyörätuolin omiin jarruihin ja jättää kiinnitysvyöt tai matkustajan turvavyö käyttämättä. Jo tavallisessa jarrutuksessa kiinnittämätön pyörätuoli voi kaatua ja matkustaja loukkaantua vakavasti.\n\nMuista kokeessa ja työssä: testaa nostin ennen vuoroa, älä koskaan ylitä valmistajan merkitsemää kuormitusrajaa ja kiinnitä aina sekä pyörätuoli neljästä pisteestä että matkustaja turvavyöllä.\n\nJos nostin tai ramppi vikaantuu, kuljettaja ei koskaan yritä korvata laitetta nostamalla matkustajaa käsivoimin – se vaarantaa sekä matkustajan että kuljettajan. Viasta ilmoitetaan heti välityskeskukselle tai liikenteenharjoittajalle, ja asiakkaalle järjestetään korvaava esteetön auto. Kuljettaja kertoo tilanteesta asiakkaalle rauhallisesti ja pitää hänet ajan tasalla korvaavan kyydin aikataulusta. Viallista laitetta ei käytetä uudelleen ennen kuin se on korjattu ja testattu.\n  [Simplified: Jos nostin ei toimi, älä nosta matkustajaa käsin. Soita heti välitykseen. Pyydä tilalle toinen esteetön auto. Kerro asiakkaalle rauhallisesti, mitä tapahtuu. Älä käytä rikkinäistä laitetta.]"}, {"id": "M05", "slug": "safe-wheelchair-transport-and-securement", "title": "Safe Wheelchair Transport And Securement", "en": "There are two main types of wheelchair: manual and electric. A manual wheelchair is lighter and often folds up, while an electric wheelchair is considerably heavier and should never be lifted by hand. A professional driver always asks first whether the passenger wants help and how they would like to be assisted — the passenger knows their own mobility aid and their own needs best. Never take hold of a wheelchair or start pushing it without asking permission.\n  [Simplified: A wheelchair can be manual or electric. An electric wheelchair is very heavy — do not lift it by hand. Always ask first: \"Do you want help? How can I help?\" The passenger knows best.]\n\nWhen a passenger travels seated in their wheelchair, the chair is secured to the vehicle floor at four points: two tie-down straps at the front and two at the rear, always attached to the frame — never to the wheels, footrests or other removable parts. Apply the wheelchair's brakes and switch off the power on an electric wheelchair. The passenger also needs their own separate seat belt: the wheelchair's own lap strap does not replace the vehicle's seat belt. Before moving off, a professional driver checks every attachment with a firm tug.\n  [Simplified: Fasten the wheelchair to the floor with four straps: two at the front, two at the back. Attach the straps to the frame, not the wheels. Put the wheelchair's brakes on. The passenger needs the car's own seat belt. Check all the fastenings before you drive.]\n\nNot every wheelchair is suitable for use as a seat in a vehicle. If the chair is damaged, its frame offers no proper attachment points, or the manufacturer has not intended it for use as a vehicle seat, the safest solution is to help the passenger transfer to a vehicle seat and carry the wheelchair separately, secured. Discuss the options calmly with the passenger, and never set off with a securement you are not confident in.\n  [Simplified: Not all wheelchairs are safe to sit in during a car journey. If the chair is broken or cannot be fastened properly, help the passenger move to a car seat. Carry the wheelchair separately, fastened down. Do not drive if the fastening is not safe.]\n\nYou pick up a Kela-reimbursed ride where the passenger uses an electric wheelchair. You greet them, introduce yourself and ask: \"How would you like me to assist?\" The passenger drives the chair onto the lift themselves; you secure the chair to its frame at four points, apply the brakes, make sure the power is switched off and help fasten the separate seat belt. Before leaving, you tug each strap and ask the passenger whether they are comfortable — only then do you set off.\n\nThe most common mistake is attaching the straps to the wheels, armrests or footrests instead of the frame, and trusting the wheelchair's own lap strap as a seat belt. Under hard braking a removable part can give way, sending both the chair and the passenger moving — the consequences can be severe.\n\nExam reminder: ask first, secure at four points to the frame, brakes on, a separate seat belt for the passenger — and check every fastening before moving off.", "fi": "Pyörätuoleja on kahta päätyyppiä: käsikäyttöisiä ja sähkökäyttöisiä. Käsikäyttöinen tuoli on kevyempi ja usein kokoontaitettava, kun taas sähköpyörätuoli on huomattavasti painavampi, eikä sitä pidä koskaan nostaa käsivoimin. Ammattimainen kuljettaja kysyy aina ensin, haluaako matkustaja apua ja miten häntä kannattaa avustaa — matkustaja tuntee oman apuvälineensä ja tarpeensa parhaiten. Älä koskaan tartu pyörätuoliin tai lähde työntämään sitä kysymättä lupaa.\n  [Simplified: Pyörätuoli voi olla käsikäyttöinen tai sähköinen. Sähköpyörätuoli on hyvin painava — älä nosta sitä käsin. Kysy aina ensin: \"Haluatko apua? Miten voin auttaa?\" Matkustaja tietää itse parhaiten.]\n\nKun matkustaja matkustaa pyörätuolissa istuen, tuoli kiinnitetään auton lattiaan neljästä pisteestä: kaksi kiinnityshihnaa eteen ja kaksi taakse, aina tuolin runkoon — ei pyöriin, jalkatukiin tai muihin irrotettaviin osiin. Kytke pyörätuolin jarrut päälle ja katkaise sähköpyörätuolista virta. Matkustaja tarvitsee lisäksi oman erillisen turvavyön: pyörätuolin oma lantiovyö ei korvaa auton turvavyötä. Ennen liikkeellelähtöä ammattikuljettaja tarkistaa vielä nykäisemällä, että jokainen kiinnitys pitää.\n  [Simplified: Kiinnitä pyörätuoli lattiaan neljällä hihnalla: kaksi eteen, kaksi taakse. Kiinnitä hihnat tuolin runkoon, ei pyöriin. Laita tuolin jarrut päälle. Matkustaja tarvitsee auton oman turvavyön. Tarkista kaikki kiinnitykset ennen kuin lähdet ajamaan.]\n\nKaikki pyörätuolit eivät sovellu käytettäväksi istuimena ajoneuvossa. Jos tuoli on vaurioitunut, sen rungossa ei ole kunnollisia kiinnityspisteitä tai valmistaja ei ole tarkoittanut sitä ajoneuvon istuimeksi, turvallisin ratkaisu on auttaa matkustaja auton omalle istuimelle ja kuljettaa pyörätuoli erikseen kiinnitettynä. Keskustele vaihtoehdoista rauhallisesti matkustajan kanssa, äläkä koskaan lähde liikkeelle kiinnityksellä, jonka pitävyyttä epäilet.\n  [Simplified: Kaikissa pyörätuoleissa ei ole turvallista matkustaa autossa. Jos tuoli on rikki tai sitä ei voi kiinnittää kunnolla, auta matkustaja auton istuimelle. Kuljeta tuoli erikseen kiinnitettynä. Älä aja, jos kiinnitys ei ole varma.]\n\nSaat Kela-kyydin, jonka matkustaja käyttää sähköpyörätuolia. Tervehdit, esittelet itsesi ja kysyt: \"Miten haluat, että avustan?\" Matkustaja ajaa itse tuolinsa nostimella autoon; sinä kiinnität tuolin neljästä pisteestä runkoon, kytket jarrut päälle, varmistat että virta on katkaistu ja autat erillisen turvavyön paikalleen. Ennen lähtöä nykäiset jokaisesta hihnasta ja kysyt matkustajalta, onko hänen hyvä olla — vasta sitten lähdet liikkeelle.\n\nYleisin virhe on kiinnittää hihnat pyöriin, käsinojiin tai jalkatukiin rungon sijasta ja luottaa pyörätuolin omaan lantiovyöhön turvavyönä. Äkkijarrutuksessa irrotettava osa voi pettää, jolloin sekä tuoli että matkustaja lähtevät liikkeelle — seuraukset voivat olla vakavat.\n\nMuistisääntö kokeeseen: kysy ensin, kiinnitä neljästä pisteestä runkoon, jarrut päälle, erillinen turvavyö matkustajalle — ja tarkista kaikki kiinnitykset ennen liikkeellelähtöä."}, {"id": "M06", "slug": "stretcher-transport-safety-loading-and-handover", "title": "Stretcher Transport Safety Loading And Handover", "en": "In stretcher transport, the stretcher is always locked into the vehicle's fastening system before moving off, and the lock is verified both visually and by testing it by hand. The patient is secured to the stretcher with shoulder, pelvic and leg restraints that are firm but do not pinch or restrict breathing. A professional driver always checks both things — the stretcher lock and the patient restraints — because one without the other is not enough.\n  [Simplified: Always lock the stretcher into the vehicle before driving. Test the lock by hand. Secure the patient with shoulder, pelvic and leg straps. Check both: the stretcher lock and the patient's straps.]\n\nLoading and unloading are done calmly on level ground, and the driver tells the patient in advance what is about to happen. A stretcher is best handled by two people, lifting with the legs and keeping the back straight, and the route is checked for obstacles before the move. At the hospital the patient is always handed over to staff in person: the driver reports anything that happened during the journey and never leaves the patient waiting alone.\n  [Simplified: Load and unload slowly on flat ground. Tell the patient what you are doing. Lift with your legs and keep your back straight, ideally with two people. At the hospital, hand the patient over to staff in person. Never leave the patient alone.]\n\nA driver is taking a stretcher patient home from a health centre when the patient turns pale and sweaty and starts answering questions in a confused way. The driver pulls over calmly at a safe spot, calls the emergency number 112 and reports the location and the patient's condition. The driver stays with the patient, monitoring breathing and consciousness, and follows the dispatcher's instructions until the ambulance arrives. A taxi is not a care unit — when a patient's condition deteriorates, the right decision is to call for help, not to keep driving.\n\nThe most common mistake is to rely on the patient straps alone and leave the stretcher's lock to the vehicle unverified: under hard braking an unlocked stretcher moves with the patient on it and can cause serious injury to both the patient and the driver.\n\nRemember for the exam: in stretcher transport you always confirm two things — the stretcher is locked to the vehicle and the patient is restrained on the stretcher — and if the patient's condition deteriorates on the way, you call the emergency number 112.\n\nIf the patient travels with an oxygen cylinder or other oxygen equipment, it is secured in its own holder or otherwise fastened firmly so it cannot fall or strike anything, and the tubing must run freely without kinks. Never smoke or handle open flames or greasy substances near oxygen equipment, and keep the vehicle well ventilated. The driver does not adjust the patient's oxygen flow — adjustments belong to healthcare staff or follow the instructions the patient has been given. A taxi is not suitable when the patient needs continuous treatment or monitoring during the journey: that calls for an ambulance, and in an emergency you call 112.\n  [Simplified: Fasten the oxygen cylinder firmly in its holder. No smoking, open flames or grease near oxygen. Do not adjust the oxygen yourself. If the patient needs care during the trip, a taxi is not enough — an ambulance is needed. In an emergency, call 112.]", "fi": "Paarikuljetuksessa paarit lukitaan aina ajoneuvon kiinnitysjärjestelmään ennen liikkeelle lähtöä, ja lukitus varmistetaan sekä silmämääräisesti että kädellä kokeilemalla. Potilas kiinnitetään paareille olka-, lantio- ja jalkahihnoilla niin, että hihnat ovat napakat mutta eivät purista eivätkä haittaa hengitystä. Ammattikuljettaja tarkistaa aina molemmat asiat — paarien lukituksen ja potilaan kiinnityksen — sillä pelkkä toinen ei riitä.\n  [Simplified: Lukitse paarit autoon aina ennen ajoa. Kokeile kädellä, että lukitus pitää. Kiinnitä potilas olka-, lantio- ja jalkahihnoilla. Tarkista molemmat: paarien lukitus ja potilaan hihnat.]\n\nKuormaus ja purku tehdään rauhallisesti tasaisella alustalla, ja kuljettaja kertoo potilaalle etukäteen, mitä seuraavaksi tapahtuu. Paareja käsitellään mieluiten kahden hengen voimin, selkä suorana ja jaloilla nostaen, ja kulkureitti tarkistetaan esteettömäksi ennen siirtoa. Sairaalassa potilas luovutetaan aina henkilökohtaisesti henkilökunnalle: kuljettaja kertoo, mitä matkan aikana on tapahtunut, eikä koskaan jätä potilasta yksin odottamaan.\n  [Simplified: Lastaa ja pura paarit rauhassa tasaisella paikalla. Kerro potilaalle, mitä teet. Nosta jaloilla ja selkä suorana, mieluiten kaksin. Sairaalassa luovuta potilas henkilökunnalle. Älä jätä potilasta yksin.]\n\nKuljettaja on viemässä paaripotilasta terveysasemalta kotiin, kun potilas muuttuu matkalla kalpeaksi ja hikiseksi ja alkaa vastata kysymyksiin sekavasti. Kuljettaja pysähtyy rauhallisesti turvalliseen paikkaan, soittaa hätänumeroon 112 ja kertoo sijainnin ja potilaan voinnin. Hän jää potilaan luo, seuraa hengitystä ja tajuntaa ja toimii hätäkeskuksen ohjeiden mukaan, kunnes ambulanssi saapuu. Taksi ei ole hoitoyksikkö — kun potilaan tila heikkenee, oikea ratkaisu on hälyttää apua, ei jatkaa ajamista.\n\nYleisin virhe on luottaa pelkkiin potilashihnoihin ja jättää paarien lukitus ajoneuvoon varmistamatta: äkkijarrutuksessa lukitsemattomat paarit lähtevät liikkeelle potilaineen ja voivat aiheuttaa vakavan vamman sekä potilaalle että kuljettajalle.\n\nMuista kokeeseen: paarikuljetuksessa varmistetaan aina kaksi asiaa — paarit on lukittu autoon ja potilas on kiinnitetty paareihin — ja jos potilaan tila heikkenee matkalla, soitetaan hätänumeroon 112.\n\nJos potilaalla on mukana happipullo tai muu happilaite, se kiinnitetään omaan telineeseensä tai muuten tukevasti niin, ettei se pääse kaatumaan tai iskeytymään mihinkään, ja letkujen on kuljettava vapaasti ilman taitoksia. Happilaitteen lähellä ei koskaan tupakoida eikä käsitellä avotulta tai rasvaisia aineita, ja auto pidetään hyvin tuuletettuna. Kuljettaja ei säädä potilaan happivirtausta itse — säädöt kuuluvat hoitohenkilökunnalle tai perustuvat potilaan saamiin ohjeisiin. Taksi ei sovellu kuljetukseen, jos potilas tarvitsee matkan aikana jatkuvaa hoitoa tai valvontaa: silloin tarvitaan ambulanssi, ja hätätilanteessa soitetaan 112.\n  [Simplified: Kiinnitä happipullo tukevasti telineeseen. Ei tupakkaa, avotulta tai rasvaa hapen lähellä. Älä säädä happea itse. Jos potilas tarvitsee hoitoa matkan aikana, taksi ei riitä — silloin tarvitaan ambulanssi. Hätätilanteessa soita 112.]"}, {"id": "M07", "slug": "assisting-passengers-with-mobility-limitations", "title": "Assisting Passengers With Mobility Limitations", "en": "A passenger with limited mobility may use a cane, crutches or a rollator, and each passenger knows best what kind of help they need. A professional driver always asks first: \"Would you like help, and how can I assist?\" Never touch the passenger or their mobility aid without permission. Respecting independence is part of good service — help is offered, never forced.\n  [Simplified: Always ask first: \"Can I help you?\" Do not touch the passenger or their walking aid without permission. The passenger knows what help they need. Let them do what they can do themselves.]\n\nAllow plenty of time for transfers and let the passenger move at their own pace — rushing increases the risk of falling. Park as close as possible to an accessible route and open the door in advance. Offer your arm as support and let the passenger take hold of it, rather than grabbing them. Once the passenger is seated, make sure the seatbelt is fastened and the mobility aids are stowed safely.\n  [Simplified: Do not rush. Let the passenger move at their own pace. Park close to the door. Offer your arm — let the passenger hold on to you. Then check the seatbelt and the walking aids.]\n\nAn elderly passenger is waiting for the taxi with a rollator. The driver parks close to the entrance, greets her and asks: \"How can I help?\" The passenger prefers to get into the car by herself, holding on to the door; the driver stands close by, ready to support her but without rushing. Once she is seated, the driver locks the rollator's brakes, folds it and lifts it into the boot — and at the destination brings it back, opened and with the brakes locked, right next to the passenger's door.\n\nThe most common mistake is grabbing the passenger's arm or moving their mobility aid without asking. A sudden grab can throw the passenger off balance and cause a fall — and unasked-for help feels demeaning to many.\n\nRemember three steps: ask first, assist at the passenger's pace, and before setting off check that the passenger, the mobility aids and the seatbelt are secure. Assisting passengers with limited mobility is a core professional skill for a driver — and core content in the exam.\n\nA cane or crutches travel in the cabin with the passenger, within reach but placed so they cannot move during braking. A rollator is folded and lifted into the boot — but always ask first how the passenger wants their aid handled. Carry shopping and luggage to the door when asked, and before driving away, make sure the passenger can safely get inside or continue on their way. The service does not end when the car stops.\n  [Simplified: A cane or crutches stay near the passenger in the car. A rollator goes in the boot — ask first how to handle it. Carry bags to the door if the passenger asks. Make sure the passenger is safe before you drive away.]", "fi": "Liikkumisrajoitteinen matkustaja voi käyttää keppiä, kyynärsauvoja tai rollaattoria, ja jokainen matkustaja tietää itse parhaiten, millaista apua tarvitsee. Ammattitaitoinen kuljettaja kysyy aina ensin: \"Haluatteko apua, ja miten voin auttaa?\" Matkustajaan tai hänen apuvälineeseensä ei kosketa kysymättä lupaa. Itsenäisyyden kunnioittaminen on osa hyvää palvelua – apua tarjotaan, ei tyrkytetä.\n  [Simplified: Kysy aina ensin: \"Voinko auttaa?\" Älä koske matkustajaan tai hänen apuvälineeseensä ilman lupaa. Matkustaja tietää itse, mitä apua hän tarvitsee. Anna hänen tehdä itse se, minkä hän pystyy tekemään.]\n\nVaraa siirtymisiin riittävästi aikaa ja anna matkustajan edetä omassa tahdissaan – kiirehtiminen lisää kaatumisriskiä. Pysäköi mahdollisimman lähelle esteetöntä reittiä ja avaa ovi valmiiksi. Tarjoa tueksi käsivartesi ja anna matkustajan tarttua siihen sen sijaan, että tartut häneen. Kun matkustaja istuu autossa, varmista että turvavyö on kiinnitetty ja apuvälineet ovat turvallisesti kyydissä.\n  [Simplified: Älä kiirehdi. Anna matkustajan liikkua omassa tahdissaan. Pysäköi lähelle ovea. Tarjoa käsivartesi tueksi – anna matkustajan tarttua sinuun. Varmista lopuksi turvavyö ja apuvälineet.]\n\nIäkäs matkustaja odottaa taksia rollaattorin kanssa. Kuljettaja pysäköi lähelle sisäänkäyntiä, tervehtii ja kysyy: \"Miten voin auttaa?\" Matkustaja haluaa siirtyä autoon itse ja tukeutuu oveen; kuljettaja seisoo vieressä valmiina tukemaan, kiirehtimättä. Kun matkustaja istuu, kuljettaja lukitsee rollaattorin jarrut, taittaa sen kokoon ja nostaa tavaratilaan – ja perillä tuo sen avattuna, jarrut lukittuina, suoraan matkustajan oven viereen.\n\nYleisin virhe on tarttua matkustajan käsivarteen tai siirtää apuvälinettä kysymättä. Äkillinen tarttuminen voi horjuttaa tasapainoa ja johtaa kaatumiseen – ja pyytämättä auttaminen tuntuu monesta alentavalta.\n\nMuista kolme askelta: kysy ensin, auta matkustajan tahdissa ja varmista ennen liikkeelle lähtöä, että matkustaja, apuvälineet ja turvavyö ovat kunnossa. Liikkumisrajoitteisen matkustajan avustaminen on ammattikuljettajan perusosaamista ja kokeen ydinsisältöä.\n\nKävelykeppi ja kyynärsauvat kulkevat matkustajan mukana matkustamossa niin, että ne pysyvät hänen ulottuvillaan mutta eivät pääse liikkumaan jarrutuksessa. Rollaattori taitetaan kokoon ja nostetaan tavaratilaan – kysy silti aina ensin, miten matkustaja haluaa apuvälinettään käsiteltävän. Kanna ostokset ja matkatavarat pyydettäessä ovelle asti, ja varmista ennen lähtöäsi, että matkustaja pääsee turvallisesti sisälle tai jatkamaan matkaansa. Palvelu ei pääty siihen, kun auto pysähtyy.\n  [Simplified: Keppi ja sauvat pysyvät matkustajan lähellä autossa. Rollaattori menee tavaratilaan – kysy ensin, miten. Kanna tavarat ovelle, jos matkustaja pyytää. Varmista, että matkustaja pärjää, ennen kuin lähdet.]"}, {"id": "M08", "slug": "guiding-blind-and-visually-impaired-passengers", "title": "Guiding Blind And Visually Impaired Passengers", "en": "When you meet a blind or visually impaired passenger, always begin by speaking: greet them, give your name, and say that you are the taxi they ordered. Describe in words where the car is and how to reach it, for example: \"The car is about five metres straight ahead of you.\" Offer your elbow as a point of support and let the passenger take hold of it themselves — a professional driver never grabs a passenger or pushes them ahead.\n  [Simplified: Speak first: say who you are and that you are the taxi. Say where the car is. Offer your elbow and let the passenger take hold of it. Never grab or push the passenger.]\n\nNarrate every stage of the journey: mention steps, kerbs and doors in advance, and explain which way the seat faces. Say for example \"the door frame is at your right hand\" and let the passenger find the seatbelt themselves — help only if they ask. At payment, state the fare out loud, say where the payment terminal is, and describe what you are doing, for example: \"I am reading your card as a contactless payment now.\" Finally, confirm out loud that the card and receipt are back in the passenger's hand.\n  [Simplified: Say everything out loud: steps, kerbs, the door and the seat. Say the price out loud. Say where the payment terminal is and what you are doing with the card. Put the card and receipt straight back into the passenger's hand.]\n\nYou arrive at the main entrance of a shopping centre, where according to the booking a visually impaired passenger is waiting with a guide dog. You park safely, walk up to the passenger and say: \"Good afternoon, I'm Sami, the taxi you ordered. The car is about ten metres away on your left — may I offer you my elbow?\" The passenger takes hold of your arm, and as you walk you mention the kerb before you reach it. Following the passenger's instructions, the guide dog settles into the footwell, and before setting off you confirm out loud that the seatbelt is fastened and the passenger is ready.\n\nThe most common mistake is grabbing hold of the passenger and steering them by pushing them ahead of you. It takes away their sense of control and can cause a stumble — always let the passenger hold on to you, never the other way around.\n\nA guide dog is a working aid, not a pet: it always travels with its user, and a professional driver always takes the guide dog along and never refuses a ride because of it. Do not pet or talk to a dog wearing its harness — it is working.\n\nRule of thumb for the exam and the job: speak before you touch, describe before you move. At the destination, guide the passenger to a safe point, for example all the way to the entrance door — never leave them in the middle of an open space.", "fi": "Kun kohtaat sokean tai heikkonäköisen matkustajan, aloita aina puhumalla: tervehdi, kerro nimesi ja se, että olet tilattu taksi. Kuvaile sanallisesti, missä auto on ja miten sinne pääsee, esimerkiksi: \"Auto on noin viisi metriä suoraan edessäsi.\" Tarjoa kyynärpäätäsi tukipisteeksi ja anna matkustajan tarttua siihen itse — ammattikuljettaja ei koskaan tartu matkustajaan kiinni eikä työnnä häntä edellään.\n  [Simplified: Puhu ensin: kerro kuka olet ja että olet taksi. Kerro, missä auto on. Tarjoa kyynärpäätäsi ja anna matkustajan ottaa siitä kiinni. Älä koskaan tartu matkustajaan tai työnnä häntä.]\n\nSanoita matkan jokainen vaihe: kerro etukäteen portaista, reunakivistä ja ovista sekä siitä, mihin suuntaan istuin on suunnattu. Sano esimerkiksi \"oven karmi on oikean kätesi kohdalla\" ja anna matkustajan itse löytää turvavyö — auta vain, jos hän pyytää. Maksuvaiheessa sano hinta ääneen, kerro missä maksupääte on ja kuvaile mitä teet, esimerkiksi: \"Luen korttisi nyt lähimaksuna.\" Varmista lopuksi ääneen, että kortti ja kuitti ovat takaisin matkustajan kädessä.\n  [Simplified: Kerro kaikki ääneen: portaat, reunakivet, ovi ja istuin. Sano hinta ääneen. Kerro, missä maksupääte on ja mitä teet kortilla. Anna kortti ja kuitti takaisin suoraan käteen.]\n\nSaavut kauppakeskuksen pääovelle, jossa tilauksen mukaan odottaa heikkonäköinen matkustaja opaskoiran kanssa. Pysäköit turvallisesti, kävelet matkustajan luo ja sanot: \"Hyvää päivää, olen Sami, tilaamanne taksi. Auto on noin kymmenen metrin päässä vasemmalla — saanko tarjota kyynärpääni?\" Matkustaja tarttuu käsivarteesi, ja kävellessänne kerrot reunakivestä ennen kuin tulette sen kohdalle. Opaskoira asettuu matkustajan ohjeen mukaan jalkatilaan, ja ennen liikkeellelähtöä varmistat ääneen, että turvavyö on kiinni ja matkustaja on valmis.\n\nYleisin virhe on tarttua matkustajaan kiinni ja ohjata häntä työntämällä edellä. Se vie matkustajalta hallinnan tunteen ja voi johtaa kompastumiseen — anna aina matkustajan pitää kiinni sinusta, ei koskaan toisinpäin.\n\nOpaskoira on työväline, ei lemmikki: se kulkee aina käyttäjänsä mukana, ja ammattikuljettaja ottaa opaskoiran aina kyytiin eikä koskaan kieltäydy kyydistä sen vuoksi. Älä silitä äläkä puhuttele valjaissa olevaa koiraa — se on töissä.\n\nMuistisääntö kokeeseen ja työhön: puhu ennen kuin kosketat, kuvaile ennen kuin liikutte. Perillä ohjaa matkustaja turvalliseen paikkaan, esimerkiksi sisäänkäynnin ovelle asti — älä koskaan jätä häntä keskelle avointa tilaa."}, {"id": "M09", "slug": "serving-deaf-and-hard-of-hearing-passengers", "title": "Serving Deaf And Hard Of Hearing Passengers", "en": "A deaf or hard-of-hearing customer often understands speech by lip-reading, so always turn to face the customer when you speak. Speak calmly and clearly at a normal volume – shouting distorts lip movements and does not help. In the dark, switch on the car's interior light so the customer can see your face and the movement of your lips. A professional driver always makes sure their face is visible when communicating with a customer who has a hearing impairment.\n  [Simplified: Turn towards the customer when you speak. Speak calmly. Do not shout. In the dark, turn on the interior light so the customer can see your face and lips.]\n\nAsk the customer right at the start how they prefer to communicate – some lip-read, others would rather write. Written communication is a reliable method: use your phone's notes, a text message, or pen and paper. Always confirm the destination in writing, or by showing the address on the navigator, before you set off. Reduce background noise by turning off the radio and closing the windows, because a hearing aid amplifies all sounds – including noise.\n  [Simplified: Ask the customer how they want to communicate. Write messages on your phone or on paper. Show the destination in writing and check that it is correct. Turn off the radio, because background noise makes hearing harder.]\n\nIt is a dark November evening, and the driver picks up a customer who points to their ear and shakes their head to show they cannot hear. The driver switches on the interior light, turns to face the customer, and types on their phone: \"Where are we going?\" The customer types in the address, the driver shows it on the navigator screen, and the customer confirms with a thumbs-up. The driver turns off the radio, checks that the seat belt is fastened, and the journey begins calmly.\n\nThe most common mistake is talking to the customer with your back turned or through the rear-view mirror while driving – a customer with a hearing impairment cannot see your face and cannot follow what you say. The destination or the price can then be misunderstood, and the customer is left feeling uncertain for the whole journey.\n\nRemember: always ask first how the customer themselves prefers to communicate. Facing the customer, the interior light on in the dark, and a written confirmation of the destination solve almost every situation.", "fi": "Kuuro tai huonokuuloinen asiakas saa puheesta selvää usein lukemalla huulilta, joten käänny aina kasvot asiakasta kohti, kun puhut. Puhu rauhallisesti ja selkeästi normaalilla äänenvoimakkuudella – huutaminen vääristää huulten liikkeitä eikä auta. Pimeällä sytytä auton sisävalo, jotta asiakas näkee kasvosi ja huultesi liikkeet. Ammattikuljettaja varmistaa aina, että hänen kasvonsa ovat näkyvissä, kun hän viestii kuulovammaisen asiakkaan kanssa.\n  [Simplified: Käänny asiakasta kohti, kun puhut. Puhu rauhallisesti. Älä huuda. Pimeällä laita auton sisävalo päälle, jotta asiakas näkee kasvosi ja huulesi.]\n\nKysy asiakkaalta heti alussa, miten hän haluaa viestiä – jotkut lukevat huulilta, toiset kirjoittavat mieluummin. Kirjallinen viestintä on varma keino: käytä puhelimen muistiota, tekstiviestiä tai kynää ja paperia. Varmista määränpää aina kirjallisesti tai näyttämällä osoite navigaattorista, ennen kuin lähdet liikkeelle. Vähennä taustamelua sammuttamalla radio ja sulkemalla ikkunat, sillä kuulolaite vahvistaa kaikki äänet – myös hälyn.\n  [Simplified: Kysy asiakkaalta, miten hän haluaa viestiä. Kirjoita viestit puhelimeen tai paperille. Näytä määränpää kirjallisesti ja varmista, että se on oikein. Sammuta radio, koska taustamelu vaikeuttaa kuulemista.]\n\nOn pimeä marraskuun ilta, ja kuljettaja noutaa asiakkaan, joka osoittaa korvaansa ja pudistaa päätään merkiksi siitä, ettei kuule. Kuljettaja sytyttää sisävalon, kääntyy kasvot asiakasta kohti ja kirjoittaa puhelimeensa: \"Mihin ajetaan?\" Asiakas näppäilee osoitteen, kuljettaja näyttää sen navigaattorin näytöltä, ja asiakas vahvistaa peukalolla. Kuljettaja sammuttaa radion, varmistaa, että turvavyö on kiinnitetty, ja matka alkaa rauhallisesti.\n\nYleisin virhe on puhua asiakkaalle selkä käännettynä tai taustapeilin kautta ajon aikana – kuulovammainen asiakas ei näe kasvojasi eikä voi seurata puhettasi. Silloin määränpää tai hinta voi mennä väärin, ja asiakas jää epävarmaksi koko matkan ajaksi.\n\nMuista: kysy aina ensin, miten asiakas itse haluaa viestiä. Kasvot asiakasta kohti, sisävalo päälle pimeällä ja kirjallinen varmistus määränpäästä ratkaisevat lähes kaikki tilanteet."}, {"id": "M10", "slug": "supporting-passengers-with-cognitive-and-hidden-disabilities", "title": "Supporting Passengers With Cognitive And Hidden Disabilities", "en": "Not all disabilities are visible: an intellectual disability, autism spectrum traits, a memory disorder or anxiety can affect how a passenger understands and acts. A professional driver speaks calmly, uses short and clear sentences, and gives one piece of information at a time. Check understanding with a friendly question, for example \"Is it okay if we set off now?\" – silence alone does not mean the message was understood.\n  [Simplified: Some disabilities cannot be seen. Speak calmly and clearly. Say one thing at a time. Ask the passenger to confirm they understood.]\n\nMany passengers, for example people on the autism spectrum, can be overwhelmed by sounds, smells or bright lights. Offer adjustments proactively: the radio can be switched off, the ventilation adjusted and conversation kept to a minimum if the passenger prefers. If a passenger becomes anxious or has a panic attack, speak in a calm voice, explain what will happen next and pull over in a safe place if needed. In an emergency, call 112.\n  [Simplified: Sounds, smells and lights can feel too strong. Ask if you may turn the radio off. If the passenger is afraid or panics, speak calmly and stop in a safe place. In an emergency, call 112.]\n\nFor a passenger with a memory disorder, familiar routes feel safe, and an unexpected route change can cause confusion or fear. Explain any change calmly in advance, repeat the destination and reassure the passenger that you are going to the right place – do not argue or correct them sharply. Always respect the passenger's autonomy: speak directly to them as an adult, ask before helping and let them do themselves what they are able to do.\n  [Simplified: A passenger with a memory disorder may be scared if the route changes. Explain the change calmly. Say where you are going. Do not argue. Always ask before you help.]\n\nYou pick up an elderly passenger with a memory disorder from a day centre, and roadworks force you off the familiar route. The passenger becomes worried: \"This is the wrong way – where are you taking me?\" The driver answers calmly: \"We are on our way to your home on Koivukuja. There are roadworks, so today we drive a different way – we will be there very soon.\" The driver keeps a calm voice, repeats the destination when needed and stays patient even though the passenger asks the same question several times.\n\nThe most common mistake is talking past the passenger to their companion, or treating an adult like a child, because the disability is invisible or their speech is slow. This violates the passenger's autonomy, and important information – such as the correct address or a need for help – can go unheard.\n\nRemember: a calm voice, clear language and one thing at a time help in almost every situation. Always ask the passenger themselves how they want to be helped – an invisible disability is still real.", "fi": "Kaikki toimintarajoitteet eivät näy päällepäin: kehitysvamma, autismikirjon piirteet, muistisairaus tai ahdistuneisuus voivat vaikuttaa siihen, miten matkustaja ymmärtää ja toimii. Ammattitaitoinen kuljettaja puhuu rauhallisesti, käyttää lyhyitä ja selkeitä lauseita ja kertoo yhden asian kerrallaan. Varmista ymmärtäminen ystävällisellä kysymyksellä, esimerkiksi \"Sopiiko, että lähdemme nyt liikkeelle?\" – pelkkä hiljaisuus ei tarkoita, että asia on ymmärretty.\n  [Simplified: Kaikki vammat eivät näy ulospäin. Puhu rauhallisesti ja selkeästi. Sano yksi asia kerrallaan. Kysy matkustajalta, ymmärsikö hän.]\n\nMoni matkustaja, esimerkiksi autismikirjon henkilö, voi kuormittua äänistä, hajuista tai kirkkaista valoista. Tarjoa mukautuksia aktiivisesti: radion voi sammuttaa, ilmastointia säätää ja keskustelun pitää vähäisenä, jos matkustaja niin toivoo. Jos matkustaja ahdistuu tai saa paniikkikohtauksen, puhu rauhallisella äänellä, kerro mitä seuraavaksi tapahtuu ja pysähdy tarvittaessa turvalliseen paikkaan. Hätätilanteessa soita 112.\n  [Simplified: Äänet, hajut ja valot voivat tuntua liian voimakkailta. Kysy, saako radion laittaa pois. Jos matkustaja pelkää tai saa paniikkikohtauksen, puhu rauhallisesti ja pysähdy turvalliseen paikkaan. Hätätilanteessa soita 112.]\n\nMuistisairaalle matkustajalle tutut reitit tuovat turvaa, ja yllättävä reittimuutos voi aiheuttaa hämmennystä tai pelkoa. Kerro muutoksesta rauhallisesti etukäteen, toista määränpää ja vakuuta, että olette menossa oikeaan paikkaan – älä väittele äläkä korjaa tiukasti. Kunnioita aina matkustajan itsemääräämisoikeutta: puhu suoraan hänelle aikuisena, kysy ennen kuin autat ja anna hänen tehdä itse se, mihin hän pystyy.\n  [Simplified: Muistisairas matkustaja voi pelästyä, jos reitti muuttuu. Kerro muutoksesta rauhallisesti. Sano, minne olette menossa. Älä väittele. Kysy aina ennen kuin autat.]\n\nHaet päiväkeskuksesta iäkkään matkustajan, jolla on muistisairaus, ja tietyömaa pakottaa poikkeamaan tutulta reitiltä. Matkustaja huolestuu: \"Tämä on väärä tie – minne sinä viet minua?\" Kuljettaja vastaa rauhallisesti: \"Olemme matkalla teidän kotiinne Koivukujalle. Tiellä on työmaa, joten ajamme tänään toista kautta – perillä ollaan ihan pian.\" Hän pitää äänensä rauhallisena, toistaa määränpään tarvittaessa uudelleen eikä hermostu, vaikka matkustaja kysyy saman asian useita kertoja.\n\nYleisin virhe on puhua matkustajan ohi saattajalle tai kohdella aikuista kuin lasta, koska vamma ei näy tai puhe on hidasta. Tämä loukkaa matkustajan itsemääräämisoikeutta, ja tärkeä tieto – kuten oikea osoite tai avuntarve – voi jäädä kuulematta.\n\nMuista: rauhallinen ääni, selkeä kieli ja yksi asia kerrallaan auttavat lähes kaikissa tilanteissa. Kysy aina matkustajalta itseltään, miten hän haluaa tulla autetuksi – näkymätönkin vamma on todellinen."}, {"id": "M11", "slug": "assisting-older-passengers-safely", "title": "Assisting Older Passengers Safely", "en": "An older passenger needs time to get in and out of the car, and a professional driver never rushes them. Park as close to the entrance as possible, on level and well-lit ground, and offer your arm for support when needed. In winter, slippery surfaces are a serious fall risk for older people: choose a stopping place free of ice and snowbanks, and escort the customer from door to door if necessary. Also make sure the seatbelt is properly fastened before setting off.\n  [Simplified: Give an older passenger time. Do not rush them. Park close to the door. Offer your arm if they need help. In winter, watch out for ice. Check that the seatbelt is fastened.]\n\nA rollator, wheelchair or walking stick is an essential mobility aid for an older person, not luggage. Load the aid carefully, secure it so it cannot move under braking, and hand it back within the customer's reach as soon as you arrive — before they try to get out of the car. The ride ends only when the customer is safely inside: stay and watch that they get through the door, and do not drive off before that.\n  [Simplified: A rollator or wheelchair is an important aid. Load it carefully and secure it well. Give it back as soon as you arrive. Wait until the customer is inside the door. Only then drive away.]\n\nA professional driver should recognize the signs of a medical emergency: sudden confusion, slurred speech, weakness on one side of the body, severe chest pain, paleness and cold sweat can indicate a serious situation. If you suspect a medical emergency, stop the car in a safe place, call the emergency number 112 and follow the emergency centre's instructions. Do not leave the customer alone — and if an unconscious person is breathing, turn them onto their side into the recovery position.\n  [Simplified: Learn the signs of an emergency: confusion, slurred speech, weakness on one side, chest pain. If the customer becomes ill, stop the car and call 112. Do not leave the customer alone. If an unconscious person is breathing, turn them onto their side.]\n\nIt is a January evening and you are picking up an 82-year-old customer from a health centre. You park right in front of the entrance, lift the rollator into the boot and offer your arm, because there is a patch of ice on the pavement. At the destination you set the rollator down next to the customer, escort them to the stairwell door and leave only when you see the door close behind them.\n\nThe most common mistake is driving away as soon as the customer has stepped out of the car. If an older person falls alone on an icy yard in freezing weather, help may take a long time to arrive and the consequences can be serious.\n\nRemember for the exam: a ride with an older customer ends only when they are safely indoors — and in a medical emergency you always call the emergency number 112.", "fi": "Iäkäs matkustaja tarvitsee aikaa autoon nousemiseen ja siitä poistumiseen, eikä ammattikuljettaja koskaan hoputa häntä. Pysäköi mahdollisimman lähelle sisäänkäyntiä tasaiselle ja valaistulle kohdalle ja tarjoa tarvittaessa käsivartesi tueksi. Talvella liukkaus on iäkkäälle vakava kaatumisriski: valitse pysähtymispaikka, jossa ei ole jäätä tai lumipenkkaa, ja saata asiakas tarvittaessa ovelta ovelle. Varmista myös, että turvavyö on kunnolla kiinni ennen liikkeelle lähtöä.\n  [Simplified: Anna iäkkäälle matkustajalle aikaa. Älä hoputa. Pysäköi lähelle ovea. Auta tarvittaessa kädestä. Talvella varo liukasta jäätä. Tarkista, että turvavyö on kiinni.]\n\nRollaattori, pyörätuoli tai kävelykeppi on iäkkäälle välttämätön apuväline, ei matkatavara. Nosta apuväline autoon huolellisesti, kiinnitä se niin, ettei se liiku jarrutuksessa, ja anna se takaisin asiakkaan ulottuville heti perillä — ennen kuin hän yrittää nousta autosta. Kyyti päättyy vasta, kun asiakas on turvallisesti sisällä: jää katsomaan, että hän pääsee ovesta sisään, äläkä lähde liikkeelle ennen sitä.\n  [Simplified: Rollaattori ja pyörätuoli ovat tärkeitä apuvälineitä. Nosta ne autoon varovasti ja kiinnitä hyvin. Anna apuväline takaisin heti perillä. Odota, että asiakas on sisällä ovesta. Vasta sitten voit ajaa pois.]\n\nAmmattikuljettajan on hyvä tunnistaa sairauskohtauksen merkit: äkillinen sekavuus, puheen puuroutuminen, toispuoleinen heikkous, kova rintakipu, kalpeus ja kylmänhikisyys voivat kertoa vakavasta hätätilanteesta. Jos epäilet sairauskohtausta, pysäytä auto turvalliseen paikkaan, soita hätänumeroon 112 ja toimi hätäkeskuksen ohjeiden mukaan. Älä jätä asiakasta yksin — ja jos tajuton henkilö hengittää, käännä hänet kylkiasentoon.\n  [Simplified: Opettele hätätilanteen merkit: sekavuus, epäselvä puhe, toisen puolen heikkous, rintakipu. Jos asiakas saa sairauskohtauksen, pysäytä auto ja soita 112. Älä jätä asiakasta yksin. Jos tajuton hengittää, käännä hänet kylkiasentoon.]\n\nOn tammikuinen ilta, ja haet 82-vuotiaan asiakkaan terveysasemalta. Pysäköit suoraan sisäänkäynnin eteen, nostat rollaattorin takakonttiin ja tarjoat käsivartesi, koska jalkakäytävällä on jäinen kohta. Perillä nostat rollaattorin valmiiksi asiakkaan viereen, saatat hänet rappukäytävän ovelle ja lähdet vasta, kun näet oven sulkeutuvan hänen takanaan.\n\nYleisin virhe on ajaa pois heti, kun asiakas on noussut autosta. Jos iäkäs kaatuu yksin liukkaalla pihalla pakkasessa, apu voi viipyä pitkään ja seuraukset olla vakavat.\n\nMuista kokeessa: iäkkään asiakkaan kyyti päättyy vasta, kun hän on turvallisesti sisällä — ja sairauskohtauksessa soitetaan aina hätänumeroon 112."}, {"id": "M12", "slug": "school-daycare-transport-responsible-driver", "title": "School Daycare Transport Responsible Driver", "en": "In school and daycare transport, the driver is the adult responsible for the children's safety throughout the journey. A professional driver knows the passenger list and the agreed route before the run begins, and makes sure every child on the list is picked up at the agreed place. The driver never deviates from the route or schedule on their own initiative — changes are always agreed with the client, the school or the guardians.\n  [Simplified: You are the adult in charge of the children during the whole ride. Check the passenger list and the agreed route before you drive. Do not change the route yourself. Always agree on changes with the school or the guardians.]\n\nA safe journey starts and ends in a supervised situation. The child is always picked up and dropped off at the agreed place, so that they never have to cross the road alone, and before moving off the driver checks that every seat belt is fastened. The youngest children are handed over only to the agreed receiver — if an unknown person is waiting, or no one is there at all, the driver does not leave the child but contacts the guardian, the school or the dispatch centre.\n  [Simplified: Pick up and drop off the child only at the agreed place. The child must not cross the road alone. Check that every seat belt is fastened before you drive. Hand a small child over only to the agreed, known receiver. If no one is there, do not leave the child — call the guardian or the school.]\n\nIn a restless situation the driver stays calm: if the passengers' behaviour endangers safety, the driver stops the car in a safe place and speaks to the children clearly and kindly — never shouting or threatening. Recurring problems are reported to the school and the guardians so they can be addressed together. If a child is not at the agreed pickup point or goes missing during the journey, the driver informs the school, the guardian and the dispatch centre immediately instead of carrying on as if nothing had happened; if there is reason to believe the child is in danger, call the emergency number 112.\n  [Simplified: If the children disturb your driving, stop the car in a safe place and speak calmly. Do not shout. Tell the school and the guardians about repeated problems. If a child is missing, inform the school and the guardian at once. If the child may be in danger, call 112.]\n\nOn a Friday afternoon the driver brings a preschooler home, but instead of the agreed receiver an unknown man is waiting at the gate, saying he is a friend of the family and has come to collect the child. The driver does not hand the child over: the child stays in the car while the driver calls the guardian to check the situation. The guardian confirms that no one else is allowed to collect the child, so the driver informs the dispatch centre and waits with the child until the guardian arrives. The child stays safe because the driver verified the situation before the handover.\n\nThe most common mistake is dropping a child off even though no receiver is in sight or the situation is unclear — a small child can then be left alone by the roadside or wander off in the wrong direction. In an unclear situation the child is never left alone; the driver checks with the guardian, the school or the dispatch centre first.\n\nRemember for the exam: in school transport the driver is the responsible adult for the whole journey — a child is never left alone in an unclear situation, handover happens only to the agreed receiver, and in an emergency you call 112.", "fi": "Koulu- ja päiväkotikuljetuksissa kuljettaja on matkan ajan lasten turvallisuudesta vastaava aikuinen. Ammattitaitoinen kuljettaja tuntee matkustajaluettelon ja sovitun reitin ennen ajon alkua ja varmistaa, että jokainen listalla oleva lapsi otetaan kyytiin sovitusta paikasta. Reitistä tai aikataulusta ei poiketa omin päin, vaan muutoksista sovitaan aina tilaajan, koulun tai huoltajien kanssa.\n  [Simplified: Kuljettaja on aikuinen, joka vastaa lapsista koko matkan ajan. Tarkista lista lapsista ja sovittu reitti ennen ajoa. Älä muuta reittiä itse. Sovi muutoksista aina koulun tai huoltajan kanssa.]\n\nTurvallinen kuljetus alkaa valvotusta tilanteesta ja päättyy valvottuun tilanteeseen. Lapsi otetaan kyytiin ja jätetään kyydistä aina sovitussa paikassa niin, ettei hänen tarvitse ylittää tietä yksin, ja kuljettaja varmistaa ennen liikkeellelähtöä, että jokaisen turvavyö on kiinnitetty. Pienimmät lapset luovutetaan vain sovitulle vastaanottajalle — jos vastassa on tuntematon henkilö tai ketään ei näy, lasta ei jätetä, vaan kuljettaja ottaa yhteyttä huoltajaan, kouluun tai välityskeskukseen.\n  [Simplified: Ota lapsi kyytiin ja jätä hänet kyydistä vain sovitussa paikassa. Lapsi ei saa ylittää tietä yksin. Varmista, että turvavyö on kiinni ennen lähtöä. Anna pieni lapsi vain sovitulle, tutulle vastaanottajalle. Jos vastaanottajaa ei ole paikalla, älä jätä lasta — soita huoltajalle tai kouluun.]\n\nLevottomassa tilanteessa kuljettaja pysyy rauhallisena: jos matkustajien käytös vaarantaa turvallisuuden, auto pysäytetään turvalliseen paikkaan ja lapsille puhutaan selkeästi ja ystävällisesti — koskaan ei huudeta eikä uhkailla. Toistuvista ongelmista kerrotaan koululle ja huoltajille, jotta niihin voidaan puuttua yhdessä. Jos lapsi ei ole sovitussa noutopaikassa tai katoaa kesken matkan, kuljettaja ilmoittaa siitä heti koululle, huoltajalle ja välityskeskukselle eikä jatka matkaa kuin mitään ei olisi tapahtunut; jos on syytä epäillä lapsen olevan vaarassa, soitetaan hätänumeroon 112.\n  [Simplified: Jos lapset häiritsevät ajoa, pysäytä auto turvalliseen paikkaan ja puhu rauhallisesti. Älä huuda. Kerro toistuvista ongelmista koululle ja huoltajille. Jos lapsi puuttuu tai katoaa, ilmoita heti koululle ja huoltajalle. Jos lapsi voi olla vaarassa, soita 112.]\n\nPerjantai-iltapäivänä kuljettaja tuo esikoululaisen kotipihaan, mutta sovitun vastaanottajan sijasta portilla odottaa tuntematon mies, joka sanoo olevansa perhetuttu ja hakevansa lapsen. Kuljettaja ei luovuta lasta, vaan pitää hänet autossa ja soittaa huoltajalle varmistaakseen tilanteen. Huoltaja kertoo, ettei kukaan muu saa hakea lasta, joten kuljettaja ilmoittaa asiasta välityskeskukseen ja odottaa lapsen kanssa, kunnes huoltaja saapuu paikalle. Lapsi pysyy turvassa, koska kuljettaja varmisti asian ennen luovutusta.\n\nYleisin virhe on jättää lapsi kyydistä, vaikka vastaanottajaa ei näy tai tilanne on epäselvä — silloin pieni lapsi voi jäädä yksin tien varteen tai lähteä väärään suuntaan. Epäselvässä tilanteessa lasta ei koskaan jätetä yksin, vaan asia varmistetaan huoltajalta, koululta tai välityskeskuksesta.\n\nMuista kokeessa: koulukuljetuksessa kuljettaja on vastuussa oleva aikuinen koko matkan ajan — lasta ei koskaan jätetä yksin epäselvässä tilanteessa, luovutus tehdään vain sovitulle vastaanottajalle, ja hätätilanteessa soitetaan 112."}, {"id": "M13", "slug": "customer-service-and-professional-interaction", "title": "Customer Service And Professional Interaction", "en": "Professional service begins at the very first moment: greet the customer in a friendly way and confirm the destination out loud before setting off. Sense whether the customer wants to chat or travel in peace – a professional driver follows the customer's cues and never forces a conversation. Ask about the temperature and music when appropriate, and keep your driving smooth and anticipatory, because a gentle ride is an essential part of the customer experience.\n  [Simplified: Say hello to the customer. Check where they want to go. If the customer does not want to talk, stay quiet. Ask if the temperature and music are okay. Drive calmly and smoothly.]\n\nA professional driver serves every customer equally, regardless of background, language, disability, or the length of the trip. If you share no common language, use simple words, a map, the address written on paper, or a translation app on your phone – calmness and friendliness go a long way. When a customer travels with an assistant, always speak directly to the customer: they are your passenger, not their assistant.\n  [Simplified: Serve all customers the same way. If you do not speak the same language, use a map or a translation app. Speak slowly and clearly. If the customer has an assistant with them, talk directly to the customer.]\n\nA customer gets in at the airport after a long flight and answers the greeting only briefly. The driver confirms the destination, checks that the temperature is comfortable, and notices the customer closing their eyes – so he turns the radio down and lets the customer rest. At the destination the customer thanks him for a peaceful ride: the driver read the situation correctly, because good service is not always about talking but about recognising what the customer needs.\n\nThe most common mistake is setting off without confirming the destination, or responding to a complaint defensively. A wrong address or a curt reply turns a small situation into a formal complaint and costs you the customer's trust.\n\nFor the exam, remember the formula for good service: greet, confirm the destination, adapt the ride to the customer, and handle complaints by listening and apologising. Every customer is served equally – always.\n\nFor a professional, a complaint is an opportunity, not an attack. Let the customer finish without interrupting, apologise sincerely for their experience, and explain how you will put things right – for example by checking the route or telling them where to leave official feedback. A sincere apology is not an admission of guilt; it shows that you take the customer's experience seriously.\n  [Simplified: If a customer complains, listen calmly. Do not interrupt or argue. Say: \"I am sorry.\" Tell them how you will fix it. Also tell them where they can give feedback.]", "fi": "Ammattimainen palvelu alkaa jo ensikohtaamisesta: tervehdi asiakasta ystävällisesti ja varmista määränpää ääneen ennen liikkeelle lähtöä. Tunnustele, haluaako asiakas keskustella vai matkustaa rauhassa – ammattikuljettaja seuraa asiakkaan vihjeitä eikä koskaan pakota asiakasta keskusteluun. Kysy tarvittaessa lämpötilasta ja musiikista, ja pidä ajotapa tasaisena ja ennakoivana, sillä pehmeä kyyti on olennainen osa asiakaskokemusta.\n  [Simplified: Tervehdi asiakasta. Varmista, minne hän on menossa. Jos asiakas ei halua puhua, ole hiljaa. Kysy, onko lämpötila ja musiikki hyvä. Aja rauhallisesti ja tasaisesti.]\n\nAmmattikuljettaja palvelee jokaista asiakasta yhdenvertaisesti riippumatta taustasta, kielestä, vammasta tai matkan pituudesta. Jos yhteistä kieltä ei ole, käytä selkeitä sanoja, karttaa, paperille kirjoitettua osoitetta tai puhelimen käännössovellusta – rauhallisuus ja ystävällisyys kantavat pitkälle. Kun asiakkaalla on mukanaan avustaja, puhu aina suoraan asiakkaalle: hän on matkustajasi, ei hänen avustajansa.\n  [Simplified: Palvele kaikkia asiakkaita samalla tavalla. Jos ette puhu samaa kieltä, käytä karttaa tai käännössovellusta. Puhu rauhallisesti ja selkeästi. Jos asiakkaalla on avustaja, puhu suoraan asiakkaalle.]\n\nAsiakas nousee kyytiin lentokentällä pitkän lennon jälkeen ja vastaa tervehdykseen vain lyhyesti. Kuljettaja varmistaa määränpään, tarkistaa että lämpötila on sopiva ja huomaa asiakkaan sulkevan silmänsä – hän hiljentää radion ja antaa asiakkaan levätä. Perillä asiakas kiittää rauhallisesta matkasta: kuljettaja luki tilanteen oikein, sillä hyvä palvelu ei aina tarkoita puhumista vaan asiakkaan tarpeen tunnistamista.\n\nYleisin virhe on lähteä liikkeelle varmistamatta määränpäätä tai vastata valitukseen puolustellen. Väärä osoite tai tyly vastaus muuttaa pienen tilanteen viralliseksi valitukseksi ja vie asiakkaan luottamuksen.\n\nKoetta varten kannattaa muistaa hyvän palvelun kaava: tervehdi, varmista määränpää, mukauta matka asiakkaan mukaan ja hoida valitus kuuntelemalla ja pahoittelemalla. Jokaista asiakasta palvellaan yhdenvertaisesti – aina.\n\nValitus on ammattilaiselle mahdollisuus, ei hyökkäys. Kuuntele asiakas loppuun keskeyttämättä, pahoittele kokemusta vilpittömästi ja kerro, miten korjaat tilanteen – esimerkiksi tarkistamalla reitin tai neuvomalla, minne virallisen palautteen voi jättää. Vilpitön anteeksipyyntö ei ole syyllisyyden tunnustus, vaan osoitus siitä, että otat asiakkaan kokemuksen vakavasti.\n  [Simplified: Jos asiakas valittaa, kuuntele rauhassa. Älä keskeytä äläkä väitä vastaan. Sano: \"Olen pahoillani.\" Kerro, miten korjaat asian. Kerro myös, minne asiakas voi antaa palautetta.]"}, {"id": "M14", "slug": "journey-agreement-route-and-destination", "title": "Journey Agreement Route And Destination", "en": "Confirm the destination at the start of every journey by repeating it back to the customer – that way misunderstandings are caught before you set off. Agree on the route at the same time: if the customer asks for a particular route, a professional driver follows that wish as long as the route is safe and legal. If the customer expresses no preference, the driver chooses the route that is most economical and appropriate for the customer – this is a core principle of professional taxi driving.\n  [Simplified: Repeat the destination to the customer before you start. If the customer wants a certain route, drive that route. If the customer says nothing, choose the cheapest sensible route for the customer.]\n\nIf congestion, roadworks or an accident arises during the journey, tell the customer immediately and suggest an alternative route before deviating from what was agreed. A route change is always made in mutual understanding: briefly explain the reason and estimate the effect on travel time and price. Open communication keeps the customer calm and prevents fare disagreements at the destination.\n  [Simplified: If there is a traffic jam or the road is blocked, tell the customer right away. Ask if a new route is okay. Say how the change affects the time and the price.]\n\nWhen the customer wants several stops during the journey, go through the stops before setting off and make clear how waiting time affects the price. If the navigation device stops working, stay calm: tell the customer what has happened, rely on your local knowledge, and if needed ask the customer or the dispatch centre for help in confirming the route. A professional driver never continues by guessing – they stop in a safe place to work out the route.\n  [Simplified: Agree on all stops before you start. Explain that waiting can cost extra. If the GPS stops working, tell the customer, use what you know, or ask for help. Stop in a safe place if you do not know the way.]\n\nA customer gets in at the railway station and asks to go to \"Station Street\". The driver repeats the destination and confirms the house number before setting off. On the way, the radio reports an accident on the main road, so the driver immediately tells the customer and suggests an alternative route that adds a few minutes to the journey. The customer accepts the change, and there is no disagreement about the fare on arrival because everything was agreed together.\n\nThe most common mistake is setting off without confirming the destination, or leaving the agreed route without telling the customer. The usual result is a fare dispute, a complaint and lost trust – and in an unclear situation the driver is always in the weaker position.\n\nRemember for the exam and on the job: drive the route the customer requests, and when there is no request, choose the route that is most economical and appropriate for the customer. Tell the customer about every change before you make it.", "fi": "Varmista määränpää heti matkan alussa toistamalla se asiakkaalle ääneen – näin väärinkäsitykset huomataan ennen liikkeelle lähtöä. Sopikaa samalla reitistä: jos asiakas toivoo tiettyä reittiä, ammattikuljettaja noudattaa toivetta, kunhan reitti on turvallinen ja laillinen. Jos asiakas ei ota kantaa, kuljettaja valitsee reitin, joka on asiakkaan kannalta edullisin ja tarkoituksenmukaisin – tämä on ammattimaisen taksinkuljettajan perusperiaate.\n  [Simplified: Toista määränpää asiakkaalle ennen lähtöä. Jos asiakas haluaa tietyn reitin, aja sitä. Jos asiakas ei sano mitään, valitse asiakkaalle halvin ja järkevin reitti.]\n\nJos matkan aikana ilmenee ruuhka, tietyö tai onnettomuus, kerro asiakkaalle heti ja ehdota vaihtoehtoista reittiä ennen kuin poikkeat sovitulta. Reitinmuutos tehdään aina yhteisymmärryksessä: selitä lyhyesti syy ja arvioi muutoksen vaikutus matka-aikaan ja hintaan. Avoin viestintä pitää asiakkaan rauhallisena ja ehkäisee hintaerimielisyyksiä perillä.\n  [Simplified: Jos tulee ruuhka tai tie on poikki, kerro asiakkaalle heti. Kysy, sopiiko uusi reitti. Kerro, miten muutos vaikuttaa aikaan ja hintaan.]\n\nKun asiakas haluaa pysähtyä matkan aikana useassa paikassa, käykää pysähdykset läpi ennen lähtöä ja varmista, miten odotusaika vaikuttaa hintaan. Jos navigaattori lakkaa toimimasta, pysy rauhallisena: kerro asiakkaalle tilanteesta, hyödynnä paikallistuntemustasi ja pyydä tarvittaessa apua asiakkaalta tai välityskeskukselta reitin varmistamiseen. Ammattikuljettaja ei koskaan jatka arvailemalla, vaan pysähtyy turvalliseen paikkaan selvittämään reitin.\n  [Simplified: Sopikaa kaikki pysähdykset ennen lähtöä. Kerro, että odotus voi maksaa lisää. Jos GPS ei toimi, kerro asiakkaalle, käytä omaa tietoasi tai pyydä apua. Pysähdy turvalliseen paikkaan, jos et tiedä reittiä.]\n\nAsiakas nousee kyytiin rautatieasemalla ja pyytää päästä \"Asemakadulle\". Kuljettaja toistaa määränpään ja tarkentaa talonumeron ennen liikkeelle lähtöä. Matkalla radio kertoo onnettomuudesta pääväylällä, joten kuljettaja kertoo tilanteesta heti ja ehdottaa vaihtoehtoista reittiä, joka lisää matkaan muutaman minuutin. Asiakas hyväksyy muutoksen, ja perillä hinnasta ei synny erimielisyyttä, koska kaikki sovittiin yhdessä.\n\nYleisin virhe on lähteä liikkeelle varmistamatta määränpäätä tai poiketa sovitulta reitiltä kertomatta asiakkaalle. Seurauksena on usein hintariita, reklamaatio ja luottamuksen menetys – ja epäselvässä tilanteessa kuljettaja on aina heikommassa asemassa.\n\nMuista kokeessa ja työssä: asiakkaan toivoma reitti ajetaan, ja ilman toivetta valitaan asiakkaalle edullisin ja tarkoituksenmukaisin reitti. Kaikista muutoksista kerrotaan asiakkaalle ennen kuin ne tehdään."}, {"id": "M15", "slug": "stopping-parking-and-safe-pickups", "title": "Stopping Parking And Safe Pickups", "en": "Stopping and parking are two different things: stopping means a brief halt, for example to pick up or drop off a passenger, while parking means leaving the vehicle in place for a longer time. A professional driver always chooses a stopping place so that it does not endanger or unnecessarily obstruct other traffic. Taxi stands are reserved for taxis waiting for customers, and drivers use them in queue order and with respect for their colleagues. Always check the current rules on stopping and parking from official sources.\n  [Simplified: Stopping is a short halt, for example when a customer gets in or out of the car. Parking means leaving the car in place for a longer time. Always stop so that other people can move safely. A taxi stand is a place where taxis wait for customers in turn.]\n\nA customer may ask you to stop somewhere where stopping would be prohibited or dangerous — for example in front of a pedestrian crossing, at a bus stop or in an intersection area. A professional driver calmly declines such a request, explains that it is a matter of safety, and offers the nearest safe alternative. Always let passengers get in and out on the pavement side, and check your mirrors and over your shoulder for cyclists and other traffic coming from behind before a door is opened.\n  [Simplified: Sometimes a customer asks you to stop in a bad place, for example in front of a pedestrian crossing. Say no in a friendly way and find the nearest safe place. Always let the customer out on the pavement side. Check your mirrors before the door is opened, so that no cyclist or car is coming from behind.]\n\nOn a Friday evening, a customer wants to be dropped off right in front of the restaurant door, but stopping there would leave the car on a pedestrian crossing and block a bus stop. The driver calmly explains that it is not safe to stop there and suggests a lay-by about twenty metres away on the side street. The driver stops in the lay-by, checks the mirror for cyclists coming from behind, and lets the customer out on the pavement side. The customer walks the short distance to the restaurant, and everyone stays safe.\n\nThe most common mistake is to stop wherever the customer points — on a pedestrian crossing, a cycle path or at a bus stop — without looking around. A door can then swing open right in front of a cyclist, or a pedestrian is forced to walk around the car on the roadway, and the driver is the one responsible for the dangerous situation.\n\nThe driver — not the customer — always decides where the taxi stops. A safe spot a few dozen metres away is always a better choice than a dangerous spot right at the door.\n\nWhen a customer has reduced mobility or uses an aid such as a rollator or a wheelchair, allow extra time for the pickup and stop as close as possible to a step-free, level spot. Help the customer get into the car and load the mobility aids, and make sure the seat belt is fastened before you drive off — on Kela-reimbursed journeys, for example, assisting the customer from the door to the car is part of professional service. In the dark and in winter conditions, choose a stopping place that is lit and ploughed or gritted, because a slippery or snowy verge is a fall risk, especially for elderly passengers.\n  [Simplified: If the customer has a rollator or a wheelchair, allow more time. Stop at a level spot close to the customer and help them. Make sure the seat belt is fastened before you drive off. In the dark and in winter, choose a lit place that is not slippery.]", "fi": "Pysähtyminen ja pysäköinti ovat eri asioita: pysähtyminen tarkoittaa lyhyttä pysähdystä, esimerkiksi matkustajan kyytiin ottamista tai jättämistä varten, kun taas pysäköinti tarkoittaa ajoneuvon jättämistä paikalleen pidemmäksi aikaa. Ammattikuljettaja valitsee pysähtymispaikan aina niin, ettei se vaaranna eikä tarpeettomasti haittaa muuta liikennettä. Taksiasemat on tarkoitettu asiakkaita odottaville takseille, ja niillä toimitaan jonojärjestyksessä ja muita kuljettajia kunnioittaen. Tarkista voimassa olevat pysähtymistä ja pysäköintiä koskevat säännöt aina virallisista lähteistä.\n  [Simplified: Pysähtyminen on lyhyt pysähdys, esimerkiksi kun asiakas nousee kyytiin tai jää kyydistä. Pysäköinti tarkoittaa, että auto jätetään paikalleen pidemmäksi aikaa. Pysähdy aina niin, että muut voivat liikkua turvallisesti. Taksiasema on paikka, jossa taksit odottavat asiakkaita vuorollaan.]\n\nAsiakas voi pyytää pysähtymään paikkaan, jossa pysähtyminen olisi kiellettyä tai vaarallista – esimerkiksi suojatien eteen, bussipysäkille tai risteysalueelle. Ammattikuljettaja kieltäytyy tällaisesta pyynnöstä rauhallisesti, perustelee kieltäytymisen turvallisuudella ja tarjoaa lähimmän turvallisen vaihtoehdon. Anna matkustajan nousta kyytiin ja poistua kyydistä aina jalkakäytävän puolelta, ja tarkista peileistä ja olan yli, ettei takaa tule pyöräilijöitä tai muuta liikennettä, ennen kuin ovi avataan.\n  [Simplified: Joskus asiakas pyytää pysähtymään huonoon paikkaan, esimerkiksi suojatien eteen. Sano silloin ystävällisesti ei ja etsi lähin turvallinen paikka. Päästä asiakas ulos aina jalkakäytävän puolelta. Katso peileistä ennen oven avaamista, ettei takaa tule pyöräilijää tai autoa.]\n\nPerjantai-iltana asiakas haluaa jäädä kyydistä suoraan ravintolan oven eteen, mutta siinä auto seisoisi suojatiellä ja tukkisi bussipysäkin. Kuljettaja kertoo rauhallisesti, ettei voi pysähtyä siihen turvallisesti, ja ehdottaa parinkymmenen metrin päässä sivukadulla olevaa levennystä. Hän pysähtyy levennykseen, tarkistaa peilistä, ettei takaa tule pyöräilijää, ja päästää asiakkaan ulos jalkakäytävän puolelta. Asiakas kävelee lyhyen matkan ravintolaan, ja kaikki pysyvät turvassa.\n\nYleisin virhe on pysähtyä siihen, mihin asiakas osoittaa – suojatielle, pyörätielle tai bussipysäkille – katsomatta ympärille. Silloin ovi voi avautua suoraan pyöräilijän eteen tai jalankulkija joutuu kiertämään auton ajoradan kautta, ja vastuu vaaratilanteesta on kuljettajalla.\n\nKuljettaja – ei asiakas – päättää aina, mihin taksi pysähtyy. Turvallinen paikka muutaman kymmenen metrin päässä on aina parempi valinta kuin vaarallinen paikka suoraan oven edessä.\n\nKun asiakkaalla on liikkumista rajoittava vamma tai apuväline, kuten rollaattori tai pyörätuoli, varaa noutoon enemmän aikaa ja pysähdy mahdollisimman lähelle esteetöntä ja tasaista kohtaa. Auta asiakasta autoon nousemisessa ja apuvälineiden lastaamisessa, ja varmista, että turvavyö on kiinnitetty ennen liikkeelle lähtöä – esimerkiksi Kelan korvaamilla matkoilla asiakkaan avustaminen ovelta autoon on osa ammattimaista palvelua. Pimeällä ja talvikelillä valitse pysähtymispaikka, joka on valaistu ja aurattu tai hiekoitettu, sillä liukas tai luminen piennar on kaatumisriski etenkin iäkkäille matkustajille.\n  [Simplified: Jos asiakkaalla on rollaattori tai pyörätuoli, varaa enemmän aikaa. Pysähdy tasaiseen paikkaan lähelle asiakasta ja auta häntä. Varmista, että turvavyö on kiinni ennen kuin lähdet. Pimeällä ja talvella valitse valaistu paikka, jossa ei ole liukasta.]"}, {"id": "M16", "slug": "general-traffic-safety-anticipation-and-conditions", "title": "General Traffic Safety Anticipation And Conditions", "en": "A professional driver's most important safety skill is anticipation: read the traffic far ahead, watch what other road users intend to do, and prepare for surprises early. Always match your speed to the weather and visibility — the speed limit is the maximum allowed, not a target speed. Keep a sufficient safety distance to the vehicle ahead and increase it in rain, darkness and on slippery roads, because braking distances grow many times longer in winter conditions.\n  [Simplified: Look far ahead and be ready for other people's mistakes. Drive slower when it rains, when it is dark, or when the road is slippery. Keep a long gap to the car in front — even longer on ice.]\n\nPedestrians, cyclists and e-scooter riders are the most vulnerable people in traffic — always approach pedestrian crossings and intersections slowing down and ready to stop, especially in the dark and near schools and bus stops. At an intersection, use eye contact to make sure others have actually seen you, and never pass a vehicle that has stopped in front of a crossing without stopping yourself. When you hear or see an emergency vehicle, make room for it calmly and predictably: pull over or stop in a safe place, avoiding sudden movements.\n  [Simplified: People walking and cycling get hurt easily. Always slow down near crossings and intersections and be ready to stop. Give way to emergency vehicles: move aside calmly.]\n\nA November morning: the temperature is around zero, and bridges may be covered in black ice even though the rest of the road looks bare. Taxi driver Jonas picks up a customer for an airport ride and sets off earlier than usual. He tests his brakes gently on a quiet straight to check the grip, drives clearly below the limit and keeps double the normal safety distance. Approaching the bridge he eases off the accelerator early and avoids sudden steering — the customer makes the flight because the driver budgeted extra time for the conditions.\n\nThe most common mistake is driving at the posted limit regardless of conditions while following too closely: on a slippery road the braking distance can multiply, and a rear-end collision happens before you can react. Being in a hurry never shortens your braking distance — it only takes away the time you need to react.\n\nRemember for the exam and on the job: the speed limit is always a ceiling, not a target — the right speed is set by the weather, visibility and traffic situation. An anticipating driver is not caught by surprise, and the emergency number in Finland is 112.\n\nFatigue weakens perception and lengthens reaction time as dangerously as intoxication — take breaks during long shifts and never start driving tired. Operate the taximeter, navigation and dispatch app only while the car is safely stopped; a passenger would rather wait a moment than be put at risk. If your car breaks down on the road, put on a reflective vest before leaving the vehicle, place the warning triangle far enough behind the car, guide your passengers to a safe place well away from the roadway, and call the emergency number 112 if needed.\n  [Simplified: Never drive when you are tired — take breaks. Use the meter and apps only when the car is stopped. If the car breaks down: put on a reflective vest, place the warning triangle behind the car and move passengers away from the road. In an emergency, call 112.]", "fi": "Ammattikuljettajan tärkein turvallisuustaito on ennakointi: lue liikennettä pitkälle eteenpäin, tarkkaile muiden tienkäyttäjien aikeita ja varaudu yllätyksiin ajoissa. Sovita nopeus aina keliin ja näkyvyyteen — nopeusrajoitus kertoo suurimman sallitun nopeuden, ei tavoitenopeutta. Pidä edellä ajavaan riittävä turvaväli ja kasvata sitä sateella, pimeällä ja liukkaalla, sillä jarrutusmatka pitenee talvikelillä moninkertaiseksi.\n  [Simplified: Ennakoi: katso kauas eteenpäin ja varaudu muiden virheisiin. Aja hitaammin, kun sataa, on pimeää tai liukasta. Pidä pitkä väli edessä ajavaan autoon — liukkaalla vielä pidempi.]\n\nJalankulkijat, pyöräilijät ja sähköpotkulautailijat ovat liikenteen haavoittuvimpia — lähesty suojateitä ja risteyksiä aina hidastaen ja valmiina pysähtymään, erityisesti pimeällä sekä koulujen ja pysäkkien lähellä. Risteyksessä varmista katsekontaktilla, että muut ovat havainneet sinut, äläkä koskaan ohita suojatien eteen pysähtynyttä ajoneuvoa pysähtymättä itse. Kun kuulet tai näet hälytysajoneuvon, tee sille tilaa rauhallisesti ja ennakoitavasti: siirry sivuun tai pysähdy turvalliseen paikkaan äkkinäisiä liikkeitä välttäen.\n  [Simplified: Jalankulkijat ja pyöräilijät loukkaantuvat helposti. Hidasta aina suojatien ja risteyksen lähellä ja ole valmis pysähtymään. Anna tietä hälytysajoneuvolle: siirry rauhallisesti sivuun.]\n\nMarraskuinen aamu: lämpötila on nollan tuntumassa, ja sillat voivat olla mustan jään peitossa, vaikka muu tie näyttää paljaalta. Taksinkuljettaja Jonas hakee asiakkaan lentokenttäkyydille ja lähtee liikkeelle tavallista aikaisemmin. Hän kokeilee jarrutusta varovasti hiljaisella suoralla tunnustellakseen pitoa, ajaa selvästi rajoitusta hitaammin ja pitää kaksinkertaisen turvavälin. Sillalle tullessaan hän hellittää kaasua hyvissä ajoin eikä tee äkkinäisiä ohjausliikkeitä — asiakas ehtii koneeseen, koska kuljettaja varasi aikaa kelin mukaan.\n\nYleisin virhe on ajaa nopeusrajoituksen mukaan kelistä välittämättä ja liian lähellä edellä ajavaa: liukkaalla jarrutusmatka voi moninkertaistua, ja peräänajo tapahtuu ennen kuin ehdit reagoida. Kiire ei koskaan lyhennä jarrutusmatkaa — se vie vain reagointiin tarvittavan ajan.\n\nMuista kokeessa ja työssä: nopeusrajoitus on aina yläraja, ei tavoite — oikea nopeus määräytyy kelin, näkyvyyden ja liikennetilanteen mukaan. Ennakoiva kuljettaja ei joudu yllätetyksi, ja hätänumero Suomessa on 112.\n\nVäsymys heikentää havainnointia ja pidentää reaktioaikaa yhtä vaarallisesti kuin päihtymys — pidä taukoja pitkien vuorojen aikana äläkä koskaan lähde ajoon väsyneenä. Käsittele taksamittaria, navigaattoria ja välityssovellusta vain auton seistessä turvallisesti; matkustaja odottaa mieluummin hetken kuin joutuu vaaraan. Jos auto rikkoutuu tielle, pue heijastinliivi ennen autosta poistumista, aseta varoituskolmio riittävän kauas auton taakse, ohjaa matkustajat turvalliseen paikkaan kauas ajoradasta ja soita tarvittaessa hätänumeroon 112.\n  [Simplified: Väsyneenä ei saa ajaa — pidä taukoja. Käytä mittaria ja sovelluksia vain, kun auto seisoo. Jos auto hajoaa: pue heijastinliivi, vie varoituskolmio auton taakse ja ohjaa matkustajat pois tieltä. Hätätilanteessa soita 112.]"}, {"id": "M17", "slug": "communication-devices-and-driver-distraction", "title": "Communication Devices And Driver Distraction", "en": "The phone and the dispatch system are essential tools for a taxi driver, but while driving every device competes with the traffic for your attention. A professional driver uses devices on the move only hands-free, and only when it is genuinely necessary for the transport – for example, to acknowledge a ride offer. All other use waits until the car is safely stopped. Check the current legal requirements on device use while driving from official sources.\n  [Simplified: Your phone pulls your attention away from the traffic. While driving, use hands-free only, and only when the ride truly requires it. For everything else: stop first. Device use while driving is regulated by law – check the requirements from offi
