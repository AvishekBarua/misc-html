<title>Taxi Driver's Licence – Study Guide (Law-Verified)</title>
<style>
  :root{--bg:#f0f2f5;--surface:#fff;--border:#dde1e8;--text:#1a1a1a;--text-muted:#666;--accent:#1b4f8a;--accent-light:#e8f0fb;--shadow:0 1px 4px rgba(0,0,0,.08);--category-bg:#f0f4ff;--category-text:#2a4a8a;--ptab-bar:#1b4f8a;--ptab-active-bg:#fff;--ptab-active-text:#1b4f8a;--ptab-inactive-text:rgba(255,255,255,.72);--ptab-inactive-hover:rgba(255,255,255,.13);--ctab-bar:#f8f9fb;--ctab-active-text:#1b4f8a;--ctab-active-border:#1b4f8a;--ctab-inactive-text:#555;--simplified-bg:#fffbea;--simplified-border:#f0d060;--simplified-text:#7a5800;--legal-bg:#fff0f0;--legal-border:#f0a0a0;--legal-text:#8b0000;--correct-bg:#e6f4ea;--correct-text:#1a6e36;--conflict-bg:#fff8e1;--conflict-border:#f9a825;--new-lesson-bg:#f0f7ff;--new-lesson-border:#1b4f8a}

  *{box-sizing:border-box;margin:0;padding:0}

  .header-divider{width:1px;height:22px;background:rgba(255,255,255,.22);flex-shrink:0}
  .btn{border:none;border-radius:6px;padding:6px 13px;font-size:.78rem;font-weight:600;cursor:pointer;transition:opacity .15s;white-space:nowrap}
  .btn:hover{opacity:.82}
  .btn-expand{background:#27ae60;color:#fff}

  .btn-ai{display:inline-flex;align-items:center;gap:5px;text-decoration:none;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff}

  .btn-ai .ai-label{display:inline}
  @media(max-width:520px){.btn-ai .ai-label{display:none}}
  .qa-controls{display:flex;gap:7px}
  .parent-tabs-bar{background:var(--ptab-bar);border-bottom:3px solid rgba(255,255,255,.12);display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:52px;z-index:190}

  .ptab-btn{background:none;border:none;color:var(--ptab-inactive-text);font-size:.84rem;font-weight:600;padding:13px 24px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;transition:background .15s,color .15s,border-color .15s;letter-spacing:.01em}

  .ctab-btn{background:none;border:none;padding:10px 14px;font-size:.78rem;font-weight:600;color:var(--ctab-inactive-text);cursor:pointer;border-bottom:3px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;margin-bottom:-2px}
  .ctab-btn:hover{color:var(--accent)}
  .ctab-btn.active{color:var(--ctab-active-text);border-bottom-color:var(--ctab-active-border)}

  .child-panel.active{display:block}
  .main{max-width:860px;margin:0 auto;padding:20px 16px 56px}
  .q-group{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
  .q-group-header{display:flex;align-items:center;gap:11px;padding:13px 16px;cursor:pointer;user-select:none;transition:background .15s}
  .q-group-header:hover{background:var(--accent-light)}

  .q-category{background:var(--category-bg);color:var(--category-text);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:2px 7px;flex-shrink:0}

  .q-question-en{font-size:.88rem;font-style:italic;color:var(--text-muted);margin-bottom:18px;line-height:1.5}
  .answers-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .answer-row{border:1px solid var(--border);border-radius:7px;padding:10px 13px;background:var(--bg)}
  .answer-letter{display:inline-block;font-weight:700;font-size:.85rem;color:var(--accent);min-width:18px;margin-bottom:2px}
  .answer-fi{font-size:.91rem;line-height:1.5}
  .answer-en{font-size:.83rem;font-style:italic;color:var(--text-muted);line-height:1.4;margin-top:2px}
  .correct-answer-box{background:var(--correct-bg);border:1px solid var(--correct-text);border-radius:8px;padding:12px 16px;margin-top:4px}

  .correct-answer-box .ca-letter{font-size:1.05rem;font-weight:800;color:var(--correct-text)}

  .conflict-box{background:var(--conflict-bg);border:1px solid var(--conflict-border);border-radius:8px;padding:10px 14px;margin-top:8px;font-size:.82rem;color:var(--text);line-height:1.5}
  .conflict-box .cf-label{font-weight:700;color:#b8860b;margin-bottom:4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
  .lessons-main{max-width:860px;margin:0 auto;padding:20px 16px 56px}
  .lesson-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
  .lesson-card.new-lesson{border-color:var(--new-lesson-border);background:var(--new-lesson-bg)}
  .lesson-header{display:flex;align-items:center;gap:11px;padding:14px 16px;cursor:pointer;user-select:none;transition:background .15s}

  .lesson-id{background:var(--accent);color:#fff;font-weight:700;font-size:.78rem;border-radius:5px;padding:3px 9px;flex-shrink:0;font-family:monospace}
  .new-badge{background:#27ae60;color:#fff;font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:4px;flex-shrink:0;letter-spacing:.04em}
  .lesson-title{color:var(--text);font-size:.9rem;font-weight:600;flex:1}
  .lesson-chevron{color:var(--text-muted);font-size:.72rem;transition:transform .2s;flex-shrink:0}
  .lesson-card.open .lesson-chevron{transform:rotate(180deg)}
  .lesson-body{display:none;border-top:1px solid var(--border)}
  .lesson-card.open .lesson-body{display:block}
  .lesson-content{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .lesson-col{padding:16px 18px 20px}
  .lesson-col:first-child{border-right:1px solid var(--border)}
  .lesson-col-label{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:5px}
  .lesson-text{font-size:.92rem;line-height:1.72;white-space:pre-wrap;word-break:break-word}
  .simplified{display:block;background:var(--simplified-bg);border-left:3px solid var(--simplified-border);color:var(--simplified-text);border-radius:0 6px 6px 0;padding:8px 12px;margin:8px 0;font-size:.85rem;font-style:italic}
  .legal-note{display:block;background:var(--legal-bg);border-left:3px solid var(--legal-border);color:var(--legal-text);border-radius:0 6px 6px 0;padding:8px 12px;margin:8px 0;font-size:.85rem}
  .section-divider{margin:18px 0 10px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);padding-bottom:6px;border-bottom:1px solid var(--border)}
  @media(max-width:640px){.lesson-content{grid-template-columns:1fr}.lesson-col:first-child{border-right:none;border-bottom:1px solid var(--border)}}
  @media(max-width:600px){header{padding:0 12px}.header-brand h1{font-size:.88rem}.btn{padding:5px 9px;font-size:.72rem}.ptab-btn{padding:11px 15px;font-size:.78rem}.main,.lessons-main{padding:12px 10px 40px}.qa-controls .btn-expand,.qa-controls .btn-collapse{display:none}}
  .vocab-section{padding:16px 18px 20px;border-top:1px solid var(--border)}
  .vocab-section-label{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .vocab-table{width:100%;border-collapse:collapse;font-size:.83rem}
  .vocab-table thead th{text-align:left;padding:6px 10px 8px;border-bottom:2px solid var(--border);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)}
  .vocab-table tbody tr:not(:last-child) td{border-bottom:1px solid var(--border)}
  .vocab-table td{padding:8px 10px;vertical-align:top;line-height:1.5}
  .vocab-fi{font-weight:700;color:var(--text);font-size:.9rem}
  .vocab-roots{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px}
  .vocab-root-pill{display:inline-block;background:var(--accent-light);color:var(--accent);border-radius:3px;padding:1px 6px;font-size:.72rem;font-family:monospace;font-weight:600}
  .vocab-root-detail{font-size:.78rem;color:var(--text-muted);margin-top:3px}
  .vocab-en{font-weight:600;color:var(--text)}
  .vocab-group-header{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:var(--accent-light);padding:4px 10px;border-bottom:1px solid var(--border)}
  @media(max-width:500px){.vocab-table thead th:nth-child(2){display:none}.vocab-table td:nth-child(2){display:none}}
  .vocab-link{color:var(--accent);text-decoration:underline dotted;text-underline-offset:2px;cursor:pointer;font-weight:600;background:none;border:none;padding:0;font-size:inherit;font-family:inherit}
  .vocab-link:hover{text-decoration:underline solid}
  @keyframes vocab-flash{0%{background:var(--accent-light)}60%{background:var(--accent-light)}100%{background:transparent}}
  .vocab-row-highlight{animation:vocab-flash 1.8s ease-out}
</style>
</head>

<script>
const QUESTIONS=[{"num":1,"category":"PASSENGER SAFETY","fi":"Päihtynyt asiakas haluaa kyytiin. Miten ammattitaitoinen kuljettaja arvioi kuljetuksen sopivuuden ennen matkaa?","en":"An intoxicated customer wants a ride. How does a skilled driver assess whether the transport is suitable before the trip?","answers":{"A":{"fi":"Ottaa aina kyytiin kenet tahansa asiakkaan tilasta riippumatta, koska kieltäytyminen ei ole koskaan sallittua","en":"Always takes anyone on board regardless of the customer's condition, because refusing is never allowed"},"B":{"fi":"Kieltäytyy automaattisesti jokaisesta päihtyneestä asiakkaasta ilman minkäänlaista arviointia","en":"Automatically refuses every intoxicated customer without any assessment at all"},"C":{"fi":"Arvioi asiakkaan yleistilan ja kyvyn viestiä ja tekee kuljetuspäätöksen turvallisuuden ja ammatillisen harkinnan perusteella","en":"Assesses the customer's general condition and ability to communicate, and makes the transport decision based on safety and professional judgement"}}},{"num":2,"category":"TRAFFIC SAFETY","fi":"Miten toimit, kun ajoneuvon rengas puhkeaa kesken ajon?","en":"What do you do when a tyre punctures during driving?","answers":{"A":{"fi":"Pysähdyt turvalliseen paikkaan ja vaihdat renkaan.","en":"Stop in a safe place and change the tyre."},"B":{"fi":"Soitat huoltopalveluun ja odotat apua.","en":"Call roadside assistance and wait for help."},"C":{"fi":"Jatkat matkaa hitaasti.","en":"Continue driving slowly."}}},{"num":3,"category":"PASSENGER SAFETY","fi":"Miksi potilaan jalat tuetaan tai kiinnitetään paareilla ylävartalon ja lantion vöiden lisäksi?","en":"Why are the patient's legs supported or secured on the stretcher in addition to the upper-body and pelvic belts?","answers":{"A":{"fi":"Jotta jalat eivät pääse jarrutuksessa tai kaarteessa liikkumaan ja aiheuta loukkaantumista","en":"So that the legs cannot move during braking or in a bend and cause injury"},"B":{"fi":"Jotta potilas ei pääse poistumaan kyydistä ilman lupaa","en":"So that the patient cannot leave the vehicle without permission"},"C":{"fi":"Jaloille tarkoitettuja vöitä ei ole olemassa eikä jalkoja tarvitse huomioida","en":"Belts for the legs do not exist and the legs do not need to be considered"}}},{"num":4,"category":"TRAFFIC SAFETY","fi":"Jätät matkustajan kadun varteen. Miten varmistat turvallisen poistumisen?","en":"You are dropping a passenger off at the roadside. How do you ensure a safe exit?","answers":{"A":{"fi":"Kehotat matkustajaa avaamaan oven heti auton pysähdyttyä liikennettä tarkistamatta.","en":"You tell the passenger to open the door as soon as the car stops, without checking the traffic."},"B":{"fi":"Pysähdyt niin, että matkustaja voi poistua jalkakäytävän puolelle, ja tarkistat erityisesti takaa tulevat pyöräilijät ennen ovien avaamista.","en":"You stop so that the passenger can exit onto the pavement side, and you check especially for cyclists coming from behind before the doors are opened."},"C":{"fi":"Pysäytät ajoradan vasempaan reunaan, jotta matkustaja pääsee nopeasti ulos.","en":"You stop at the left edge of the carriageway so the passenger can get out quickly."}}},{"num":5,"category":"PASSENGER SAFETY","fi":"Mikä seuraavista väittämistä on oikein?","en":"Which of the following statements is correct?","answers":{"A":{"fi":"Lapsi voi matkustaa ilman turvalaitetta takapenkillä.","en":"A child may travel without a safety device on the back seat."},"B":{"fi":"Alle 3-vuotias ei saa matkustaa ilman huoltajan kirjallista lupaa.","en":"A child under 3 may not travel without the guardian's written permission."},"C":{"fi":"Alle 135 cm lapsi tarvitsee aina turvalaitteen.","en":"A child under 135 cm always needs a safety device."}}},{"num":6,"category":"CUSTOMER SERVICE","fi":"Milloin asiakkaalle pitää antaa kuitti taksimatkasta?","en":"When must a receipt be given to the customer for a taxi trip?","answers":{"A":{"fi":"Jos hinta on kiinteä.","en":"If the fare is fixed."},"B":{"fi":"Aina kyydistä on annettava kuitti.","en":"A receipt must always be given for the ride."},"C":{"fi":"Jos kyyti tilattiin sovelluksella.","en":"If the ride was booked via an app."}}},{"num":7,"category":"PASSENGER SAFETY","fi":"Iäkäs matkustaja saapuu kotiovelleen illalla ja tarvitsee apua liikkumiseen. Milloin kuljettaja voi katsoa tehtävänsä päättyneeksi?","en":"An older passenger who needs help moving about arrives at their front door in the evening. When can the driver consider the task complete?","answers":{"A":{"fi":"Kun matkustaja on noussut autosta jalkakäytävälle.","en":"When the passenger has stepped out of the car onto the pavement."},"B":{"fi":"Kun hän on varmistanut, että matkustaja on päässyt turvallisesti sisälle.","en":"When they have made sure the passenger has got safely indoors."},"C":{"fi":"Heti kun matkustaja on maksanut kyydin.","en":"As soon as the passenger has paid for the ride."}}},{"num":8,"category":"REGULATION & RESPONSIBILITY","fi":"2 of 20 correct","en":"A person applying for a taxi driver's licence must meet certain health requirements. How is meeting health requirements demonstrated?","answers":{"A":{"fi":"Lääkärin tarkastuksella ja siitä saatavalla todistuksella taksinkuljettajan ajolupaa hakiessa.","en":"By a doctor's examination and certificate obtained when applying for the taxi driver's licence."},"B":{"fi":"Omalla kirjallisella terveydentilaa koskevalla raportilla.","en":"By a self-written report on health status."},"C":{"fi":"Terveydentilaa ei tarvitse todentaa millään tavalla.","en":"Health status does not need to be proven in any way."}}},{"num":9,"category":"PASSENGER SAFETY","fi":"Rollaattorilla liikkuva matkustaja lähestyy taksia. Miten toimit ammattimaisesti ennen kuin autat häntä?","en":"A passenger using a rollator approaches the taxi. How do you act professionally before helping them?","answers":{"A":{"fi":"Kysyn matkustajalta, haluaako hän apua ja millaista apua, ennen kuin kosken häneen tai apuvälineeseen.","en":"I ask the passenger whether they want help and what kind, before touching them or the aid."},"B":{"fi":"Nostan matkustajan suoraan kainaloista autoon säästääkseni aikaa.","en":"I lift the passenger straight into the car by the armpits to save time."},"C":{"fi":"Tartun rollaattoriin ja työnnän sen sivuun, jotta matkustaja pääsee nopeasti autoon.","en":"I grab the rollator and push it aside so the passenger can get into the car quickly."}}},{"num":10,"category":"PASSENGER SAFETY","fi":"Kun potilas puretaan ajoneuvosta perillä, miten kuljettaja toimii turvallisesti?","en":"When the patient is unloaded from the vehicle at the destination, how does the driver act safely?","answers":{"A":{"fi":"Vetää paarit ulos vauhdilla ja antaa niiden laskeutua omalla painollaan alustalle","en":"Pull the stretcher out at speed and let it drop onto the surface under its own weight"},"B":{"fi":"Avaa turvavyöt jo ennen kuin paarit on saatu kokonaan ulos ajoneuvosta","en":"Undo the safety belts before the stretcher has been fully brought out of the vehicle"},"C":{"fi":"Avaa paarien lukituksen vasta, kun paarit on tuettu ja pyörät ovat maassa tai laskumekanismi on hallinnassa","en":"Release the stretcher lock only once the stretcher is supported and the wheels are on the ground or the lowering mechanism is under control"}}},{"num":11,"category":"PASSENGER SAFETY","fi":"Miten toimit, kun koulukuljetuksissa huomaat, että olet myöhässä ja olosuhteet ovat sellaiset, että tiedät ettet ehdi kaikkia lapsia hakemaan?","en":"What do you do in school transport when you notice you are late and conditions are such that you know you will not be able to pick up all the children?","answers":{"A":{"fi":"Ajan ylinopeutta, jotta ehdin hakea kaikki lapset ajoissa","en":"I drive over the speed limit so I can pick up all the children in time"},"B":{"fi":"Jatkan reittiä normaalisti enkä kerro asiasta kenellekään","en":"I continue the route as normal and do not tell anyone about the situation"},"C":{"fi":"Soitan työnantajall ":"Why are regular breaks important in taxi work?","answers":{"A":{"fi":"Tauot pitää pitää vain, jos asiakkaita ei ole jonossa","en":"Breaks should only be taken if there are no customers in the queue"},"B":{"fi":"Tauot ovat tarpeettomia, jos kuljettaja juo tarpeeksi kahvia","en":"Breaks are unnecessary if the driver drinks enough coffee"},"C":{"fi":"Tauot ylläpitävät vireyttä, vähentävät väsymystä ja antavat keholle mahdollisuuden palautua","en":"Breaks maintain alertness, reduce fatigue and give the body a chance to recover"}}},{"num":145,"category":"REGULATION & RESPONSIBILITY","fi":"Missä asiakkaan tulee istua autossa turvallisuuden vuoksi?","en":"Where must the customer sit in the car for safety?","answers":{"A":{"fi":"Takapenkillä etupenkin takana kuljettajan vieressä.","en":"On the back seat behind the front seat, next to the driver."},"B":{"fi":"Takapenkillä kuljettajan vieressä.","en":"On the back seat next to the driver."},"C":{"fi":"Etupenkillä kuljettajan vieressä.","en":"In the front seat next to the driver."}}},{"num":146,"category":"REGULATION & RESPONSIBILITY","fi":"Mikä seuraavista voi olla esteenä Taksinkuljettajan ajoluvan myöntämiselle?","en":"Which of the following can prevent granting a taxi driver's licence?","answers":{"A":{"fi":"Toisen asteen koulutuksen suorittamatta jättäminen.","en":"Not completing upper secondary education."},"B":{"fi":"Alle vuoden voimassa ollut B-luokan ajo-oikeus.","en":"Category B driving licence valid for less than one year."},"C":{"fi":"Yli kolme vuotta kestänyt työttömyys.","en":"Unemployment lasting over three years."}}},{"num":147,"category":"PASSENGER SAFETY","fi":"Kesken matkan iäkkään matkustajan suupieli alkaa roikkua, puhe puuroutuu ja toinen käsi herpaantuu. Mihin oireet voivat viitata ja miten kuljettaja toimii?","en":"During the ride, an older passenger's mouth begins to droop, their speech becomes slurred, and one arm goes weak. What might these signs indicate and how should the driver act?","answers":{ an hengitystä, kunnes apu saapuu.","en":"I turn the customer into the recovery position and monitor breathing until help arrives."},"C":{"fi":"Pidän asiakkaan selällään ja annan vettä juotavaksi.","en":"I keep the customer on their back and give them water to drink."}}},{"num":196,"category":"CUSTOMER SERVICE","fi":"Asiakas ei kuule puhettasi lainkaan. Mikä on hyvä tapa varmistaa viestin perillemeno?","en":"The passenger cannot hear your speech at all. What is a good way to make sure the message gets through?","answers":{"A":{"fi":"Puhun hyvin nopeasti ja pitkin lausein, jotta ehdin kertoa kaiken","en":"Speak very fast and in long sentences so I can tell everything"},"B":{"fi":"Toistan saman lauseen yhä kovempaa","en":"Repeat the same sentence louder and louder"},"C":{"fi":"Kirjoitan viestin puhelimen näytölle tai paperille ja näytän sen asiakkaalle","en":"Write the message on a phone screen or on paper and show it to the passenger"}}},{"num":197,"category":"CUSTOMER SERVICE","fi":"Miten kuljettajan tulee toimia kun hän huomaa perille päästyään ettei saa asiakasta hereille matkan päätyttyä ja kyyti on maksamatta?","en":"How should the driver act when, upon arrival, they cannot wake the customer after the trip ends and the ride is unpaid?","answers":{"A":{"fi":"Kuljettajan tulee puheella ensin yrittää herätellä asiakasta ja tarvittaessa soittaa poliisi paikalle.","en":"The driver should first try verbally to wake the customer and, if necessary, call the police to the scene."},"B":{"fi":"Kirjoittaa asiakkaalle laskun ja sijoittaa sen asiakkaan taskuun. Asiakas tulee siirtää taksin ulkopuolelle heräilemään ja soittaa poliisi paikalle.","en":"Write an invoice for the customer and put it in their pocket. Move the customer outside the taxi to wake up and call the police."},"C":{"fi":"Otetaan asiakkaan lompakosta maksukortti ja veloitetaan kyyti lähimaksulla.","en":"Take the customer's payment card from their wallet and charge the ride with contactless payment."}}},{"num":198,"category":"CUSTOMER SERVICE","fi":"Miten toimit, kun asiakkaalla on käteisellä maksamisen vaikeuksia?","en":"What do you do when a customer has difficulty paying with cash?","answers":{"A":{"fi":"Ehdotat asiakkaalle, että hän maksaa yleisimmällä maksukortilla.","en":"You suggest they pay with a common payment card."},"B":{"fi":"Ehdotat asiakkaalle, että hän hakee rahaa läheiseltä pankkiautomaatilta.","en":"You suggest they get money from a nearby ATM."},"C":{"fi":"Matka perutaan, jos asiakkaalla ei ole käteistä.","en":"The trip is cancelled if the customer has no cash."}}},{"num":199,"category":"PASSENGER SAFETY","fi":"Yleinen hätänumero on?","en":"The general emergency number is?","answers":{"A":{"fi":"112","en":"112"},"B":{"fi":"119","en":"119"},"C":{"fi":"118","en":"118"}}},{"num":200,"category":"Which of the following is good customer service related to the use of communication devices?","fi":"Mikä seuraavista on hyvää viestimien käyttöön liittyvää asiakaspalvelua?","en":"Which of the following is good customer service related to the use of communication devices?","answers":{"A":{"fi":"Kuljettaja voi lähettää viestejä, jos puhelin on äänettömällä","en":"The driver may send messages if the phone is on silent"},"B":{"fi":"Kuljettaja voi puhua henkilökohtaisia puheluita, jos asiakas antaa siihen luvan","en":"The driver may make personal phone calls if the customer gives permission"},"C":{"fi":"Puhelun soittaminen, jos se kuljetuksen suorittamiseksi on välttämätön","en":"Making a phone call if it is necessary to carry out the transport"}}},{"num":201,"category":"As a road user, through their profession the taxi driver must focus only on customer service.","fi":"Millä tavoin taksinkuljettajan tulee toimia liikenteessä, jotta hän täyttää tienkäyttäjän ennakointivelvollisuuden?","en":"In what way must the taxi driver act in traffic to fulfil the road user's duty of anticipation?","answers":{"A":{"fi":"Taksinkuljettajan on tienkäyttäjänä käytettävä vain moottorijar äsee liikkumaan vapaasti","en":"Only by the ankles, so that the upper body can move freely"}}},{"num":205,"category":"PASSENGER SAFETY","fi":"Mitä seuraavassa kolme väittämää koskien taksinkuljettajan velvollisuuksia. Mikä niistä on oikein?","en":"Which of the following three statements about a taxi driver's obligations is correct?","answers":{"A":{"fi":"Kuljettajan tulee huolehtia, että alle 3-vuotias lapsi istuu etupenkillä, kun hänellä on käytössä turvalaite.","en":"The driver must ensure that a child under 3 sits in the front seat when using a safety device."},"B":{"fi":"Kuljettajan tulee huolehtia, että yli 3-vuotias lapsi matkustaa ilman turvalaitetta, kun hän istuu takapenkillä ja on turvavöissä.","en":"The driver must ensure that a child over 3 travels without a safety device when sitting in the back seat with seat belts."},"C":{"fi":"Kuljettajan tulee huolehtia, että alle 135 cm:n pituinen lapsi tarvitsee aina hyväksytyn turvalaitteen matkustaessaan taksissa.","en":"The driver must ensure that a child under 135 cm in height always needs an approved safety device when travelling in a taxi."}}},{"num":206,"category":"PASSENGER SAFETY","fi":"Matkustaja on siirtynyt autoon rollaattorin avulla. Mitä teet rollaattorille matkan ajaksi?","en":"The passenger has moved into the car with the help of a rollator. What do you do with the rollator for the journey?","answers":{"A":{"fi":"Jätän rollaattorin pystyyn takapenkille ilman kiinnitystä matkustajan viereen.","en":"I leave the rollator upright and unsecured on the back seat next to the passenger."},"B":{"fi":"Jätän rollaattorin jalkakäytävälle, koska matkustaja saa uuden perille päästyään.","en":"I leave the rollator on the pavement, because the passenger will get a new one on arrival."},"C":{"fi":"Taitan rollaattorin kokoon ja kiinnitän sen kuljetuksen ajaksi tavaratilaan tai muuten turvallisesti niin, ettei se pääse liikkumaan.","en":"I fold the rollator and secure it in the luggage compartment or otherwise safely kkaan saatavilla, ja pyydettäessä matkasta annetaan hinta-arvio.","en":"Price information should be available to the customer, and on request a price estimate is given for the trip."}}},{"num":210,"category":"CUSTOMER SERVICE","fi":"Mikä seuraavista on paras tapa toimia kohdatessasi näkövammaisen asiakkaan?","en":"Which of the following is the best way to act when meeting a visually impaired customer?","answers":{"A":{"fi":"Ottaa asiakasta olkapäästä kiinni ja avustaa hänet autoon kevyesti työntäen.","en":"Take the customer by the shoulder and help them into the car by gently pushing."},"B":{"fi":"Kysyä asiakkaalta, miten häntä voi parhaiten auttaa, ja kertoa, missä suunnassa auto on.","en":"Ask the customer how you can best help them and tell them in which direction the car is."},"C":{"fi":"Puhua hiukan normaalia puheääntä kovemmalla äänellä.","en":"Speak somewhat louder than your normal speaking voice."}}},{"num":211,"category":"PASSENGER SAFETY","fi":"Miten sinun tulee toimia, jos taksissasi matkustava asiakas käyttäytyy aggressiivisesti sinua kohtaan?","en":"How must you act if a customer travelling in your taxi behaves aggressively toward you?","answers":{"A":{"fi":"Rauhoittelet häntä puhumalla hänelle rauhallisesti ja ystävällisesti.","en":"You calm them by speaking to them calmly and kindly."},"B":{"fi":"Käyttäydyt kuin et huomaisikaan hänen aggressiivisuuttaan.","en":"You act as if you do not notice their aggressiveness."},"C":{"fi":"Käsket häntä huutamalla käyttäytymään rauhallisesti.","en":"You order them by shouting to behave calmly."}}},{"num":212,"category":"PASSENGER SAFETY","fi":"Kasvava osa taksinkuljetuksista hoidetaan taksiautoilla, jotka ovat esteettömiä. Miten pyörätuoli on kiinnitettävä, kun matkustaja istuu matkan ajan pyörätuolissa?","en":"A growing share of taxi transport uses accessible vehicles. How must a wheelchair be secured when the passenger sits in the wheelchair for the entire trip?","answers":{"A":{"fi":"Pyörätuolin jarrut laitetaan .","en":"Able to communicate so the customer reaches their destination safely."},"C":{"fi":"Pitää olla suorittanut kansalaisuuden kielikoe.","en":"Must have passed the citizenship language test."}}},{"num":224,"category":"REGULATION & RESPONSIBILITY","fi":"Minkä osuuden asiakas maksaa KELA-kyydistä kuljettajalle?","en":"What portion of a Kela ride does the customer pay to the driver?","answers":{"A":{"fi":"Omavastuun ylittävän osuuden.","en":"The portion exceeding the deductible."},"B":{"fi":"koko matkan hinnan.","en":"The full price of the trip."},"C":{"fi":"Enintään omavastuun.","en":"At most the deductible (own contribution)."}}},{"num":225,"category":"PASSENGER SAFETY","fi":"Miten voit vähentää ennalta jännittyneen asiakkaan ahdistusta matkan aikana?","en":"How can you reduce the anxiety of a passenger who is nervous in advance during the trip?","answers":{"A":{"fi":"Vältät kaiken puheen ja jätät hänet arvailemaan matkan kulun.","en":"Avoid all talk and leave them guessing how the trip will go."},"B":{"fi":"Yllätät hänet oikoreitillä, jotta matka tuntuu vaihtelevalta.","en":"Surprise them with a shortcut so the trip feels varied."},"C":{"fi":"Kerrot etukäteen, mitä tapahtuu ja kauanko matka suunnilleen kestää, ja pidät ympäristön rauhallisena.","en":"Tell them beforehand what will happen and roughly how long the trip takes, and keep the environment calm."}}},{"num":226,"category":"CUSTOMER SERVICE","fi":"Mitä asiallinen ja tasapuolinen taksipalvelu tarkoittaa käytännössä?","en":"What does appropriate and equal taxi service mean in practice?","answers":{"A":{"fi":"Kaikkia asiakkaita kohdellaan kohteliaasti ja yhdenvertaisesti, ja apua tarvitsevaa avustetaan mahdollisuuksien mukaan.","en":"All customers are treated politely and equally, and those needing help are assisted where possible."},"B":{"fi":"Valitaan asiakkaat sen mukaan, kuka maksaa todennäköisimmin eniten.","en":"Customers are chosen according to who is likely to pay the most."},"C":{"fi":"Palvellaan hy y and the rear of the car is left sticking out into the carriageway."},"C":{"fi":"Luotat siihen, että talvirenkaat lyhentävät jarrutusmatkan samaksi kuin kesällä.","en":"You rely on winter tyres to shorten the braking distance to the same as in summer."}}},{"num":242,"category":"REGULATION & RESPONSIBILITY","fi":"Miten välitysalustat (esimerkiksi taksisovellukset) tyypillisesti ansaitsevat kuljettajan ajamista matkoista?","en":"How do dispatch platforms (for example taxi apps) typically earn from the trips a driver makes?","answers":{"A":{"fi":"Ne perivät kuljettajalta tai yritykseltä komission eli osuuden matkan hinnasta.","en":"They charge the driver or company a commission, i.e. a share of the trip price."},"B":{"fi":"Ne eivät ota matkoista mitään korvausta eivätkä peri maksuja.","en":"They take no compensation from trips and charge no fees."},"C":{"fi":"Ne maksavat kuljettajalle jokaisesta matkasta kaksinkertaisen hinnan.","en":"They pay the driver double the price for every trip."}}},{"num":243,"category":"REGULATION & RESPONSIBILITY","fi":"11 of 20 correct","en":"What is the correct way to act when a customer asks you to stop in a place where stopping is prohibited?","answers":{"A":{"fi":"Asiakas voi aina päättää pysähtymispaikan.","en":"The customer can always decide the stopping place."},"B":{"fi":"Pysähtymissäännöistä voi perustellusta syystä poiketa.","en":"Stopping rules may be deviated from for a justified reason."},"C":{"fi":"Et voi pysähtyä paikkaan, jossa pysähtyminen on kielletty.","en":"You cannot stop in a place where stopping is prohibited."}}},{"num":244,"category":"CUSTOMER SERVICE","fi":"Miten toimit, kun maksuhetkellä asiakas on haluton maksamaan matkaansa?","en":"What do you do when, at payment time, the customer is unwilling to pay for the trip?","answers":{"A":{"fi":"Otan asiakkaalta väkisin arvoesineen maksun pantiksi.","en":"I forcibly take a valuable item from the customer as security for payment."},"B":{"fi":"Kutsun paikalle poliisin se AFETY","fi":"Missä tilanteissa kuljettajan ei tarvitse käyttää turvavyötä?","en":"In which situations does the driver not need to use a seat belt?","answers":{"A":{"fi":"Kuljettajan ei tarvitse käyttää turvavyötä koulukyytejä ajaessaan.","en":"The driver does not need to use a seat belt when driving school transport."},"B":{"fi":"Kuljettajan tulee ajaessaan aina käyttää turvavyötä.","en":"The driver must always use a seat belt when driving."},"C":{"fi":"Kuljettajan ei tarvitse käyttää turvavyötä yöaikaan ajaessa asiakkaan ollessa kyydissä.","en":"The driver does not need to use a seat belt at night when a customer is in the taxi."}}},{"num":287,"category":"REGULATION & RESPONSIBILITY","fi":"Mitä tehdä, jos asiakkaalla on kommunikaatiovaikeuksia?","en":"What to do if a customer has communication difficulties?","answers":{"A":{"fi":"Pyydä asiakasta käyttämään kääntäjää.","en":"Ask the customer to use an interpreter."},"B":{"fi":"Yritä kommunikoida yksinkertaisilla eleillä ja merkeillä.","en":"Try to communicate with simple gestures and signs."},"C":{"fi":"Jätä asiakas yksin.","en":"Leave the customer alone."}}},{"num":288,"category":"REGULATION & RESPONSIBILITY","fi":"Kuljetat muistisairasta asiakasta hyvinvointialueen palveluun. Miten toimit perillä?","en":"You are transporting a customer with memory illness to a wellbeing-services county service. How do you act on arrival?","answers":{"A":{"fi":"Vien asiakkaan omaan kotiini odottamaan paluukyytiä.","en":"I take the customer to my own home to wait for the return trip."},"B":{"fi":"Varmistan turvallisen luovutuksen ohjeiden mukaisesti, esimerkiksi henkilökunnalle tai omaiselle, jos asiakas ei selviä yksin.","en":"I ensure a safe handover according to the instructions, for example to staff or a relative, if the customer cannot manage alone."},"C":{"fi":"Jätän asiakkaan aina tien reunaan riippumatta hänen voinnistaan.","en":"I always leave the customer at the roadside regardless of their condition."}}},{"num":289,"categ May a taxi driver work continuously for 15 hours?","answers":{"A":{"fi":"Ei saa.","en":"No."},"B":{"fi":"Kyllä, jos kuljettaja haluaa.","en":"Yes, if the driver wants to."},"C":{"fi":"Kyllä, jos muuta järjestelyä ei ole.","en":"Yes, if no other arrangement is possible."}}},{"num":292,"category":"PASSENGER SAFETY","fi":"Miten pyörätuoli kiinnitetään, kun matkustaja istuu siinä matkan ajan?","en":"How is a wheelchair secured when the passenger sits in it for the entire trip?","answers":{"A":{"fi":"Jarrut päälle + kiinnitys rungosta neljästä pisteestä.","en":"Brakes on + securing from the frame at four points."},"B":{"fi":"Asiakas päättää itse.","en":"The customer decides."},"C":{"fi":"Jarrut päälle + auton turvavyö.","en":"Brakes on + car seat belt."}}},{"num":293,"category":"PASSENGER SAFETY","fi":"Miten varmistat, että lapsiasiakkaat ovat turvallisesti kiinnitettyinä ajoneuvoon?","en":"How do you ensure child passengers are safely secured in the vehicle?","answers":{"A":{"fi":"Käytän aina asianmukaista lasten turvaistuinta ja varmistan, että turvavyöt ovat oikein kiinnitetty.","en":"I always use an appropriate child safety seat and ensure seat belts are correctly fastened."},"B":{"fi":"Lapsilla ei tarvitse olla turvavöitä lyhyillä matkoilla.","en":"Children do not need seat belts on short trips."},"C":{"fi":"Lapsen turvaistuimen käyttö on vapaaehtoista.","en":"Using a child safety seat is voluntary."}}},{"num":294,"category":"PASSENGER SAFETY","fi":"Miten taksinkuljettajan tulee toimia, jos asiakas tarvitsee pyörätuolikuljetusta, mutta taksissa ei ole pyörätuolin kiinnityslaitteita?","en":"How must a taxi driver act if a customer needs wheelchair transport but the taxi has no wheelchair securing equipment?","answers":{"A":{"fi":"Kieltäydyt kuljettamasta ja neuvot asiakasta tilaamaan asianmukaisesti varustetun taksin.","en":"You refuse transport and advise ordering a properly equipped taxi."},"B":{"fi":"Voit kuljettaa asiakkaan ilman kiinnityslaitteita, jos matka on ":"As far from the entrance as possible, so the passenger gets some exercise."},"B":{"fi":"Turvallisesti liikenteeltä suojassa ja lähelle määränpään sisäänkäyntiä, jotta matkustaja voi nousta ulos rauhassa.","en":"Safely away from traffic and close to the entrance of the destination, so the passenger can get out calmly."},"C":{"fi":"Keskelle ajorataa, jotta matkustaja pääsee ulos kummalta puolelta tahansa.","en":"In the middle of the roadway, so the passenger can exit from either side."}}},{"num":298,"category":"REGULATION & RESPONSIBILITY","fi":"Mikä vakuutus taksissa käytettävällä ajoneuvolla on lakisääteisesti oltava?","en":"What insurance must a vehicle used as a taxi have by law?","answers":{"A":{"fi":"Liikennekäytössä olevalla ajoneuvolla on oltava lakisääteinen liikennevakuutus.","en":"A vehicle in traffic use must have the statutory motor third-party liability insurance."},"B":{"fi":"Ajoneuvolle ei tarvita mitään vakuutusta, jos kuljettajalla on ajolupa.","en":"The vehicle needs no insurance at all, as long as the driver holds a driving permit."},"C":{"fi":"Vain vapaaehtoinen kaskovakuutus riittää liikenteessä.","en":"Only a voluntary comprehensive (kasko) insurance is enough for use in traffic."}}},{"num":299,"category":"REGULATION & RESPONSIBILITY","fi":"Miten odotusaika ja mahdollinen odotusmaksu käsitellään sopimusajossa?","en":"How are waiting time and any waiting charge handled on a contract trip?","answers":{"A":{"fi":"Ne käsitellään voimassa olevan sopimuksen ja välityksen ohjeiden mukaisesti, ei kuljettajan oman harkinnan varassa.","en":"They are handled according to the current contract and dispatch instructions, not at the driver's own discretion."},"B":{"fi":"Kuljettaja voi lähteä heti, jos asiakas myöhästyy hetken, tarkistamatta ohjeita.","en":"The driver may leave immediately if the customer is a moment late, without checking the instructions."},"C":{"fi":"Kuljettaja laskuttaa aina enimmäismääräisen odotusmaksun tilanteesta riippumatta.","en":"The driver always charges the maximum waiting fee regardless of the situation."}}},{"num":300,"category":"PASSENGER SAFETY","fi":"Taksit hoitavat merkittävän osan kuntien järjestämistä koulu- ja päiväkotikuljetuksista. Oppilaat ovat lapsia ja nuoria, mikä edellyttää kuljettajalta kykyä tulla toimeen heidän kanssaan. Oppilaskuljetuksia tekevän taksinkuljettajan tehtäviin kuuluu mm?","en":"Taxis handle a significant part of municipal school and daycare transport. What is included in a school transport taxi driver's duties?","answers":{"A":{"fi":"Jatkuva yhteydenpito oppilaiden vanhempien kanssa. kuljettajan tulee soittaa kaikkien kyydissä olevien lasten vanhemmille, kun lapset tulevat kyytiin ja kun he poistuvat kyydistä, näin varmistetaan että jokainen lapsi on varmasti päässyt kouluun.","en":"Continuous contact with all parents — calling when children board and leave."},"B":{"fi":"Oppilaan hakeminen ja vieminen sisältä, kotitehtävien tarkistaminen ja oppilaan saattaminen luokkaan.","en":"Picking up and dropping off pupils inside, checking homework, and escorting to class."},"C":{"fi":"Oppilaan turvavyön varmistaminen ja vastuulliseen liikennekäyttäytymiseen opastaminen.","en":"Ensuring the pupil's seat belt and guiding responsible traffic behaviour."}}},{"num":301,"category":"TRAFFIC SAFETY","fi":"Mitä taksiasema-alue-merkki tarkoittaa tien sillä puolella, jolle merkki on pystytetty?","en":"What does the \" Taxi Stand Area \" sign mean on the side of the road where the sign is installed?","answers":{"A":{"fi":"Merkki osoittaa vain taksien noutopaikan eikä rajoita pysäköintiä.","en":"The sign only marks a taxi pick-up point and does not restrict parking."},"B":{"fi":"Kaikkien ajoneuvojen pysäköinti on sallittu, jos kuljettaja jää autoon.","en":"All vehicles may park there if the driver stays in the vehicle."},"C":{"fi":"Pysäköinti on kielletty muilta ajoneuvoilta kuin takseilta.","en":"Parking is prohibited for vehicles other than taxis."}}},{"num":302,"category":"RE  eikä määränpäässä olevaa aikuista tavoiteta. Miten toimit?","en":"A child travelling alone is unsure of the destination address, and the adult expected there cannot be reached. What should you do?","answers":{"A":{"fi":"Selvität tilanteen turvallisessa paikassa huoltajan ja tarvittaessa välityskeskuksen kanssa etkä jätä lasta epävarmaan paikkaan","en":"Resolve the situation from a safe place with the guardian and, if needed, the dispatch centre, and do not leave the child at an uncertain location"},"B":{"fi":"Pyydät ensimmäistä vastaantulijaa päättämään, minne lapsi viedään","en":"Ask the first passer-by to decide where the child should be taken"},"C":{"fi":"Jätät lapsen hänen arvelemaansa paikkaan ja annat hänen selvittää loput itse","en":"Leave the child where they think the destination might be and let them resolve the rest"}}},{"num":306,"category":"REGULATION & RESPONSIBILITY","fi":"Ajaessasi taksia saatko ajaa ajoneuvon kyseisen liikennemerkin vaikutusalueelle?","en":"When driving a taxi, may you drive into the area covered by this traffic sign?","answers":{"A":{"fi":"Vain jos asiakkaalla on painavia matkatavaroita.","en":"Only if the customer has heavy luggage."},"B":{"fi":"Aina jos noudan tai tuon asiakkaan.","en":"Always when I am picking up or dropping off a customer."},"C":{"fi":"Aina ajaessani taksia.","en":"Always when I am driving a taxi."}}},{"num":307,"category":"PASSENGER SAFETY","fi":"Milloin taksissa tulee olla alkolukko?","en":"When must a taxi have an alcohol interlock?","answers":{"A":{"fi":"Vain jos kuljettajalla on taksinkuljettajan ajoluvassa alkolukkoa vastaava erityisehto.","en":"Only if the driver's licence has a special alcohol interlock condition."},"B":{"fi":"Aina, kun asiakas otetaan kyytiin ilman ennakkotilausta.","en":"Always when picking up a customer without prior booking."},"C":{"fi":"Aina, kun suoritetaan kunnan tilaamia koulu- ja päivähoitokuljetuksia.","en":"Always when carrying out municipal school and daycare transport."}}},{"num":308,"category":"TRAFFIC SAFETY","fi":"","en":"You are picking up a passenger with reduced mobility. What is good practice for a professional driver?","answers":{"A":{"fi":"Pysähdyt lähimpään vapaaseen kohtaan ajoradalla ja odotat, että matkustaja selviää itse autoon.","en":"You stop at the nearest free spot on the carriageway and wait for the passenger to manage getting into the car on their own."},"B":{"fi":"Pyydät matkustajaa jättämään apuvälineet kotiin, jotta kyytiin nousu sujuu nopeammin.","en":"You ask the passenger to leave their mobility aids at home so that boarding goes faster."},"C":{"fi":"Pysäköit mahdollisimman lähelle turvalliseen paikkaan, avustat kyytiin, kiinnität turvavyön ja varmistat apuvälineiden turvallisen sijoittamisen.","en":"You park as close as possible in a safe spot, assist them into the car, fasten the seatbelt and make sure mobility aids are stowed safely."}}},{"num":309,"category":"REGULATION & RESPONSIBILITY","fi":"Mikä on työntekijän työajan, ylityöt mukaan lukien, sallittu enimmäiskeskiarvo neljän kuukauden ajanjaksolla?","en":"Including overtime, what is an employee's maximum average weekly working time over a four-month reference period?","answers":{"A":{"fi":"48 tuntia viikossa","en":"48 hours per week"},"B":{"fi":"60 tuntia viikossa","en":"60 hours per week"},"C":{"fi":"40 tuntia viikossa","en":"40 hours per week"}}},{"num":310,"category":"REGULATION & RESPONSIBILITY","fi":"Taksinkuljettajan ajoluvan voi peruuttaa?","en":"Who can revoke a taxi driver's licence?","answers":{"A":{"fi":"Liikenne- ja viestintävirasto.","en":"The Transport and Communications Agency."},"B":{"fi":"Taksin paikallisyhdistys.","en":"The local taxi association."},"C":{"fi":"Poliisi.","en":"The police."}}},{"num":311,"category":"PASSENGER SAFETY","fi":"Mitä on otettava huomioon luiskaa (ramppia) käytettäessä pyörätuolin kanssa?","en":"What must be taken into account when using a ramp with a wheelchair?","answers":{"A":{"fi":"Luiskan kaltevuudella ei ole merkitystä turvallisuuden kannalta.","en":"The gradient of the ramp is irrelevant to safety."},"B":{"fi":"Luiskan on oltava tukevasti kiinni ajoneuvossa ja kaltevuudeltaan riittävän loiva, ja tarvittaessa avustat työntämisessä turvallisesti; jyrkkää luiskaa ei saa käyttää ilman avustusta.","en":"The ramp must be firmly attached to the vehicle with a gentle enough gradient, and you assist safely with pushing when needed; a steep ramp must not be used without assistance."},"C":{"fi":"Luiskaa voi käyttää kuinka jyrkkänä tahansa, kunhan matkustaja on nopea.","en":"The ramp can be used no matter how steep it is, as long as the passenger is quick."}}},{"num":312,"category":"PASSENGER SAFETY","fi":"Mikä seuraavista pyörätuolin käyttöä ja kiinnittämistä koskevista väitteistä pitää paikkaansa?","en":"Which of the following statements about wheelchair use and securing is true?","answers":{"A":{"fi":"Asiakkaan ei tarvitse ajon aikana pyörätuolissa istuessa käyttää ajoneuvon turvavyötä.","en":"The customer does not need to use the vehicle's seat belt while sitting in the wheelchair during the trip. [NOTE: This is FALSE — Finnish law requires the passenger to use a separate seat belt in addition to the wheelchair being secured.]"},"B":{"fi":"Pyörätuoli tulee kiinnittää siten, että se estää ainoastaan sivusuuntaisen liikkee.","en":"The wheelchair must be secured so that it prevents only lateral movement. [NOTE: This is FALSE — the wheelchair must be secured from all directions at 4 points.]"},"C":{"fi":"Sähköpyörätuolia ei tarvitse kiinnittää ajoneuvoon.","en":"An electric wheelchair does not need to be secured to the vehicle. [NOTE: This is FALSE — all wheelchairs must be secured at 4 points regardless of type.]"}}},{"num":313,"category":"TRAFFIC SAFETY","fi":"","en":"A passenger insists on getting out on the brow of a hill or in a sharp bend where visibility is poor. What is the safest course of action?","answers":{"A":{"fi":"Sammutat valot ja pysähdyt kaarteeseen, jotta eing-services transport always be checked separately?","answers":{"A":{"fi":"Koska säännöt ovat täysin samat koko maassa, joten yhden alueen tapaa voi soveltaa kaikkialla.","en":"Because the rules are exactly the same across the whole country, so one area's practice can be applied everywhere."},"B":{"fi":"Koska käytännöt kuten tilaus, laskutus ja avustaminen vaihtelevat alueittain ja sopimuksittain, ja on noudatettava voimassa olevia paikallisia ohjeita.","en":"Because practices such as ordering, billing and assistance vary by area and by contract, and the current local instructions must be followed."},"C":{"fi":"Koska kuljettaja saa keksiä oman käytäntönsä, jos on epävarma.","en":"Because the driver may invent their own practice if unsure."}}},{"num":319,"category":"PASSENGER SAFETY","fi":"Onko pyörätuolissa matkustavan henkilön käytettävä turvavyötä pyörätuolin kiinnittämisen lisäksi?","en":"Must a person travelling in a wheelchair use a seat belt in addition to the wheelchair being secured?","answers":{"A":{"fi":"Kyllä; pyörätuolin kiinnityksen lisäksi matkustajalla on käytettävä erillistä henkilön turvavyötä (lantio- ja olkavyö).","en":"Yes; in addition to securing the wheelchair, the passenger must use a separate occupant seat belt (lap and shoulder belt)."},"B":{"fi":"Ei, pyörätuolin kiinnitys yksin riittää.","en":"No, securing the wheelchair alone is enough."},"C":{"fi":"Turvavyö tarvitaan vain moottoritieajossa.","en":"A seat belt is only needed when driving on the motorway."}}},{"num":320,"category":"TRAFFIC SAFETY","fi":"Miten toimit, kun asiakas pyytää ajamaan ylinopeutta?","en":"What do you do when a customer asks you to drive over the speed limit?","answers":{"A":{"fi":"Voit ajaa ylinopeutta, jos asiakkaan kanssa on sovittu, että hän maksaa ylinopeussakot.","en":"You may speed if the customer agrees to pay speeding fines."},"B":{"fi":"Voit ajaa ylinopeutta, jos asiakkaalla on siihen perusteltu syy","en":"You may speed if the customer has a justified reason for it"},"C":{"fi":"Kerrot asiakkaalle ettet voi ajaa ylinopeutta, mutta teet parhaasi, jotta hän pääsee turvallisesti perille, nopeinta mahdollista reittiä.","en":"You tell the customer you cannot speed, but do your best to get them there safely via the fastest route."}}},{"num":321,"category":"CUSTOMER SERVICE","fi":"Matka on päättynyt ja taksamittari näyttää loppusumman. Miten ammattitaitoinen kuljettaja toimii ennen maksun vastaanottamista?","en":"The trip has ended and the taximeter shows the total. What does a professional driver do before accepting payment?","answers":{"A":{"fi":"Kertoo asiakkaalle selkeästi maksettavan summan ja varmistaa, että asiakas on ymmärtänyt sen","en":"Clearly states the amount to be paid and confirms that the customer has understood it"},"B":{"fi":"Pyöristää summan ylöspäin ilman, että kertoo siitä asiakkaalle","en":"Rounds the amount up without telling the customer"},"C":{"fi":"Ei sano summaa ääneen vaan olettaa asiakkaan lukevan sen itse mittarista","en":"Does not say the amount aloud but assumes the customer reads it from the meter"}}},{"num":322,"category":"CUSTOMER SERVICE","fi":"Miten voit parantaa kommunikointia kuulovammaisen matkustajan kanssa?","en":"How can you improve communication with a hearing-impaired passenger?","answers":{"A":{"fi":"Suosittelemalla asiakasta istumaan etuistuimelle.","en":"By recommending the customer sit in the front seat."},"B":{"fi":"Suosittelemalla asiakasta istumaan takapenkillä.","en":"By recommending the customer sit on the back seat."},"C":{"fi":"En mitenkään.","en":"Not at all."}}},{"num":323,"category":"TRAFFIC SAFETY","fi":"","en":"Mikä seuraavista on oikein, kun kuljettaja käyttää viestimiä ajon aikana?","answers":{"A":{"fi":"Kuljettaja saa käyttää viestimiä ajon aikana handsfree-laitetta käyttäen.","en":"The driver may use communication devices while driving using a hands-free device."},"B":{"fi":"Kuljettaja saa käyttää viestimiä ajon aikana, jos se on välttämätöntä.","en":"The driver may use communication devices while driving if it is necessary."},"C":{"fi":"Kuljettaja ei saa käyttää viestimiä ajon aikana.","en":"The driver may not use communication devices while driving."}}},{"num":324,"category":"REGULATION & RESPONSIBILITY","fi":"Miten taksipalvelun hinnoittelu toimii Suomessa?","en":"How does pricing of taxi services work in Finland?","answers":{"A":{"fi":"Yrittäjä saa pitää hinnat kokonaan salassa, eikä niitä tarvitse kertoa asiakkaalle.","en":"The entrepreneur may keep prices entirely secret and does not need to tell the customer."},"B":{"fi":"Hinnoittelu on pääosin vapaata, mutta hinnoista on annettava asiakkaalle selkeät tiedot ennen matkaa.","en":"Pricing is largely free, but clear price information must be given to the customer before the trip."},"C":{"fi":"Viranomainen määrää kaikille takseille yhden kiinteän hinnan, jota ei saa muuttaa.","en":"The authorities set a single fixed price for all taxis that may not be changed."}}},{"num":325,"category":"PASSENGER SAFETY","fi":"","en":"Mitä alaikäisen vajaavaltaisuus tarkoittaa yksin taksilla matkustamisen kannalta?","answers":{"A":{"fi":"Vajaavaltaisuus ei itsessään kiellä yksin matkustamista, mutta matkan järjestelyt ja turvallisuus on varmistettava lapsen iän ja tilanteen mukaisesti","en":"Legal incapacity does not itself prohibit solo travel, but the trip arrangements and safety must be confirmed according to the child's age and circumstances"},"B":{"fi":"Kaikki alle 12-vuotiaat saavat matkustaa yksin ilman, että kuljettajan tarvitsee varmistaa mitään","en":"Every child under 12 may travel alone without the driver confirming anything"},"C":{"fi":"Alaikäinen ei saa missään tilanteessa matkustaa yksin taksilla","en":"A minor may never travel alone by taxi under any circumstances"}}},{"num":326,"category":"TRAFFIC SAFETY","fi":"Olet ottanut asiakkaan kyytiin paikkakuntasi taksiasemalta. Olette ajaneet hyvän matkaa, kun taksin puhelin soi. Huomaat, että handsfree-laite on jäänyt kotiin. Mitä teet?","en":"You picked up a customer at your local taxi stand. You have driven a good distance when the taxi phone rings. You notice the hands-free device was left at home. What do you do?","answers":{"A":{"fi":"Pysähdyn tienvarteen, jotta voin kirjoittaa ylös välttämättömiä tietoja. Voin pitää taksimittarin päällä.","en":"I stop by the roadside so I can write down necessary information. I may keep the taxi meter running."},"B":{"fi":"Vastaan puhelimeen normaalisti pahoittelen asiakkaalle puhelimen aiheuttamaa häiriötä ja vastaan sitten puheluun.","en":"You answer the phone normally, apologize to the customer for the disturbance, and then answer the call."},"C":{"fi":"Pahoittelen asiakkaalle puhelimen aiheuttamaa häiriötä enkä vastaa siihen; soitan takaisin kyydin päätyttyä.","en":"You apologize to the customer for the disturbance caused by the phone and do not answer it; you call back after the ride ends."}}},{"num":327,"category":"CUSTOMER SERVICE","fi":"Asiakas antaa matkan aikana palautetta ja on tyytymätön palveluun. Miten ammattitaitoinen kuljettaja toimii?","en":"During the trip a customer gives feedback and is dissatisfied with the service. How does a professional driver act?","answers":{"A":{"fi":"Väittää asiakasta vastaan ja vaatii tätä poistumaan autosta.","en":"Argues with the customer and demands they leave the car."},"B":{"fi":"Kuuntelee asiakasta asiallisesti, pahoittelee tarvittaessa ja neuvoo, miten valituksen voi tehdä.","en":"Listens to the customer politely, apologises if appropriate, and advises how a complaint can be made."},"C":{"fi":"Ohittaa palautteen ja jatkaa kuin mitään ei olisi tapahtunut.","en":"Ignores the feedback and carries on as if nothing had happened."}}},{"num":328,"category":"CUSTOMER SERVICE","fi":"Miten käsittelet tilanteen, jos asiakkaasi ei pysty maksamaan matkaa?","en":"How do you handle a situation if your customer cannot pay for the trip?","answers":{"A":{"fi":"Selvitä tilanne rauhallisesti ja mahdollisuuksien mukaan käytä maksamattomasta matkasta ilmoitusta työnantajalle tai viranomaisille.","en":"Resolve the situation calmly and, where possible, report non-payment to the employer or authorities."},"B":{"fi":"Aja asiakkaan kotiin ja pyydä häntä maksamaan myöhemmin.","en":"Drive the customer home and ask them to pay later."},"C":{"fi":"Pyydä asiakasta lähtemään autosta ilman maksua.","en":"Ask the customer to leave the car without paying."}}},{"num":329,"category":"CUSTOMER SERVICE","fi":"","en":"A customer refuses to pay the fare. Which course of action is absolutely forbidden for the driver?","answers":{"A":{"fi":"Maksutilanteen rauhallinen selvittäminen ja summan kertominen uudelleen","en":"Calmly clarifying the payment situation and restating the amount"},"B":{"fi":"Yhteyden ottaminen tilausvälitykseen tai työnantajaan ohjeiden saamiseksi","en":"Contacting the dispatch service or the employer for instructions"},"C":{"fi":"Voiman käyttö asiakasta kohtaan tai hänen arvoesineidensä ottaminen pantiksi","en":"Using force against the customer or taking their valuables as a pledge"}}},{"num":330,"category":"PASSENGER SAFETY","fi":"Iäkäs matkustaja nousee autoon hitaasti ja tarvitsee aikaa asettuakseen. Miten ammattitaitoinen kuljettaja toimii?","en":"An older passenger boards slowly and needs time to settle in. How should a professional driver act?","answers":{"A":{"fi":"Antaa matkustajalle rauhassa aikaa, auttaa tarvittaessa ja varmistaa, että turvavyö on kiinnitetty ennen liikkeellelähtöä.","en":"Calmly give the passenger time, assist when needed, and make sure the seat belt is fastened before setting off."},"B":{"fi":"Lähtee liikkeelle heti kun matkustaja on istunut, vaikka turvavyö olisi vielä kiinnittämättä.","en":"Drive off as soon as the passenger is seated, even if the seat belt is not yet fastened."},"C":{"fi":"Kehottaa matkustajaa kiirehtimään, jotta aikataulu pitää.","en":"Urge the passenger to hurry so the schedule stays on track."}}},{"num":331,"category":"TRAFFIC SAFETY","fi":"Mitä kuljettajan tulee tehdä, jos hän tuntee nukahtavansa ratin taakse ajon aikana?","en":"What should a driver do if they feel they are about to fall asleep at the wheel while driving?","answers":{"A":{"fi":"Jatkaa ajoa ja avata ikkuna, koska väsymys menee kyllä ohi","en":"Keep driving and open a window, since the tiredness will pass"},"B":{"fi":"Lisätä ajonopeutta, jotta pääsee nopeammin perille","en":"Increase speed so as to reach the destination faster"},"C":{"fi":"Pysähtyä turvalliseen paikkaan ja levätä tai ottaa lyhyet torkut ennen ajon jatkamista","en":"Stop in a safe place and rest or take a short nap before continuing"}}},{"num":332,"category":"CUSTOMER SERVICE","fi":"Miten huolehdit välitysjärjestelmän käyttäjätunnuksesi turvallisuudesta?","en":"How do you keep your dispatch-system user account secure?","answers":{"A":{"fi":"Pidät kirjautumistietosi omana tietonasi, et jaa niitä muille ja kirjaudut ulos, kun luovutat auton toiselle kuljettajalle.","en":"Keep your login details to yourself, do not share them, and log out when you hand the car over to another driver."},"B":{"fi":"Kirjoitat salasanasi näkyviin auton kojelautaan, jotta et unohda sitä.","en":"Write your password in plain sight on the car's dashboard so you don't forget it."},"C":{"fi":"Jaat tunnuksesi ja salasanasi työkavereille, jotta kaikki voivat käyttää samaa tiliä.","en":"Share your username and password with colleagues so everyone can use the same account."}}},{"num":333,"category":"TRAFFIC SAFETY","fi":"Miten kuljettaja parhaiten varmistaa, ettei sähkötaksin akku pääse loppumaan kesken pitkän työvuoron?","en":"How can a driver best ensure that an electric taxi's battery does not run out during a long shift?","answers":{"A":{"fi":"Olettaa, että ajotapa ja lämmitys eivät vaikuta toimintamatkaan","en":"Assume that driving style and heating have no effect on the range"},"B":{"fi":"Suunnittelee vuoron latausmahdollisuudet etukäteen ja pitää riittävän varauspuskurin","en":"Plan the shift's charging opportunities in advance and keep a sufficient charge buffer"},"C":{"fi":"Antaa akun tyhjentyä lähes nollaan ennen kuin latausta edes harkitaan","en":"Let the battery drain to nearly zero before even considering charging"}}},{"num":334,"category":"REGULATION & RESPONSIBILITY","fi":"Mikä on hyvä käytäntö, kun asiakas kysyy matkan hintaa etukäteen?","en":"What is good practice when a customer asks for the price of a trip in advance?","answers":{"A":{"fi":"Antaa asiakkaalle satunnainen luku, jolla ei ole yhteyttä todelliseen hintaan.","en":"Give the customer a random figure with no connection to the real price."},"B":{"fi":"Kieltäytyä kertomasta mitään hinnasta ennen kuin matka on ohi.","en":"Refuse to say anything about the price until the trip is over."},"C":{"fi":"Kertoa asiakkaalle hinnoitteluperusteet ja tarvittaessa arvio matkan kokonaishinnasta.","en":"Tell the customer the pricing basis and, if needed, an estimate of the total price of the trip."}}},{"num":335,"category":"TRAFFIC SAFETY","fi":"Tarkastat auton sisätilat ennen asiakkaan hakemista. Edellisen kyydin jäljiltä takapenkillä on roskia ja sivuikkuna on likainen. Miten toimit?","en":"You inspect the car interior before picking up a customer. From the previous ride there is litter on the back seat and the side window is dirty. What do you do?","answers":{"A":{"fi":"Siivoat sisätilat ja puhdistat ikkunat ennen seuraavan asiakkaan hakemista.","en":"You clean the interior and the windows before picking up the next customer."},"B":{"fi":"Ajat asiakkaan luo sellaisenaan, koska siisteys ei kuulu kuljettajan tehtäviin.","en":"You drive to the customer as is, because cleanliness is not part of the driver's duties."},"C":{"fi":"Siivoat vasta työvuoron päätteeksi.","en":"You clean up only at the end of the shift."}}},{"num":336,"category":"TRAFFIC SAFETY","fi":"Miten taksinkuljettaja voi hallita työhön liittyvää stressiä ja edistää palautumista?","en":"How can a taxi driver manage work-related stress and support recovery?","answers":{"A":{"fi":"Käyttää piristeitä ja jättää tauot pois, jotta ansiot kasvavat","en":"Use stimulants and skip breaks so that earnings increase"},"B":{"fi":"Huolehtia tauoista, unesta ja liikunnasta sekä hakea tarvittaessa tukea työterveyshuollosta","en":"Take care of breaks, sleep and exercise, and seek support from occupational health care when needed"},"C":{"fi":"Sivuuttaa stressin oireet ja pidentää työvuoroja jaksamisen parantamiseksi","en":"Ignore the symptoms of stress and lengthen shifts to improve stamina"}}},{"num":337,"category":"TRAFFIC SAFETY","fi":"Mikä erottaa pysäyttämisen pysäköinnistä liikenteessä?","en":"What distinguishes stopping from parking in traffic?","answers":{"A":{"fi":"Pysäyttäminen on sallittua vain taksiasemilla, kun taas pysäköinti on sallittua kaikkialla.","en":"Stopping is allowed only at taxi stands, whereas parking is allowed everywhere."},"B":{"fi":"Pysäyttäminen ja pysäköinti tarkoittavat käytännössä samaa asiaa, ja termejä voi käyttää vaihdellen.","en":"Stopping and parking mean practically the same thing, and the terms can be used interchangeably."},"C":{"fi":"Pysäyttäminen on lyhyt seisahdus matkustajan nousua tai poistumista taikka kuorman käsittelyä varten, kun taas pysäköinti tarkoittaa ajoneuvon jättämistä paikalleen pidemmäksi aikaa.","en":"Stopping is a brief halt to let a passenger board or alight or to handle a load, whereas parking means leaving the vehicle in place for a longer time."}}},{"num":338,"category":"REGULATION & RESPONSIBILITY","fi":"Mitä taksinkuljettajalta edellytetään, jos asiakas on henkilö joka ei kykene käyttämään puhuttua kieltä?","en":"What is required of a taxi driver if the customer is a person who cannot use spoken language?","answers":{"A":{"fi":"Taksinkuljettajan tulee huolehtia, että asiakas pääsee määränpäähän.","en":"The taxi driver must ensure the customer reaches the destination."},"B":{"fi":"Taksinkuljettajalta edellytetään erityisammattitutkinnon suo liittyen puhelimen handsfree-laitteeseen?","answers":{"A":{"fi":"Kuljettaja saa ajoneuvon liikkuessa puhua puhelimeen handsfree-laitetta käyttäen, jos se on kuljetuksen suorittamiseksi välttämätöntä","en":"The driver may talk on the phone using a hands-free device while the vehicle is moving if it is necessary to carry out the transport"},"B":{"fi":"Handsfree-laitetta ei tarvitse käyttää ajoneuvon liikkuessa, jos puhelu kestää alle minuutin","en":"A hands-free device does not need to be used while the vehicle is moving if the call lasts less than one minute"},"C":{"fi":"Jos taksissa ei ole asiakkaita, kuljettaja saa ajoneuvon liikkuessa puhua puhelimeen ilman handsfree-laitetta","en":"If there are no customers in the taxi, the driver may talk on the phone without a hands-free device while the vehicle is moving"}}},{"num":492,"category":"REGULATION & RESPONSIBILITY","fi":"Missä tilanteessa kuljettaja voi kieltäytyä kyydistä?","en":"In which situation may the driver refuse a ride?","answers":{"A":{"fi":"Jos asiakas menee toisen kunnan alueelle.","en":"If the customer goes to another municipality."},"B":{"fi":"Jos kyyti suuntautuu toiselle liikennealueelle.","en":"If the ride goes to another traffic area."},"C":{"fi":"Jos laillinen työaika ylittyisi.","en":"If legal working time would be exceeded."}}},{"num":493,"category":"CUSTOMER SERVICE","fi":"","en":"Miten toimitaan, jos taksin maksupääte ei toimi ja asiakkaalla ei ole käteistä?","answers":{"A":{"fi":"Pahoittelet tilannetta ja ehdotat lähimmän pankkiautomaatin käyttöä.","en":"Apologise and suggest using the nearest ATM."},"B":{"fi":"Kieltäydyt kuljettamasta asiakasta.","en":"Refuse to transport the customer."},"C":{"fi":"Kuljetat asiakkaan määränpäähän ja sovit maksutavasta myöhemmin.","en":"Drive to the destination and agree payment method later."}}},{"num":494,"category":"REGULATION & RESPONSIBILITY","fi":"Aino aloitti työvuoron klo 5:30. Milloin hänen on viimeistään pidettävä ensimmäinen tauko?","en":"Aino started her shift at 5:30. When must she take her first break at the latest?","answers":{"A":{"fi":"Kun tuntee itsensä väsyneeksi.","en":"When she feels tired."},"B":{"fi":"Viimeistään klo 10 (4,5 h yhtäjaksoista työaikaa).","en":"By 10:00 at the latest (4.5 h continuous working time)."},"C":{"fi":"Viimeistään klo 11 (5,5 h yhtäjaksoista työaikaa).","en":"By 11:00 at the latest (5.5 h continuous working time)."}}},{"num":495,"category":"CUSTOMER SERVICE","fi":"Miten kuljettaja edistää matkan turvallisuutta, kun matkustaja nousee kyytiin?","en":"How does the driver promote the safety of the trip when a passenger gets in?","answers":{"A":{"fi":"Lähtee heti liikkeelle, koska turvavyö on vain matkustajan oma asia.","en":"Sets off immediately, because the seatbelt is only the passenger's own concern."},"B":{"fi":"Muistuttaa turvavyön käytöstä ja huolehtii, että matkustaja voi kiinnittää sen turvallisesti.","en":"Reminds the passenger to use the seatbelt and makes sure they can fasten it safely."},"C":{"fi":"Kehottaa jättämään turvavyön kiinnittämättä, jotta matka sujuu nopeammin.","en":"Tells them to leave the seatbelt off so the trip goes faster."}}},{"num":496,"category":"PASSENGER SAFETY","fi":"Vakavan uhkatilanteen jälkeen kuljettaja on järkyttynyt. Mikä on suositeltava tapa huolehtia omasta hyvinvoinnista?","en":"After a serious threatening incident, the driver is shaken. What is a recommended way to look after one's own wellbeing?","answers":{"A":{"fi":"Hakee tarvittaessa tukea työnantajalta, työterveyshuollosta tai muusta tukipalvelusta ja puhuu kokemastaan","en":"Seek support if needed from the employer, occupational health care or another support service, and talk about the experience"},"B":{"fi":"Painaa kokemuksen heti mielestään ja jatkaa työvuoroa kuin mitään ei olisi tapahtunut","en":"Immediately push the experience out of one's mind and continue the shift as if nothing had happened"},"C":{"fi":"Välttää aiheesta puhumista kenellekään, jottei vaikuttaisi heikolta ammatissaan","en":"Avoid talking about it to anyone, so as not to seem weak in one's profession"}}},{"num":497,"category":"CUSTOMER SERVICE","fi":"Miten kuljettajan tulee huomioida näkövammaista asiakasta?","en":"How must the driver take a visually impaired customer into account?","answers":{"A":{"fi":"Taksinkuljettajan on hyvä kysyä asiakkaalta, miten häntä voi auttaa ennen kuin ryhtyy auttamaan asiakasta.","en":"It is good for the taxi driver to ask the customer how they can be helped before starting to assist the customer."},"B":{"fi":"Taksinkuljettajan tulee aina ohjata asiakasta olkapäästä ja auttaa hänet autoon kevyesti työntäen.","en":"The taxi driver must always guide the customer by the shoulder and help them into the car by gently pushing."},"C":{"fi":"Kuljettajan on hyvä näkövammaista palvellessa puhua hiukan kovemmalla äänellä.","en":"When serving a visually impaired person, it is good for the driver to speak somewhat louder."}}},{"num":498,"category":"REGULATION & RESPONSIBILITY","fi":"Mikä seuraavista vastausvaihtoehdoista on paras tapa toimia? asiakkaanasi on ikääntynyt avustettava henkilö. Asiakas jätetään hoitolaitoksen luona.","en":"Which is the best way to act when your customer is an elderly assisted person dropped off at a care facility?","answers":{"A":{"fi":"Taksinkuljettaja tulee aina myös huolehtia asiakkaan ulkovaatteiden riisumisesta.","en":"The taxi driver must always also remove the customer's outdoor clothing."},"B":{"fi":"Kuljettajan vastuu päättyy kun asiakas on noussut ulos autosta","en":"The driver's responsibility ends when the customer has exited the car"},"C":{"fi":"Taksinkuljettaja tulee huolehtii, että asiakas pääsee tarvittaessa hoitohenkilökuntaan.","en":"The taxi driver must ensure the customer reaches care staff if needed."}}}];
const LESSONS=[{"id": "M00", "slug": "how-the-examination-works", "title": "How The Examination Works", "en": "The taxi-driver licence examination measures your command of passenger safety, customer service, and driver responsibilities. The examination structure and requirements are defined by the authority — always check the current details from official sources before booking your examination.\n  [Simplified: The exam tests safety, customer service, and responsibilities. Always check exam details from an official source.]\n\nThis platform is an independent preparation service. Practice material is not official examination material.", "fi": "Taksinkuljettajan ajolupakoe mittaa, hallitsetko matkustajaturvallisuuden, asiakaspalvelun ja kuljettajan vastuut. Kokeen rakenne ja vaatimukset määrittelee viranomainen — tarkista aina ajantasaiset tiedot virallisista lähteistä ennen kokeeseen ilmoittautumista.\n  [Simplified: Koe testaa turvallisuutta, asiakaspalvelua ja vastuita. Tarkista koetiedot aina virallisesta lähteestä.]\n\nTämä palvelu on riippumaton valmennuspalvelu. Harjoitusmateriaali ei ole virallista koemateriaalia."}, {"id": "M01", "slug": "asking-before-assisting", "title": "Asking Before Assisting", "en": "Professional assistance always starts by asking. Ask the customer whether they want help and how they can best be helped before you act. Do not take hold of the customer or their mobility aid without asking.\n  [Simplified: Always ask first: 'Would you like help? How can I help?' Do not touch the customer without permission.]\n\nYou pick up a customer who uses a rollator. You get out of the car, greet them, and ask: 'Would you like help getting into the car or with the rollator?' The customer tells you what help they need — you follow their guidance.\n\nCommon mistake: grabbing the customer's arm without asking. It can unbalance them and feel disrespectful.", "fi": "Ammattimainen avustaminen alkaa aina kysymällä. Kysy asiakkaalta, haluaako hän apua ja miten häntä voi parhaiten auttaa, ennen kuin ryhdyt toimeen. Älä tartu asiakkaaseen tai hänen apuvälineeseensä kysymättä.\n  [Simplified: Kysy aina ensin: 'Haluatko apua? Miten voin auttaa?' Älä koske asiakkaaseen ilman lupaa.]\n\nNoudat asiakkaan, joka liikkuu rollaattorin kanssa. Nouset autosta, tervehdit ja kysyt: 'Haluatko apua autoon nousemisessa tai rollaattorin kanssa?' Asiakas kertoo itse, mitä apua hän tarvitsee — sinä toimit hänen ohjeidensa mukaan.\n\nYleinen virhe: asiakkaan käsivarteen tarttuminen kysymättä. Se voi horjuttaa tasapainoa ja tuntua loukkaavalta."}, {"id": "M02", "slug": "seat-belt-responsibilities", "title": "Seat Belt Responsibilities", "en": "[LEGAL CLAIM — TO BE VERIFIED] The driver must ensure that a passenger under 15 years of age uses a seat belt or an appropriate restraint device.\n\nRoad Traffic Act 1090/2020 — verify the current section reference from Finlex.", "fi": "[LAKIVÄITE — VAHVISTETTAVA] Kuljettajan on huolehdittava, että alle 15-vuotias matkustaja käyttää turvavyötä tai asianmukaista turvalaitetta.\n\nTieliikennelaki 1090/2020 — tarkista ajantasainen pykäläviittaus Finlexistä."}, {"id": "M03", "slug": "children-and-child-restraints", "title": "Children And Child Restraints", "en": "Before setting off, a professional taxi driver always makes sure that every child is secured with a seat belt or a child restraint appropriate to the child's size, in line with the current legal requirements. As a professional driver, treat securing child passengers as your own responsibility – never assume that a parent or guardian will take care of it for you. Check the up-to-date requirements from official sources such as Traficom, as they can change.\n  [Simplified: Always secure the child in a child seat or with a seat belt before you drive. Use a restraint that fits the child's size. The driver makes sure the child is secured correctly. Check the current rules from official sources.]\n\nA rear-facing child seat is never placed on the front passenger seat when the passenger airbag is active – a deploying airbag can cause life-threatening injuries to a small child. The safest place for a child is usually the back seat. If a child seat must exceptionally be installed in the front, make sure the airbag is switched off according to the vehicle manufacturer's instructions, and check the installation carefully.\n  [Simplified: Do not put a rear-facing child seat on the front seat if the airbag is on. The airbag can seriously hurt the child. The back seat is usually the safest place for a child.]\n\nWhen a child travels unaccompanied – for example on a school run or on a journey reimbursed by Kela – agree already at booking which adult will receive the child at the destination. Always hand the child over directly to the receiving adult; never leave a child alone at the kerb or behind a locked door. Prams, pushchairs and other equipment are loaded securely in the boot so they cannot move under braking, and the family is helped in and out of the car without rushing.\n  [Simplified: When a child travels alone, agree in advance which adult will meet the child. Hand the child directly to that adult. Never leave the child alone. Put prams and bags securely in the boot.]\n\nYou are driving an unaccompanied school-age child to their grandmother's home in the afternoon. At the destination no one answers the door, and the agreed receiving adult does not pick up the phone. You keep the child safely in the car, call the guardian who booked the ride and the dispatch centre, and wait calmly with the child. If no one can be reached and you cannot ensure a safe handover, you do not leave the child alone – you contact the authorities, and in an urgent emergency you call 112.\n\nThe most common mistake is thinking \"it's only a short trip\" and letting a child ride unrestrained or on an adult's lap. Serious injuries can occur even in a low-speed collision – a professional driver never sets off until every child is correctly secured.\n\nRemember for the exam and on the job: a child is always secured with a restraint appropriate to their size, a rear-facing seat is never placed in front of an active airbag, and an unaccompanied child is never left without a receiving adult. Always check the current legal requirements from official sources.", "fi": "Ammattitaitoinen taksinkuljettaja varmistaa aina ennen liikkeelle lähtöä, että jokainen lapsi on kiinnitetty turvavyöllä tai lapsen kokoon sopivalla turvalaitteella voimassa olevien lakisääteisten vaatimusten mukaisesti. Ammattikuljettajana pidä lapsimatkustajien kiinnittämistä omana vastuunasi – älä koskaan oleta, että huoltaja hoitaa asian puolestasi. Tarkista ajantasaiset vaatimukset virallisista lähteistä, kuten Traficomin ohjeista, sillä ne voivat muuttua.\n  [Simplified: Kiinnitä lapsi aina turvaistuimeen tai turvavyöhön ennen ajoa. Käytä lapsen kokoon sopivaa turvalaitetta. Kuljettaja huolehtii siitä, että lapsi on kiinnitetty oikein. Tarkista voimassa olevat säännöt virallisista lähteistä.]\n\nSelkä menosuuntaan asennettua turvaistuinta ei koskaan sijoiteta etuistuimelle, jos matkustajan turvatyyny on kytkettynä – laukeava turvatyyny voi aiheuttaa pienelle lapselle hengenvaarallisia vammoja. Turvallisin paikka lapselle on yleensä takapenkki. Jos turvaistuin on poikkeuksellisesti asennettava eteen, varmista, että turvatyyny on kytketty pois auton valmistajan ohjeiden mukaisesti, ja tarkista asennus huolellisesti.\n  [Simplified: Älä laita selkä menosuuntaan olevaa turvaistuinta etupenkille, jos turvatyyny on päällä. Turvatyyny voi vahingoittaa lasta vakavasti. Takapenkki on lapselle yleensä turvallisin paikka.]\n\nKun lapsi matkustaa ilman saattajaa – esimerkiksi koulukyydillä tai Kelan korvaamalla matkalla – sovi jo tilauksen yhteydessä, kuka aikuinen ottaa lapsen vastaan perillä. Luovuta lapsi aina suoraan vastaanottavalle aikuiselle; älä koskaan jätä lasta yksin kadulle tai lukitun oven taakse. Lastenvaunut, rattaat ja muut varusteet kuormataan tukevasti tavaratilaan niin, etteivät ne pääse liikkumaan jarrutuksessa, ja perhettä autetaan kyytiin ja kyydistä kiireettä.\n  [Simplified: Kun lapsi matkustaa yksin, sovi etukäteen, kuka aikuinen on häntä vastassa. Anna lapsi suoraan tälle aikuiselle. Älä jätä lasta yksin. Laita vaunut ja tavarat tukevasti tavaratilaan.]\n\nKuljetat yksin matkustavaa kouluikäistä lasta iltapäivällä isoäidin luo. Perillä kukaan ei avaa ovea, eikä sovittu vastaanottaja vastaa puhelimeen. Pidät lapsen turvallisesti autossa, soitat kyydin tilanneelle huoltajalle ja välityskeskukseen ja odotat rauhassa lapsen kanssa. Jos ketään ei tavoiteta etkä voi varmistaa turvallista luovutusta, et jätä lasta yksin, vaan otat yhteyttä viranomaisiin – kiireellisessä hätätilanteessa numeroon 112.\n\nYleisin virhe on ajatella, että \"matka on niin lyhyt\", ja antaa lapsen matkustaa ilman turvalaitetta tai aikuisen sylissä. Vakavia vammoja voi syntyä jo pienellä nopeudella tapahtuvassa törmäyksessä – ammattikuljettaja ei koskaan lähde liikkeelle ennen kuin jokainen lapsi on kiinnitetty oikein.\n\nMuista kokeessa ja työssä: lapsi kiinnitetään aina kokonsa mukaisella turvalaitteella, selkä menosuuntaan olevaa istuinta ei sijoiteta aktiivisen turvatyynyn eteen, eikä yksin matkustavaa lasta jätetä koskaan ilman vastaanottavaa aikuista. Tarkista voimassa olevat lakisääteiset vaatimukset aina virallisista lähteistä."}, {"id": "M03", "slug": "unaccompanied-child-passenger", "title": "Unaccompanied Child Passenger", "en": "Under the Guardianship Services Act, a person under 18 is a minor and legally incapacitated. A legally incapacitated person may still enter into transactions that are usual and of minor significance in the circumstances. Legal incapacity therefore does not automatically prohibit solo taxi travel.\n  [Simplified: A person under 18 is a minor and legally incapacitated. This does not mean that a child can never travel alone by taxi.]\n\nWhen a young child travels alone, confirm the guardian's permission and contact details, the exact destination and, where relevant, the receiving adult before departure. Assess the child's assistance needs according to age and circumstances. Do not leave the child at a location whose safety or accuracy is uncertain.\n\nFinnish law does not set a general age limit of 12 for travelling alone by taxi. Nor should this situation be described as a liability-insurance obligation: the relevant issues are safeguarding passenger safety and recognising the child's assistance needs.\n\nGuardianship Services Act 442/1999: section 2 on the age threshold for legal incapacity and section 24 on transactions that are usual and of minor significance. Traficom taxi-driver examination requirements TRAFICOM/523956/03.04.03.00/2019: the driver's general responsibility for passengers and recognising and meeting children's assistance needs.", "fi": "Holhoustoimesta annetun lain mukaan alle 18-vuotias on alaikäinen ja vajaavaltainen. Vajaavaltainen voi silti tehdä olosuhteisiin nähden tavanomaisia ja merkitykseltään vähäisiä oikeustoimia. Vajaavaltaisuus ei siten tarkoita automaattista kieltoa matkustaa yksin taksilla.\n  [Simplified: Alle 18-vuotias on lain mukaan alaikäinen ja vajaavaltainen. Se ei tarkoita, ettei lapsi voisi koskaan matkustaa yksin taksilla.]\n\nKun pieni lapsi matkustaa yksin, varmista ennen lähtöä huoltajan lupa ja yhteystiedot, tarkka määränpää sekä tarvittaessa vastaanottava aikuinen. Arvioi lapsen avun tarve hänen ikänsä ja tilanteensa perusteella. Älä jätä lasta paikkaan, jonka turvallisuudesta tai oikeellisuudesta ei ole varmuutta.\n\nLaissa ei ole yleistä 12 vuoden ikärajaa yksin taksilla matkustamiselle. Älä myöskään käytä ilmaisua ”vastuuvakuutusvelvollisuus” kuvaamaan tätä tilannetta: kyse on matkustajan turvallisuudesta huolehtimisesta ja lapsen avun tarpeen tunnistamisesta.\n\nLaki holhoustoimesta 442/1999: 2 § vajaavaltaisuuden ikärajasta ja 24 § tavanomaisista, merkitykseltään vähäisistä oikeustoimista. Tra
