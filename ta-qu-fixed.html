cial sources.]\n\nThe best way to avoid using devices on the move is to handle everything before departure: enter the destination in the navigator, check the route and confirm your settings before the car moves. If the route needs to change or you must use a device mid-trip, find a safe place and stop first. Even a two-second glance at a screen means tens of metres travelled with your eyes off the road, even at city speeds.\n  [Simplified: Enter the address in the navigator before you set off. If you need to use a device during the trip, stop first in a safe place. Even a short glance at a screen is a long distance with your eyes off the road.]\n\nThe dispatch screen shows customers' personal data: names, addresses and upcoming bookings. A professional driver positions the screen so that passengers in the car cannot see other customers' details, and closes or locks the view when it is not needed. Protecting customer data is as much a part of professional skill as safe driving.\n  [Simplified: The dispatch screen shows other customers' names and addresses. Angle the screen so the passenger cannot see them, and close the view when you do not need it. Customer information is confidential.]\n\nYou are driving a customer to the airport when the dispatch system offers you the next ride and, at the same moment, the customer asks to stop at a cash machine. You acknowledge the ride offer with a single hands-free tap without taking your eyes off the road. For the route change you pull into the next safe stopping place, enter the new waypoint in the navigator and confirm it with the customer before continuing. The stop takes less than a minute, and your attention stays on the traffic for the entire trip.\n\nThe most common mistake is the \"quick glance\" at the phone while moving: in exactly those seconds the car travels tens of metres with no one watching the road. A single glance like that can mean an unnoticed pedestrian and a collision that ends a professional driving career.\n\nRemember for the exam and on the job: route into the navigator before departure, only transport-essential hands-free use while moving, stop safely for everything else – and keep customer data out of the sight of outsiders.", "fi": "Puhelin ja välitysjärjestelmä ovat taksinkuljettajan keskeisiä työkaluja, mutta ajon aikana jokainen laite kilpailee huomiostasi liikenteen kanssa. Ammattikuljettaja käyttää laitteita liikkeessä vain hands-free-toiminnolla ja vain silloin, kun se on kuljetuksen kannalta välttämätöntä – esimerkiksi kyytitarjouksen kuittaamiseen. Kaikki muu käyttö odottaa, kunnes auto on turvallisesti pysähtynyt. Tarkista laitteiden käyttöä ajon aikana koskevat ajantasaiset lakisääteiset vaatimukset virallisista lähteistä.\n  [Simplified: Puhelin vie huomiosi pois liikenteestä. Käytä ajaessa vain hands-freetä, ja vain kun se on kyydin takia pakko. Kaikki muu käyttö: pysähdy ensin. Laitteiden käyttöä ajossa säätelee laki – tarkista vaatimukset virallisista lähteistä.]\n\nParas tapa välttää laitteiden käyttöä ajossa on hoitaa asiat ennen liikkeelle lähtöä: syötä määränpää navigaattoriin, tarkista reitti ja varmista asetukset ennen kuin auto liikkuu. Jos reittiä täytyy muuttaa tai laitetta on pakko käyttää kesken matkan, etsi turvallinen paikka ja pysähdy ensin. Jo parin sekunnin vilkaisu näyttöön tarkoittaa kaupunkinopeudessakin kymmenien metrien matkaa ilman katsetta tiessä.\n  [Simplified: Syötä osoite navigaattoriin ennen kuin lähdet liikkeelle. Jos laitetta pitää käyttää matkan aikana, pysähdy ensin turvalliseen paikkaan. Lyhytkin vilkaisu näyttöön on pitkä matka ilman katsetta tiessä.]\n\nVälitysjärjestelmän näytöllä näkyy asiakkaiden henkilötietoja: nimiä, osoitteita ja tulevia tilauksia. Ammattikuljettaja sijoittaa näytön niin, etteivät kyydissä olevat matkustajat näe muiden asiakkaiden tietoja, ja sulkee tai lukitsee näkymän, kun sitä ei tarvita. Asiakkaan tietojen suojaaminen on yhtä lailla osa ammattitaitoa kuin turvallinen ajaminenkin.\n  [Simplified: Välitysnäytöllä näkyy muiden asiakkaiden nimiä ja osoitteita. Käännä näyttö niin, ettei matkustaja näe niitä, ja sulje näkymä, kun et tarvitse sitä. Asiakkaiden tiedot ovat luottamuksellisia.]\n\nOlet viemässä asiakasta lentoasemalle, kun välitysjärjestelmä tarjoaa seuraavaa kyytiä ja asiakas pyytää samalla poikkeamaan pankkiautomaatilla. Kuittaat kyytitarjouksen yhdellä hands-free-painalluksella irrottamatta katsettasi tiestä. Reittimuutosta varten ajat seuraavalle turvalliselle pysähtymispaikalle, syötät uuden reittipisteen navigaattoriin ja varmistat sen asiakkaalta ennen kuin jatkat. Pysähdys vie alle minuutin, ja huomiosi pysyy liikenteessä koko matkan ajan.\n\nYleisin virhe on \"vain nopea vilkaisu\" puhelimeen liikkeessä: juuri niiden sekuntien aikana auto etenee kymmeniä metrejä ilman, että kukaan katsoo tietä. Yksikin tällainen vilkaisu voi tarkoittaa havaitsematta jäänyttä jalankulkijaa ja onnettomuutta, joka päättää ammattikuljettajan uran.\n\nMuista kokeessa ja työssä: reitti navigaattoriin ennen lähtöä, ajon aikana vain kuljetuksen kannalta välttämätön hands-free-käyttö, kaikkeen muuhun pysähdytään turvallisesti – ja asiakkaiden tiedot pidetään poissa sivullisten silmistä."}, {"id": "M18", "slug": "vehicle-readiness-pre-departure-inspection", "title": "Vehicle Readiness Pre Departure Inspection", "en": "A professional driver starts every shift with a walkaround inspection: tyre condition and pressures, all lights working, mirrors clean and correctly adjusted, and seat belts in good condition at every seat. At the same time, make sure there is enough fuel or battery charge for the whole shift. A few minutes of checking prevents interruptions and dangerous situations during the drive.\n  [Simplified: Walk around the car before your shift. Check the tyres, lights, mirrors and seat belts. Make sure there is enough fuel or charge for the whole shift.]\n\nBefore setting off, also check the customer-service equipment: the taxi sign in place and working, the payment terminal and receipt printer functioning, and the interior clean and fresh. If children or passengers with reduced mobility may travel with you, make sure the necessary child restraints and accessibility equipment, such as wheelchair securing straps, are on board and intact. Also carry the necessary documents, such as the taxi driver's licence, and make sure they are valid — check the current requirements from official sources.\n  [Simplified: Check the taxi sign, payment terminal and receipt printer. Keep the car clean. Bring child seats and accessibility equipment if a customer needs them. Carry your taxi driver's licence and other documents.]\n\nIf you find a defect during the inspection, record it immediately and report it to the transport manager or according to your company's agreed procedure. A safety-related defect — such as a worn tyre, a broken light or a faulty seat belt — means the vehicle is not driven until the defect has been repaired. A professional driver never sets off in a vehicle whose condition they are not sure of.\n  [Simplified: If you find a fault, write it down and report it right away. If the fault affects safety, do not drive the car until it has been fixed.]\n\nAt the start of the morning shift, a driver does the walkaround and notices that the right rear light is not working. The first booking of the shift is a Kela-reimbursed trip with a passenger who uses a wheelchair. The driver reports the defect immediately to the transport manager, switches to a replacement vehicle and checks its wheelchair securing equipment before leaving. The customer is picked up on time in a safe, fully serviceable vehicle.\n\nThe most common mistake is skipping the inspection in a hurry and only discovering a defect with a customer on board — the trip is delayed, the customer's safety is put at risk, and the responsibility falls on the driver.\n\nRemember: the driver is responsible for the vehicle being fit for service at the start of every shift — a few minutes' walkaround from tyres to payment terminal is the professional way. Always check the current requirements from official sources such as Traficom.", "fi": "Ammattikuljettaja aloittaa jokaisen työvuoron auton kiertotarkastuksella: renkaiden kunto ja rengaspaineet, kaikkien valojen toiminta, peilien puhtaus ja oikeat säädöt sekä turvavöiden kunto jokaisella istuinpaikalla. Samalla varmistetaan, että polttoainetta tai akun latausta on riittävästi koko vuoroa varten. Muutaman minuutin tarkastus ehkäisee keskeytykset ja vaaratilanteet kesken ajon.\n  [Simplified: Kierrä auto ennen vuoron alkua. Tarkista renkaat, valot, peilit ja turvavyöt. Varmista, että polttoainetta tai latausta riittää koko vuoroksi.]\n\nEnnen liikkeellelähtöä tarkistetaan myös asiakaspalvelun välineet: taksikyltti paikallaan ja toimintakunnossa, maksupääte ja kuittitulostin toimivat sekä auton sisätilat siistit ja raikkaat. Jos kyydissä voi olla lapsia tai liikkumisesteisiä asiakkaita, varmista että tarvittavat lasten turvaistuimet ja apuvälineet, kuten pyörätuolin kiinnitysvälineet, ovat mukana ja ehjät. Pidä myös tarvittavat asiakirjat, kuten taksinkuljettajan ajolupa, mukana ja varmista niiden voimassaolo — ajantasaiset vaatimukset kannattaa tarkistaa virallisista lähteistä.\n  [Simplified: Tarkista taksikyltti, maksupääte ja kuittitulostin. Pidä auto siistinä. Ota mukaan lasten turvaistuimet ja apuvälineet, jos asiakas tarvitsee niitä. Pidä ajolupa ja muut asiakirjat mukana.]\n\nJos huomaat tarkastuksessa vian, kirjaa se heti ylös ja ilmoita siitä liikenteestä vastaavalle tai yrityksen sovitun käytännön mukaisesti. Turvallisuuteen vaikuttava vika — esimerkiksi kulunut rengas, toimimaton valo tai viallinen turvavyö — tarkoittaa, ettei autolla ajeta ennen kuin vika on korjattu. Ammattikuljettaja ei koskaan lähde liikkeelle autolla, jonka kunnosta hän ei ole varma.\n  [Simplified: Jos löydät vian, kirjaa se ja ilmoita siitä heti. Jos vika vaikuttaa turvallisuuteen, älä aja autolla ennen kuin vika on korjattu.]\n\nAamuvuoron alussa kuljettaja tekee kiertotarkastuksen ja huomaa, että oikea takavalo ei toimi. Vuoron ensimmäinen tilaus on Kela-korvattava kyyti, jossa asiakas käyttää pyörätuolia. Kuljettaja ilmoittaa viasta heti liikenteestä vastaavalle, siirtyy korvaavaan autoon ja tarkistaa sen pyörätuolin kiinnitysvälineet ennen lähtöä. Asiakas saadaan kyytiin ajallaan turvallisella ja toimintakuntoisella autolla.\n\nYleisin virhe on ohittaa tarkastus kiireessä ja huomata vika vasta asiakkaan ollessa kyydissä — silloin kyyti myöhästyy, asiakkaan turvallisuus vaarantuu ja vastuu on kuljettajalla.\n\nMuista: kuljettaja vastaa siitä, että auto on ajokunnossa jokaisen vuoron alussa — muutaman minuutin kiertotarkastus renkaista maksupäätteeseen on ammattilaisen tapa. Tarkista ajantasaiset vaatimukset aina virallisista lähteistä, kuten Traficomista."}, {"id": "M19", "slug": "taxi-service-quality-requirements", "title": "Taxi Service Quality Requirements", "en": "High-quality taxi service is reliable, safe and appropriate: the driver arrives as agreed, drives with anticipation and in line with traffic rules, and treats every customer politely and equally. The customer must be able to identify the driver and easily see the key information about the service — a professional driver always carries their taxi driver's licence and makes sure that the name or identifier details and the pricing information are visible to the customer. Visible information builds trust and also protects the driver from misunderstandings.\n  [Simplified: Good taxi service is reliable, safe and proper. Arrive on time, drive calmly and treat every customer well. Carry your taxi driver's licence and make sure the customer can see your identification and the price information.]\n\nThe driver is responsible for choosing the route: the journey is driven along the route that is most appropriate and economical for the customer, unless the customer asks for a particular route. The price, or the basis on which it is determined, is explained clearly to the customer before the journey, and pricing information is kept on display. At the end of the journey the customer is offered a receipt showing the details of the trip — the receipt protects the customer and is also an important aid in resolving any unclear situations.\n  [Simplified: Choose a sensible and economical route unless the customer asks for a different one. Tell the customer the price, or how it is calculated, before the trip. Offer a receipt at the end of the trip.]\n\nA customer gets in at the railway station and asks how much the trip to the airport will cost. The driver explains the pricing basis, gives a price estimate and, before setting off, checks that the customer has fastened their seatbelt. The customer asks to go via a hotel, so the driver explains how the detour affects the price and drives the requested route. At the destination, the driver offers a receipt and tells the customer who to contact if any questions remain about the trip.\n\nThe most common mistake is driving a longer route without agreeing on it with the customer, or neglecting the pricing information and the receipt. The result is complaints and lost trust — and repeated problems can put both the driver's and the licence holder's ability to operate at risk.\n\nRemember for the exam: driver identification and pricing information visible to the customer, the most appropriate route, a receipt offered, and complaints handled professionally. Always check the current requirements from official sources such as Traficom.\n\nFeedback and complaints are part of professional service: listen calmly, apologise for the situation where appropriate, and pass the matter on in the way agreed within the company instead of arguing with the customer. Responsibility works on two levels: the driver answers for their own conduct during the journey — safe driving, the treatment of the customer and the information provided — while the holder of the taxi transport licence answers for the whole, meaning that the service, the vehicles and the working practices are in order. A professional driver knows both roles and checks the up-to-date obligations from official sources.\n  [Simplified: If a customer complains, listen calmly and pass the matter on according to your company's instructions. The driver is responsible for their own work during the trip. The licence holder is responsible for the operation as a whole.]", "fi": "Laadukas taksipalvelu on luotettavaa, turvallista ja asianmukaista: kuljettaja saapuu sovitusti, ajaa ennakoivasti liikennesääntöjä noudattaen ja kohtelee jokaista asiakasta kohteliaasti ja yhdenvertaisesti. Asiakkaan on voitava tunnistaa kuljettaja ja nähdä keskeiset tiedot palvelusta helposti — ammattikuljettaja pitää taksinkuljettajan ajoluvan aina mukanaan ja huolehtii, että nimi- tai tunnistetiedot sekä hintatiedot ovat asiakkaan nähtävillä. Näkyvät tiedot luovat luottamusta ja suojaavat myös kuljettajaa itseään väärinkäsityksiltä.\n  [Simplified: Hyvä taksipalvelu on luotettavaa, turvallista ja asiallista. Tule ajoissa, aja rauhallisesti ja kohtele kaikkia asiakkaita hyvin. Pidä ajolupa mukana ja huolehdi, että asiakas näkee tunnistetietosi ja hintatiedot.]\n\nKuljettaja vastaa reitin valinnasta: matka ajetaan asiakkaan kannalta tarkoituksenmukaisinta ja edullisinta reittiä, ellei asiakas itse toivo tiettyä reittiä. Hinta tai sen määräytymisperusteet kerrotaan asiakkaalle selkeästi ennen matkaa, ja hinnoittelutiedot pidetään esillä. Matkan päätteeksi asiakkaalle tarjotaan kuitti, josta matkan tiedot käyvät ilmi — kuitti on asiakkaan turva ja tärkeä apu myös mahdollisten epäselvyyksien selvittämisessä.\n  [Simplified: Valitse asiakkaalle järkevä ja edullinen reitti, jos asiakas ei toivo muuta. Kerro hinta tai sen perusteet ennen matkaa. Anna matkan lopuksi kuitti.]\n\nAsiakas nousee kyytiin rautatieasemalla ja kysyy, paljonko matka lentoasemalle maksaa. Kuljettaja kertoo hinnoitteluperusteet, antaa hinta-arvion ja varmistaa ennen liikkeelle lähtöä, että asiakas on kiinnittänyt turvavyön. Asiakas toivoo reittiä hotellin kautta, joten kuljettaja kertoo, miten poikkeama vaikuttaa hintaan, ja ajaa toivotun reitin. Perillä kuljettaja tarjoaa kuitin ja kertoo, minne asiakas voi olla yhteydessä, jos matkasta jää kysyttävää.\n\nYleisin virhe on ajaa pidempää reittiä sopimatta siitä asiakkaan kanssa tai jättää hintatiedot ja kuitti hoitamatta. Seurauksena on valituksia ja luottamuksen menetys — ja toistuvat epäselvyydet voivat vaarantaa sekä kuljettajan että luvanhaltijan toimintaedellytykset.\n\nMuista kokeessa: kuljettajan tunnistetiedot ja hintatiedot asiakkaan nähtävillä, tarkoituksenmukaisin reitti, kuitti tarjolle ja valitukset asiallisesti hoidettuna. Tarkista ajantasaiset vaatimukset aina virallisista lähteistä, kuten Traficomilta.\n\nPalaute ja valitukset kuuluvat ammattimaiseen palveluun: kuuntele rauhallisesti, pahoittele tilannetta tarvittaessa ja vie asia eteenpäin yrityksessä sovitulla tavalla sen sijaan, että kiistelisit asiakkaan kanssa. Vastuut jakautuvat kahdelle tasolle: kuljettaja vastaa omasta toiminnastaan matkan aikana — turvallisesta ajotavasta, asiakkaan kohtelusta ja tietojen antamisesta — kun taas taksiliikenneluvan haltija vastaa kokonaisuudesta eli siitä, että palvelu, kalusto ja toimintatavat ovat kunnossa. Ammattikuljettaja tuntee molemmat roolit ja varmistaa ajantasaiset velvollisuudet virallisista lähteistä.\n  [Simplified: Jos asiakas valittaa, kuuntele rauhassa ja vie asia eteenpäin yrityksen ohjeiden mukaan. Kuljettaja vastaa omasta työstään matkan aikana. Luvanhaltija vastaa siitä, että koko toiminta on kunnossa.]"}, {"id": "M20", "slug": "price-fare-and-payment", "title": "Price Fare And Payment", "en": "A professional driver always makes sure, before the journey begins, that the customer knows how the fare will be determined. The price can be either a fixed price agreed in advance or a metered price based on the time and distance shown on the taximeter. Once a fixed price has been agreed, it does not change even if the journey takes longer than expected. Unclear pricing is the most common cause of disputes — agreeing clearly in advance protects both the customer and the driver.\n  [Simplified: Tell the customer the price, or how it is calculated, before the trip. The price is either fixed (agreed in advance) or metered (based on time and distance). An agreed fixed price does not change during the trip.]\n\nConfirm at the start of the journey which payment methods work in the car — card, cash and common mobile payments are the most common. A professional driver always offers the customer a receipt showing the price paid and how it was determined. The receipt protects the customer and is the driver's best evidence if a disagreement about the fare arises later.\n  [Simplified: Tell the customer which payment methods you accept. Always give a receipt. The receipt helps if there is a dispute about the price later.]\n\nThe card terminal stops working just as the customer is about to pay for a 28-euro journey. The driver stays calm, apologises for the situation and goes through the alternatives: cash, a mobile payment, or invoicing according to the company's instructions using the customer's contact details. Under no circumstances does the driver take the customer's phone or other property as a \"deposit\"; instead, the situation is recorded and payment is agreed afterwards. If the customer is clearly trying to avoid paying altogether, the driver contacts the police rather than taking matters into their own hands.\n\nThe most common mistake is taking the customer's property — for example a phone — as \"security\" when payment fails. This escalates the situation and can lead to serious consequences for the driver; the right approach is to offer alternative payment methods and, if necessary, call the police.\n\nRemember for the exam: make the price, or how it is determined, clear before the journey and always offer a receipt — if payment fails, offer alternatives and never seize the customer's property. Check the current requirements on pricing and price information from official sources.\n\nIf the customer disputes the fare, stay calm and professional: show the meter reading or the agreed price, provide a receipt and, if needed, direct the customer to the company's customer service — never argue heatedly or try to resolve the matter by force. When accepting cash, take a moment to check large banknotes. If you suspect a note is counterfeit, politely ask for another payment method and do not pass the suspicious note on — hand it to the police and explain where you received it.\n  [Simplified: If there is a dispute about the price, stay calm, show the meter or the agreed price, and give a receipt. Direct the customer to the company's customer service. If you suspect a banknote is fake, ask for another payment method and take the note to the police.]", "fi": "Ammattimainen kuljettaja varmistaa aina ennen matkan alkua, että asiakas tietää, miten matkan hinta muodostuu. Hinta voi olla joko etukäteen sovittu kiinteä hinta tai taksamittarin mukaan aika- ja matkaperusteisesti määräytyvä hinta. Kun kiinteä hinta on sovittu, se ei muutu, vaikka matka kestäisi odotettua kauemmin. Epäselvyys hinnasta on yleisin riidan aihe – selkeä sopiminen etukäteen suojaa sekä asiakasta että kuljettajaa.\n  [Simplified: Kerro asiakkaalle hinta tai hinnan perusteet ennen matkaa. Hinta on joko kiinteä (sovittu etukäteen) tai mittarihinta (aika ja matka). Sovittu kiinteä hinta ei muutu kesken matkan.]\n\nVarmista jo matkan alussa, mitkä maksutavat autossa toimivat – kortti, käteinen ja yleiset mobiilimaksut ovat tavallisimmat. Ammattimainen kuljettaja tarjoaa asiakkaalle aina kuitin, josta käyvät ilmi maksettu hinta ja sen perusteet. Kuitti on asiakkaan turva ja kuljettajan paras todiste, jos hinnasta syntyy myöhemmin erimielisyyttä.\n  [Simplified: Kerro asiakkaalle, millä tavoilla voi maksaa. Anna aina kuitti. Kuitti auttaa, jos hinnasta tulee myöhemmin riitaa.]\n\nMaksupääte lakkaa toimimasta juuri, kun asiakas on maksamassa 28 euron matkaa. Kuljettaja pysyy rauhallisena, pahoittelee tilannetta ja käy läpi vaihtoehdot: käteinen, mobiilimaksu tai laskutus yhtiön ohjeiden mukaan asiakkaan yhteystiedoilla. Hän ei missään tilanteessa ota asiakkaan puhelinta tai muuta omaisuutta \"pantiksi\", vaan kirjaa tapahtuman ja sopii maksusta jälkikäteen. Jos asiakas selvästi yrittää välttää maksun kokonaan, kuljettaja ottaa yhteyttä poliisiin sen sijaan, että ratkaisisi asian itse.\n\nYleisin virhe on ottaa asiakkaan omaisuutta, esimerkiksi puhelin, haltuun \"vakuudeksi\", kun maksu epäonnistuu. Se kärjistää tilanteen ja voi johtaa kuljettajalle vakaviin seuraamuksiin – oikea tie on tarjota vaihtoehtoisia maksutapoja ja kutsua tarvittaessa poliisi.\n\nMuista kokeeseen: hinta tai sen määräytymisperuste selväksi ennen matkaa ja kuitti aina tarjolle – maksun epäonnistuessa tarjoa vaihtoehtoja, älä koskaan ota asiakkaan omaisuutta haltuun. Tarkista hinnoittelua ja hintatietojen esittämistä koskevat voimassa olevat vaatimukset virallisista lähteistä.\n\nJos asiakas riitauttaa hinnan, pysy rauhallisena ja asiallisena: näytä mittarin lukema tai sovittu hinta, anna kuitti ja ohjaa asiakas tarvittaessa yhtiön asiakaspalveluun – älä koskaan väittele kiivaasti tai yritä ratkaista asiaa voimakeinoin. Käteistä vastaanottaessasi tarkista suuret setelit rauhassa. Jos epäilet seteliä väärennökseksi, pyydä kohteliaasti toista maksutapaa äläkä laita epäilyttävää seteliä eteenpäin – toimita se poliisille ja kerro, mistä sait sen.\n  [Simplified: Jos hinnasta tulee riitaa, pysy rauhallisena, näytä mittari tai sovittu hinta ja anna kuitti. Ohjaa asiakas yhtiön asiakaspalveluun. Jos epäilet seteliä vääräksi, pyydä toista maksutapaa ja vie seteli poliisille.]"}, {"id": "M21", "slug": "lost-property-check-return-log", "title": "Lost Property Check Return Log", "en": "A professional driver checks the vehicle after every journey: the back seat, footwells, door pockets and boot. A quick look before the next customer reveals a forgotten phone, wallet or bag while the owner is still easy to reach. If you find an item straight away, try to return it to the customer without delay – they are often still nearby or can be reached through the dispatch centre.\n  [Simplified: Look through the car after every trip. Check the back seat, the floor, the door pockets and the boot. If you find something a customer left behind, try to give it back right away. Ask the dispatch centre for help.]\n\nIf the owner cannot be reached straight away, follow your dispatch company's procedure: report the find to the dispatch centre and log what you found, on which journey and when. Store the item securely – for example in a locked compartment or at the office, not in plain sight in the car. Items whose owner cannot be traced are handed over to the police lost-property service or a lost-property office, according to your company's practice. Careful logging also protects you: it shows that you acted honestly.\n  [Simplified: If you cannot reach the owner, tell the dispatch centre. Write down what you found, when, and on which trip. Keep the item in a safe place. If the owner is not found, the item goes to the police lost-property service.]\n\nRespect the customer's privacy: open a wallet or bag only as far as needed to identify the owner, and never browse a phone's contents, messages or documents. Some finds are urgent: medication such as insulin, as well as passports, keys and assistive devices, may be essential to the owner. Report them to the dispatch centre immediately, not at the end of your shift. If you suspect the customer's health is at risk without their medication, the emergency number is 112.\n  [Simplified: Do not go through the customer's things. Look only enough to see whose item it is. Medicine, passports and keys are urgent. Report them to the dispatch centre right away. In an emergency, call 112.]\n\nYou drive an elderly customer home from the health centre. While waiting for your next job you check the back seat and notice a pharmacy bag with prescription medicines in the footwell. You report the find to the dispatch centre immediately; they reach the customer through the booking details, and you return the bag the same afternoon. Finally, you log the find and the return according to your company's instructions.\n\nThe most common mistake is tossing a found item into the glove box \"for later\" without reporting or logging it. The item is forgotten, the customer never gets their property back, and the driver may face suspicion of dishonesty – trust and reputation suffer.\n\nRemember: check the vehicle after every journey, report a find to the dispatch centre immediately and log it – and never keep found property for yourself. Medication, documents and keys are always treated as urgent.", "fi": "Ammattikuljettaja tarkistaa auton jokaisen kyydin jälkeen: takapenkin, jalkatilat, ovilokerot ja tavaratilan. Nopea silmäys ennen seuraavaa asiakasta paljastaa unohtuneen puhelimen, lompakon tai kassin silloin, kun omistaja on vielä helppo tavoittaa. Jos löydät tavaran heti, yritä palauttaa se asiakkaalle viipymättä – usein hän on vielä lähellä tai tavoitettavissa välityskeskuksen kautta.\n  [Simplified: Katso auto läpi jokaisen kyydin jälkeen. Katso takapenkki, lattia, ovilokerot ja tavaratila. Jos löydät asiakkaan tavaran, yritä antaa se takaisin heti. Kysy apua välityskeskukselta.]\n\nJos omistajaa ei tavoiteta heti, toimi välitysyhtiösi ohjeiden mukaan: ilmoita löydöstä välityskeskukseen ja kirjaa ylös, mitä löysit, miltä kyydiltä ja milloin. Säilytä tavara turvallisesti – esimerkiksi lukitussa lokerossa tai toimipisteessä, ei näkyvillä autossa. Tavarat, joiden omistajaa ei löydy, toimitetaan poliisin löytötavarapalveluun tai löytötavaratoimistoon yhtiön käytännön mukaisesti. Huolellinen kirjaus suojaa myös sinua: se osoittaa, että toimit rehellisesti.\n  [Simplified: Jos et tavoita omistajaa, kerro löydöstä välityskeskukselle. Kirjoita ylös, mitä löysit, milloin ja miltä kyydiltä. Säilytä tavara turvallisessa paikassa. Jos omistajaa ei löydy, tavara viedään poliisin löytötavarapalveluun.]\n\nKunnioita asiakkaan yksityisyyttä: avaa lompakko tai laukku vain sen verran, että voit tunnistaa omistajan, äläkä koskaan selaa puhelimen sisältöä, viestejä tai asiakirjoja. Osa löydöistä on kiireellisiä: lääkkeet, kuten insuliini, sekä passit, avaimet ja apuvälineet voivat olla omistajalleen välttämättömiä. Ilmoita niistä välityskeskukseen heti, älä vasta vuoron lopussa. Jos epäilet, että asiakkaan terveys on vaarassa puuttuvan lääkkeen vuoksi, hätänumero on 112.\n  [Simplified: Älä tutki asiakkaan tavaroita. Katso vain, kenen tavara on. Lääkkeet, passit ja avaimet ovat kiireellisiä. Ilmoita niistä heti välityskeskukseen. Hätätilanteessa soita 112.]\n\nViet iäkkään asiakkaan terveysasemalta kotiin. Seuraavaa kyytiä odottaessasi tarkistat takapenkin ja huomaat jalkatilassa apteekin pussin, jossa on reseptilääkkeitä. Ilmoitat löydöstä heti välityskeskukseen, joka tavoittaa asiakkaan tilaustietojen perusteella, ja palautat pussin saman iltapäivän aikana. Lopuksi kirjaat löydön ja palautuksen yhtiön ohjeen mukaan.\n\nYleisin virhe on heittää löytötavara hansikaslokeroon \"myöhempää varten\" ilman ilmoitusta ja kirjausta. Tavara unohtuu, asiakas ei saa omaisuuttaan takaisin, ja kuljettaja voi joutua epäillyksi epärehellisyydestä – luottamus ja maine kärsivät.\n\nMuista: tarkista auto jokaisen kyydin jälkeen, ilmoita löydöstä heti välityskeskukseen ja kirjaa se – äläkä koskaan pidä löytötavaraa itselläsi. Lääkkeet, asiakirjat ja avaimet käsitellään aina kiireellisinä."}, {"id": "M22", "slug": "intoxicated-and-vulnerable-customers", "title": "Intoxicated And Vulnerable Customers", "en": "Assess the customer's condition before the journey begins: can they state their destination, get into the car and sit safely in their seat? If a companion brings an intoxicated customer to the taxi, confirm the destination, door code and payment method with the companion before setting off. A professional driver also makes sure that an intoxicated customer's seat belt stays fastened for the whole journey.\n  [Simplified: Check the customer's condition before you drive. Can they say where they are going? If a friend brings the customer to the taxi, ask the friend for the address and how the ride will be paid. Fasten the customer's seat belt.]\n\nNever leave a helpless customer alone in danger — in the Finnish winter, cold exposure can become life-threatening in a short time. If the customer does not respond to speech or gentle shaking, or their level of consciousness drops during the journey, call the emergency number 112 immediately and follow the dispatcher's instructions. An unconscious person who is breathing should be turned into the recovery position to keep the airway open.\n  [Simplified: Never leave a helpless customer outside alone. Cold weather is dangerous. If the customer does not wake up, call 112. Turn an unconscious, breathing person onto their side in the recovery position.]\n\nOn a Saturday night, a restaurant doorman helps an unsteady customer into your taxi and gives you the home address. You confirm the address and payment method with the doorman, fasten the customer's seat belt and set off. At the destination the customer does not respond to your voice or careful shaking, and you notice one corner of their mouth is drooping. You do not assume it is only drunkenness — you call 112 and stay with the customer until help arrives.\n\nThe most common mistake is to interpret confusion, slurred speech or unsteadiness as mere drunkenness — the same symptoms can be caused by a stroke or a diabetic's low blood sugar. Misjudging the situation and leaving the customer alone in the cold can lead to death.\n\nRemember for the exam and on the job: if you are not sure whether the customer's condition is intoxication or illness, call 112. Calling the emergency centre is never wrong when a customer's condition worries you.\n\nYou may refuse to transport a customer who behaves threateningly or is so intoxicated that the journey cannot be carried out safely. Refuse calmly and politely, stay in the safety of the car, avoid arguing, and inform the dispatch centre if needed. Refusing a ride never means abandoning a person: if the customer is helpless or in danger, make sure they get help — for example from a doorman, a companion, or by calling 112.\n  [Simplified: You can say no to a ride if the customer is threatening or in very bad condition. Speak calmly. But never leave a helpless person alone — get help for them or call 112.]", "fi": "Arvioi asiakkaan tila jo ennen matkan alkua: pystyykö hän kertomaan määränpäänsä, siirtymään autoon ja istumaan turvallisesti paikallaan? Jos saattaja tuo päihtyneen asiakkaan kyytiin, varmista määränpää, ovikoodi ja maksutapa saattajalta ennen liikkeelle lähtöä. Ammattikuljettaja huolehtii myös siitä, että päihtyneen asiakkaan turvavyö on kiinnitetty koko matkan ajan.\n  [Simplified: Katso asiakkaan kunto ennen matkaa. Pystyykö hän sanomaan, minne hän on menossa? Jos ystävä tuo asiakkaan taksiin, kysy osoite ja maksutapa ystävältä. Laita asiakkaan turvavyö kiinni.]\n\nÄlä koskaan jätä avutonta asiakasta yksin vaaraan – Suomen talvessa kylmyys voi olla hengenvaarallinen jo lyhyessä ajassa. Jos asiakas ei herää puhutteluun tai kevyeen ravisteluun tai hänen tajuntansa heikkenee matkan aikana, soita heti hätänumeroon 112 ja toimi hätäkeskuksen ohjeiden mukaan. Tajuton mutta hengittävä henkilö käännetään kylkiasentoon, jotta hengitystiet pysyvät avoimina.\n  [Simplified: Älä jätä avutonta asiakasta yksin ulos. Kylmä ilma on vaarallinen. Jos asiakas ei herää, soita 112. Käännä tajuton, hengittävä ihminen kylkiasentoon.]\n\nLauantaiyönä ravintolan ovimies saattaa horjuvan asiakkaan taksiisi ja antaa kotiosoitteen. Varmistat osoitteen ja maksutavan ovimieheltä, kiinnität asiakkaan turvavyön ja lähdet liikkeelle. Perillä asiakas ei herää puheeseen eikä varovaiseen ravisteluun, ja huomaat hänen toisen suupielensä roikkuvan. Et oleta, että kyse on pelkästä humalasta, vaan soitat 112:een ja jäät asiakkaan luo, kunnes apu saapuu.\n\nYleisin virhe on tulkita sekavuus, sammaltava puhe tai horjuminen pelkäksi humalaksi – samat oireet voivat johtua aivoverenkiertohäiriöstä tai diabeetikon matalasta verensokerista. Väärä tulkinta ja asiakkaan jättäminen yksin kylmään voi johtaa kuolemaan.\n\nMuista kokeessa ja työssä: jos et ole varma, johtuuko asiakkaan tila päihtymyksestä vai sairaudesta, soita 112. Hätäkeskukseen soittaminen ei ole koskaan väärin, kun asiakkaan vointi huolestuttaa.\n\nVoit kieltäytyä kuljettamasta asiakasta, joka käyttäytyy uhkaavasti tai on niin päihtynyt, ettei matkaa voi toteuttaa turvallisesti. Kieltäydy rauhallisesti ja kohteliaasti, pysy auton suojassa, älä lähde väittelemään ja ilmoita tilanteesta tarvittaessa välityskeskukselle. Kieltäytyminen ei kuitenkaan koskaan tarkoita ihmisen hylkäämistä: jos asiakas on avuton tai vaarassa, varmista että hän saa apua – esimerkiksi ovimieheltä, saattajalta tai soittamalla 112.\n  [Simplified: Voit sanoa ei kyydille, jos asiakas on uhkaava tai liian huonossa kunnossa. Puhu rauhallisesti. Älä silti jätä avutonta ihmistä yksin – hanki hänelle apua tai soita 112.]"}, {"id": "M23", "slug": "aggression-harassment-and-conflict-de-escalation", "title": "Aggression Harassment And Conflict De Escalation", "en": "When facing an aggressive passenger, a professional driver's most important tool is their own calm. Speak in a low, steady voice, do not argue and do not let yourself be provoked, even if you are insulted. You can acknowledge the customer's feeling (\"I understand this is frustrating\"), but keep a professional distance and focus on ending the ride safely. Most threatening situations defuse when the driver does not mirror the passenger's agitation.\n  [Simplified: Stay calm when a passenger is angry. Speak slowly and calmly. Do not argue and do not answer insults. Your calm voice often calms the passenger too.]\n\nIf the situation escalates during the ride, stop the car in a well-lit public place where other people are around — for example a service station or a taxi rank. Plan your exit route in advance: keep the door within reach and never let anyone position themselves between you and the way out. If a passenger threatens violence or becomes physical, leave the vehicle if it is safe to do so and call the emergency number 112. Protect any other passengers at the same time: guide them out of the car or away from the threatening person.\n  [Simplified: If a passenger becomes threatening, stop the car where there is light and other people. Make sure you can get out of the car. If someone threatens you with violence, call 112. Help the other passengers to safety too.]\n\nOn a Saturday night, a back-seat passenger starts shouting at the driver and pounding the seat back. The driver answers in a calm voice, turns into a well-lit service station forecourt and stops the car in view of the entrance and other people. When the passenger threatens violence, the driver leaves the car, helps the other passenger to safety and calls 112. Afterwards, the driver writes down what happened and reports the incident to the dispatch company.\n\nAfter a dangerous incident, write down what happened as soon as possible: the time, the place, the sequence of events and any witnesses. Preserve evidence such as camera recordings and trip data, and do not clean or repair anything before the situation has been documented. Report the incident to your dispatch company or employer, and in serious cases to the police. A violent or threatening situation can shake even an experienced driver — post-incident support, such as talking with your employer, occupational health services or people close to you, is part of professional recovery, not a weakness.\n  [Simplified: Write down what happened right away: the time, the place and who was involved. Keep the camera recording and other evidence. Tell your employer about the incident, and the police if needed. Talk to someone about what happened — it helps you recover.]\n\nThe most common mistake is to argue back or answer provocation in kind — it almost always escalates the situation and can turn a verbal conflict into violence. Also, do not keep driving to a remote destination with a threatening passenger just to finish the ride.\n\nRemember: your safety and your passengers' safety always come before the ride and the fare. In a threat or violence situation the right number is 112 — and after the incident you document what happened and report it onward.", "fi": "Aggressiivisesti käyttäytyvän matkustajan kohtaamisessa ammattikuljettajan tärkein työkalu on oma rauhallisuus. Puhu matalalla ja tasaisella äänellä, älä väittele äläkä provosoidu, vaikka sinua loukattaisiin. Voit sanoittaa asiakkaan tunteen (\"ymmärrän, että tilanne harmittaa\"), mutta pidä ammatillinen etäisyys ja keskity kyydin turvalliseen päättämiseen. Suurin osa uhkaavista tilanteista laukeaa, kun kuljettaja ei lähde mukaan kiihtyneeseen tunnetilaan.\n  [Simplified: Pysy rauhallisena, kun matkustaja on vihainen. Puhu hitaasti ja rauhallisesti. Älä väittele äläkä vastaa loukkauksiin. Rauhallinen puhe rauhoittaa usein myös matkustajan.]\n\nJos tilanne kiristyy ajon aikana, pysäytä auto valaistulle ja julkiselle paikalle, jossa on muita ihmisiä – esimerkiksi huoltoasemalle tai taksitolpalle. Suunnittele poistumisreittisi etukäteen: pidä ovi käden ulottuvilla äläkä anna kenenkään asettua sinun ja uloskäynnin väliin. Jos matkustaja uhkaa väkivallalla tai käy käsiksi, poistu autosta, jos se on turvallista, ja soita hätänumeroon 112. Suojaa samalla muita matkustajia: ohjaa heidät ulos autosta tai poispäin uhkaavasta henkilöstä.\n  [Simplified: Jos matkustaja muuttuu uhkaavaksi, pysäytä auto paikkaan, jossa on valoa ja muita ihmisiä. Varmista, että pääset itse ulos autosta. Jos joku uhkaa sinua väkivallalla, soita numeroon 112. Auta myös muut matkustajat turvaan.]\n\nLauantaiyönä takapenkin matkustaja alkaa huutaa kuljettajalle ja hakata istuimen selkänojaa. Kuljettaja vastaa rauhallisella äänellä, kääntyy valaistun huoltoaseman pihaan ja pysäyttää auton sisäänkäynnin ja muiden ihmisten näkyville. Kun matkustaja uhkaa väkivallalla, kuljettaja poistuu autosta, auttaa toisen matkustajan turvaan ja soittaa numeroon 112. Jälkeenpäin hän kirjaa tapahtumat muistiin ja ilmoittaa tilanteesta välitysyhtiölleen.\n\nVaaratilanteen jälkeen kirjaa tapahtumat muistiin mahdollisimman pian: aika, paikka, tapahtumien kulku ja mahdolliset todistajat. Säilytä todisteet, kuten kameratallenne ja ajotiedot, äläkä siivoa tai korjaa mitään ennen kuin tilanne on dokumentoitu. Ilmoita tapahtuneesta välitysyhtiölle tai työnantajalle ja vakavissa tapauksissa poliisille. Väkivalta- tai uhkatilanne voi järkyttää kokenuttakin kuljettajaa – jälkihoito, kuten keskustelu työnantajan, työterveyshuollon tai läheisten kanssa, on osa ammattimaista toipumista, ei heikkoutta.\n  [Simplified: Kirjoita heti muistiin, mitä tapahtui: aika, paikka ja ketkä olivat mukana. Säilytä kameran tallenne ja muut todisteet. Kerro tapahtuneesta työnantajalle ja tarvittaessa poliisille. Puhu tapahtuneesta jonkun kanssa – se auttaa toipumaan.]\n\nYleisin virhe on lähteä väittelemään tai vastata provokaatioon samalla mitalla – se kiihdyttää tilannetta lähes aina ja voi muuttaa sanallisen konfliktin väkivaltaiseksi. Älä myöskään jatka ajoa syrjäiseen määränpäähän uhkaavan matkustajan kanssa vain saattaaksesi kyydin loppuun.\n\nMuista: oma ja matkustajien turvallisuus menee aina kyydin ja maksun edelle. Uhka- ja väkivaltatilanteessa oikea numero on 112 – ja tapahtuman jälkeen tilanne dokumentoidaan ja siitä ilmoitetaan eteenpäin."}, {"id": "M24", "slug": "non-payment-and-fare-disputes", "title": "Non Payment And Fare Disputes", "en": "Clear communication prevents most fare disputes before they even begin. Explain to the customer at the start of the trip how the fare is made up, and confirm the final amount out loud before payment. If the customer questions the sum, walk through it calmly: the meter reading, any surcharges, and how the route affected the price. Always offer alternative payment methods – card, mobile payment, or invoicing afterwards if your company allows it.\n  [Simplified: Tell the customer the price clearly. Say the final amount out loud before payment. If the customer asks, explain the price calmly. Offer another way to pay if one does not work.]\n\nDistinguish between inability and refusal to pay: a customer who genuinely cannot pay right now will often agree to give their contact details for later invoicing, while arguing with someone who refuses to pay leads nowhere. Never use force and never take a customer's belongings as \"security\". Contact your employer or the dispatch centre for instructions, and document the event carefully: time, place, route, amount, and what happened. If the situation becomes threatening, call the emergency number 112 – in other cases an unpaid fare is handled afterwards through reporting and documentation.\n  [Simplified: Some people cannot pay, some refuse to pay – act differently in each case. If the customer cannot pay, ask for contact details for an invoice. Never use force. Never take the customer's things. Call your employer or the dispatch centre. Write down what happened. If the situation is dangerous, call 112.]\n\nOn a Friday night, a customer discovers at the destination that his card does not work and he has no cash. The driver stays calm, suggests a mobile payment, and when that also fails, asks for the customer's contact details for later invoicing and informs the dispatch centre. She immediately writes down the time, route, amount, and the details the customer gave. The fare goes unpaid for the moment, but the situation is resolved without conflict and the payment is collected later by invoice.\n\nThe most common mistake is trying to stop the customer from leaving or taking their phone as \"security\" – that can turn the driver from the injured party into the suspect. No fare is worth your safety or your professional reputation.\n\nRemember for the exam: money can be collected afterwards, but the consequences of a conflict cannot be undone – calmness, alternative payment methods, and careful documentation are a professional driver's most important tools in a fare dispute.", "fi": "Selkeä viestintä ehkäisee useimmat maksukiistat jo ennen niiden syntymistä. Kerro asiakkaalle ajon alussa, mistä hinta muodostuu, ja varmista loppusumma ääneen ennen maksua. Jos asiakas ihmettelee summaa, käy hinta rauhallisesti läpi: mittarilukema, mahdolliset lisämaksut ja reitin vaikutus. Tarjoa aina vaihtoehtoisia maksutapoja – kortti, mobiilimaksu tai jälkilaskutus, jos yrityksesi sen sallii.\n  [Simplified: Kerro hinta selvästi. Sano loppusumma ääneen ennen maksua. Jos asiakas kysyy, selitä hinta rauhassa. Tarjoa toinen maksutapa, jos yksi ei toimi.]\n\nErota toisistaan maksukyvyttömyys ja maksuhaluttomuus: asiakas, joka ei juuri nyt pysty maksamaan, suostuu usein antamaan yhteystietonsa jälkilaskutusta varten, kun taas maksusta kieltäytyvän kanssa ei kannata väitellä. Älä koskaan käytä voimakeinoja äläkä ota asiakkaan omaisuutta \"pantiksi\". Ota yhteyttä työnantajaasi tai välityskeskukseen ohjeiden saamiseksi ja kirjaa tapahtuma huolellisesti: aika, paikka, reitti, summa ja tapahtumien kulku. Jos tilanne muuttuu uhkaavaksi, soita hätänumeroon 112 – muissa tapauksissa maksamatta jäänyt kyyti hoidetaan jälkikäteen ilmoituksella ja dokumentoinnilla.\n  [Simplified: Joku ei voi maksaa, joku ei halua maksaa – toimi eri tavalla. Jos asiakas ei pysty maksamaan, pyydä yhteystiedot laskua varten. Älä käytä voimaa. Älä ota asiakkaan tavaroita. Soita työnantajalle tai keskukseen. Kirjoita ylös, mitä tapahtui. Jos tilanne on vaarallinen, soita 112.]\n\nPerjantai-iltana asiakas huomaa perillä, ettei hänen korttinsa toimi eikä käteistä ole. Kuljettaja pysyy rauhallisena, ehdottaa mobiilimaksua, ja kun sekään ei onnistu, pyytää asiakkaan yhteystiedot jälkilaskutusta varten ja ilmoittaa asiasta välityskeskukseen. Hän kirjaa heti muistiin ajan, reitin, summan ja asiakkaan antamat tiedot. Kyyti jää hetkeksi maksamatta, mutta tilanne ratkeaa ilman konfliktia ja maksu saadaan myöhemmin laskulla.\n\nYleisin virhe on yrittää estää asiakasta poistumasta tai ottaa hänen puhelimensa \"pantiksi\" – silloin kuljettaja voi itse muuttua tilanteen vahingonkärsijästä epäillyksi. Mikään kyytimaksu ei ole oman turvallisuutesi tai ammattimaineesi arvoinen.\n\nMuista kokeeseen: rahan voi periä jälkikäteen, mutta konfliktin seurauksia ei voi perua – rauhallisuus, vaihtoehtoiset maksutavat ja huolellinen dokumentointi ovat ammattikuljettajan tärkeimmät työkalut maksukiistassa."}, {"id": "M25", "slug": "emergency-first-response-securing-scene-and-112", "title": "Emergency First Response Securing Scene And 112", "en": "At an accident scene, a professional driver's first task is to prevent further harm: stop the car in a safe place, switch on the hazard lights, and warn other traffic with the warning triangle and a high-visibility vest. Once the scene is secured, call the emergency number 112, calmly explain what has happened and where, and answer the dispatcher's questions. Do not end the call until you are told you may, and follow the instructions you are given until professional help arrives.\n  [Simplified: Park safely. Turn on the hazard lights. Use the warning triangle and a reflective vest. Call 112. Say what happened and where. Stay on the line until the dispatcher says you can hang up.]\n\nIf a passenger or casualty does not respond, shake them gently by the shoulders and speak to them loudly. If they do not wake, open the airway by carefully tilting the head back and check whether they are breathing normally. An unconscious person who is breathing normally is turned into the recovery position so the airway stays open, and their condition is monitored until help arrives. Severe bleeding is controlled by pressing directly and firmly on the wound, for example with a piece of cloth.\n  [Simplified: Try to wake the person: shake gently and speak loudly. If they do not wake, check their breathing. If they are breathing, turn them on their side into the recovery position. If they are bleeding heavily, press hard on the wound. Watch over them until help arrives.]\n\nOn a winter evening, a driver notices in the rear-view mirror that an elderly customer has slumped over in the back seat and does not respond when spoken to. He stops the car in a safe place, switches on the hazard lights and calls 112 immediately. Following the dispatcher's instructions, he checks the customer's breathing, keeps the airway open and monitors the situation without hanging up until the ambulance arrives.\n\nThe most common mistake is rushing to help without first securing the scene: without hazard lights, a warning triangle and a reflective vest, the helper can be struck by passing traffic. The helper must not become a second casualty.\n\nRemember the order: secure the scene, call 112, give emergency first aid. An unconscious person who is breathing normally is turned into the recovery position — in Finland the emergency number is always 112.\n\nIf smoke starts coming from the car or you see signs of fire, stop immediately, switch off the engine and evacuate all passengers well away from the car and away from traffic — a car can be replaced, people cannot. Remember that some customers need help to evacuate: calmly tell a visually impaired passenger what is happening and guide them by the arm, and help a passenger with reduced mobility or a wheelchair user out of the car before rescuing the mobility aid. A professional driver thinks in advance about how each passenger on board would get out in an emergency.\n  [Simplified: If the car is smoking, stop at once and turn off the engine. Move all passengers far away from the car. Help those who cannot get out on their own: explain what is happening and guide them by the arm. People first, bags and mobility aids later.]", "fi": "Onnettomuuspaikalla ammattikuljettajan ensimmäinen tehtävä on estää lisävahingot: pysäytä auto turvalliseen paikkaan, kytke hätävilkut ja varoita muuta liikennettä varoituskolmiolla ja heijastinliivillä. Kun paikka on turvattu, soita hätänumeroon 112, kerro rauhallisesti, mitä on tapahtunut ja missä, ja vastaa hätäkeskuspäivystäjän kysymyksiin. Älä lopeta puhelua, ennen kuin saat siihen luvan, ja noudata saamiasi ohjeita, kunnes ammattiapu saapuu paikalle.\n  [Simplified: Pysäköi turvallisesti. Laita hätävilkut päälle. Käytä varoituskolmiota ja heijastinliiviä. Soita 112. Kerro, mitä tapahtui ja missä. Älä sulje puhelinta, ennen kuin päivystäjä antaa luvan.]\n\nJos matkustaja tai onnettomuuden uhri ei reagoi, ravista häntä varovasti hartioista ja puhuttele kovalla äänellä. Jos hän ei herää, avaa hengitystiet taivuttamalla päätä varovasti taaksepäin ja tarkista, hengittääkö hän normaalisti. Tajuton, normaalisti hengittävä ihminen käännetään kylkiasentoon, jotta hengitystiet pysyvät avoimina, ja hänen tilaansa seurataan avun saapumiseen asti. Runsas verenvuoto tyrehdytetään painamalla vuotokohtaa suoraan ja voimakkaasti, esimerkiksi kankaalla.\n  [Simplified: Herättele: ravista varovasti ja puhu kovalla äänellä. Jos ihminen ei herää, tarkista hengitys. Jos hän hengittää, käännä hänet kylkiasentoon. Jos verta vuotaa paljon, paina haavaa lujasti. Seuraa vointia, kunnes apu tulee.]\n\nTalvisena iltana kuljettaja huomaa peruutuspeilistä, että iäkäs asiakas on lyyhistynyt takapenkille eikä vastaa puhutteluun. Hän pysäyttää auton turvalliseen paikkaan, kytkee hätävilkut ja soittaa välittömästi hätänumeroon 112. Päivystäjän ohjeiden mukaan hän tarkistaa asiakkaan hengityksen, pitää hengitystiet avoimina ja seuraa tilannetta puhelua sulkematta, kunnes ambulanssi saapuu paikalle.\n\nYleisin virhe on rynnätä auttamaan turvaamatta ensin onnettomuuspaikkaa: ilman hätävilkkuja, varoituskolmiota ja heijastinliiviä auttaja voi itse jäädä ohi ajavan auton alle. Auttajasta ei saa tulla toista uhria.\n\nMuista järjestys: turvaa paikka, soita 112, anna hätäensiapu. Tajuton mutta normaalisti hengittävä käännetään kylkiasentoon — Suomessa hätänumero on aina 112.\n\nJos autosta nousee savua tai näet palon merkkejä, pysäytä heti, sammuta moottori ja evakuoi kaikki matkustajat riittävän kauas autosta ja poispäin liikenteestä — auto on korvattavissa, ihmiset eivät. Muista, että osa asiakkaista tarvitsee evakuoinnissa apua: kerro näkövammaiselle rauhallisesti, mitä tapahtuu, ja ohjaa häntä käsivarresta, ja auta liikuntarajoitteinen tai pyörätuolia käyttävä asiakas ulos ennen apuvälineen pelastamista. Ammattikuljettaja miettii jo etukäteen, miten kukin kyydissä oleva pääsisi autosta ulos hätätilanteessa.\n  [Simplified: Jos auto savuaa, pysähdy heti ja sammuta moottori. Vie kaikki matkustajat kauas autosta. Auta niitä, jotka eivät pääse itse ulos: kerro mitä tapahtuu ja ohjaa kädellä. Ihminen ensin, tavarat ja apuvälineet vasta sitten.]"}, {"id": "M26", "slug": "kela-reimbursed-taxi-transport", "title": "Kela Reimbursed Taxi Transport", "en": "Kela (FPA) reimburses a customer's taxi journey to healthcare when the trip is related to treatment or rehabilitation and the customer's situation requires it. As a rule, a Kela taxi is ordered through the regional dispatch centre, not directly from the driver. The customer pays a deductible directly in the taxi, and Kela reimburses the rest to the service provider. The deductible amount and the exact conditions change from time to time — always check the up-to-date details in Kela's instructions.\n  [Simplified: Kela pays part of the taxi trip when a customer travels to healthcare. The ride is booked through the regional dispatch centre. The customer pays only the deductible in the taxi. Always check the amounts and rules in Kela's current instructions.]\n\nThe dispatch centre may combine several customers' journeys into the same vehicle, in which case the route and schedule are planned around all passengers' needs. Combined journeys are a normal part of Kela transport, and a professional driver explains this to the customer calmly and clearly. An accompanying person may travel with the customer if the customer's situation requires it — the conditions for accompanying persons should be confirmed from Kela's current instructions.\n  [Simplified: One taxi may carry several Kela customers at the same time. This is normal, and the driver tells the customer about it. A customer may bring an accompanying person if they need help. Check the rules about accompanying persons in Kela's instructions.]\n\nOn Kela rides the driver handles information connected to the customer's health: even the fact that a customer is travelling to treatment is confidential. A professional driver never discusses a customer's journeys, health, or addresses with outsiders — nor within earshot of other customers on a combined journey. The customer is always given a receipt for the payment, and the current payment and receipt practices are confirmed from the instructions of Kela and the dispatch centre.\n  [Simplified: Information about a customer's healthcare is confidential. Do not talk about a customer's matters to others — not even so that other passengers can hear. Always give the customer a receipt for the payment. Check the practices in Kela's instructions.]\n\nYou receive a Kela ride from the dispatch centre: an elderly customer is going to the health centre, and another customer from a neighbouring municipality has been combined into the journey. You help the first customer into the car without rushing and explain that another passenger will share the ride and will be picked up along the way. At the destination you charge only the deductible, give a receipt, and if needed walk the customer to the door. You say nothing about either customer's matters to the other.\n\nThe most common mistake is taking a Kela customer outside the dispatch centre system — for example directly from a taxi rank or by private arrangement. The customer may then lose the Kela reimbursement entirely and have to pay for the whole journey themselves.\n\nRemember for the exam: a Kela taxi is ordered through the regional dispatch centre, the customer pays only the deductible, and journeys may be combined. Amounts and exact conditions change — always check them in Kela's current instructions.", "fi": "Kela korvaa asiakkaan taksimatkan terveydenhuoltoon, kun matka liittyy sairauden hoitoon tai kuntoutukseen ja asiakkaan tilanne sitä edellyttää. Kela-taksi tilataan pääsääntöisesti alueellisesta tilausvälityskeskuksesta, ei suoraan kuljettajalta. Asiakas maksaa matkasta omavastuuosuuden suoraan taksissa, ja Kela korvaa loput palveluntuottajalle. Omavastuun määrä ja tarkat ehdot muuttuvat ajoittain — tarkista ajantasaiset tiedot aina Kelan ohjeista.\n  [Simplified: Kela maksaa osan taksimatkasta, kun asiakas matkustaa hoitoon. Matka tilataan alueen tilausvälityskeskuksesta. Asiakas maksaa taksissa vain omavastuun. Tarkista summat ja säännöt aina Kelan ohjeista.]\n\nTilausvälityskeskus voi yhdistellä useiden asiakkaiden matkoja samaan autoon, jolloin reitti ja aikataulu suunnitellaan kaikkien matkustajien tarpeiden mukaan. Yhdistely on normaali osa Kela-kyytejä, ja ammattitaitoinen kuljettaja kertoo siitä asiakkaalle rauhallisesti ja selkeästi. Asiakkaan mukana voi matkustaa saattaja, jos asiakkaan tilanne sitä edellyttää — saattajaa koskevat ehdot kannattaa varmistaa Kelan ajantasaisista ohjeista.\n  [Simplified: Sama taksi voi kuljettaa useita Kela-asiakkaita yhtä aikaa. Tämä on normaalia, ja kuljettaja kertoo siitä asiakkaalle. Asiakkaalla voi olla mukana saattaja, jos hän tarvitsee apua. Tarkista saattajaa koskevat säännöt Kelan ohjeista.]\n\nKela-kyydeissä kuljettaja käsittelee asiakkaan terveyteen liittyviä tietoja: jo tieto siitä, että asiakas matkustaa hoitoon, on luottamuksellinen. Ammattikuljettaja ei koskaan keskustele asiakkaan matkoista, terveydentilasta tai osoitteista ulkopuolisten kanssa — ei myöskään toisten asiakkaiden kuullen yhdistellyllä matkalla. Asiakkaalle annetaan maksusta aina kuitti, ja maksu- ja kuittikäytännöt varmistetaan Kelan ja välityskeskuksen ajantasaisista ohjeista.\n  [Simplified: Asiakkaan hoitoon liittyvät tiedot ovat luottamuksellisia. Älä puhu asiakkaan asioista muille — älä myöskään toisten matkustajien kuullen. Anna asiakkaalle aina kuitti maksusta. Tarkista käytännöt Kelan ohjeista.]\n\nSaat välityskeskuksesta Kela-kyydin: iäkäs asiakas on menossa terveysasemalle, ja matkaan on yhdistetty toinen asiakas naapurikunnasta. Autat ensimmäisen asiakkaan kiireettä kyytiin ja kerrot, että kyydissä on toinenkin matkustaja, joka noudetaan matkan varrelta. Perillä veloitat vain omavastuun, annat kuitin ja saatat asiakkaan tarvittaessa ovelle asti. Kummankaan asiakkaan asioista et kerro toiselle mitään.\n\nYleisin virhe on ottaa Kela-asiakas kyytiin ohi tilausvälityskeskuksen — esimerkiksi suoraan tolpalta tai omalla sopimuksella. Silloin asiakas voi menettää Kela-korvauksen kokonaan ja joutua maksamaan koko matkan itse.\n\nMuista kokeeseen: Kela-taksi tilataan alueellisesta tilausvälityskeskuksesta, asiakas maksaa vain omavastuun, ja matkoja voidaan yhdistellä. Summat ja tarkat ehdot muuttuvat — tarkista ne aina Kelan ajantasaisista ohjeista."}, {"id": "M27", "slug": "municipal-and-wellbeing-services-transport", "title": "Municipal And Wellbeing Services Transport", "en": "Municipalities and wellbeing services counties arrange disability-service and social-care transport for their customers to support everyday mobility, for example errands and leisure trips. These journeys are paid fully or partly from public funds and are always driven according to the purchaser's contract terms. They belong to a separate system from Kela-reimbursed trips, so the driver must know which contract each journey belongs to.\n  [Simplified: The wellbeing services county or municipality can pay for a customer's taxi trip. Disability-service trips are one example. Drive these trips by the contract rules. Kela trips belong to a different system.]\n\nThe right to subsidised transport is always personal. A professional driver verifies the customer's travel entitlement before the journey according to the regional instructions, for example from a travel card, the booking details, or an app. The customer's decision may include the right to an assistant or escort who travels along according to the purchaser's instructions — but an assistant can never use the travel entitlement alone.\n  [Simplified: The travel right belongs only to the customer. Check the right before the trip, for example from a travel card. The customer may bring an assistant. The assistant may not travel alone using the customer's travel right.]\n\nMany social-care journeys involve more than driving: the driver may help the customer into and out of the car, escort them to the door, and make sure a receiving person or care facility takes over. Waiting times, escorting, and how they are recorded are defined in the regional contract, and the instructions vary by purchaser. Always check the current instructions for your own region and never assume that another region's practice applies as such.\n  [Simplified: The job can be more than driving. Help the customer into the car and to the door if the instructions say so. Make sure someone receives the customer. Rules differ between regions. Always check your own region's instructions.]\n\nYou pick up a customer with a memory disorder from a day-activity centre to take them home. The booking details show an escorted customer: you verify the travel entitlement from the customer's travel card, help them fasten the seat belt, and on arrival escort them all the way to the door. At the door you hand the customer over to a family member and make sure they are safely home before marking the journey completed according to the purchaser's instructions.\n\nThe most common mistake is assuming that every region and purchaser has the same rules and skipping the entitlement check. A journey driven or recorded on the wrong basis can lead to payment disputes, suspected misuse, and loss of contract work.\n\nRemember: the travel entitlement is personal, an assistant travels with the customer and never alone, and waiting, escorting, and recording practices are always taken from your own region's current contract instructions. In an unclear situation, confirm with the dispatch centre before the journey.", "fi": "Kunnat ja hyvinvointialueet järjestävät asiakkailleen vammaispalvelun ja sosiaalihuollon kuljetuksia, joilla tuetaan liikkumista arjessa, esimerkiksi asiointi- ja vapaa-ajan matkoilla. Nämä matkat maksetaan kokonaan tai osittain julkisista varoista, ja ne ajetaan aina tilaajan sopimusehtojen mukaisesti. Ne kuuluvat eri järjestelmään kuin Kelan korvaamat matkat, joten kuljettajan on tiedettävä, minkä sopimuksen piiriin kukin matka kuuluu.\n  [Simplified: Hyvinvointialue tai kunta voi maksaa asiakkaan taksimatkan. Tällaisia ovat esimerkiksi vammaispalvelun matkat. Aja nämä matkat sopimuksen sääntöjen mukaan. Kela-matkat kuuluvat eri järjestelmään.]\n\nKuljetuspalvelun matkaoikeus on aina henkilökohtainen. Ammattitaitoinen kuljettaja varmistaa asiakkaan matkaoikeuden ennen matkaa alueen ohjeiden mukaisesti, esimerkiksi matkakortista, tilaustiedoista tai sovelluksesta. Asiakkaan päätökseen voi kuulua oikeus avustajaan tai saattajaan, joka matkustaa mukana tilaajan ohjeiden mukaisesti — avustaja ei kuitenkaan voi koskaan käyttää matkaoikeutta yksin.\n  [Simplified: Matkaoikeus kuuluu vain asiakkaalle itselleen. Tarkista oikeus ennen matkaa, esimerkiksi matkakortista. Asiakkaalla voi olla mukana avustaja. Avustaja ei saa matkustaa yksin asiakkaan matkaoikeudella.]\n\nMoniin sosiaalihuollon kuljetuksiin kuuluu muutakin kuin ajaminen: kuljettaja voi auttaa asiakkaan autoon ja autosta, saattaa hänet ovelle ja varmistaa, että vastaanottava henkilö tai hoitopaikka ottaa asiakkaan vastaan. Odotusajoista, saattamisesta ja niiden kirjaamisesta sovitaan alueellisessa sopimuksessa, ja ohjeet vaihtelevat tilaajittain. Tarkista siksi aina oman alueesi voimassa olevat ohjeet äläkä oleta, että toisen alueen käytäntö pätee sellaisenaan.\n  [Simplified: Työhön voi kuulua muutakin kuin ajaminen. Auta asiakas autoon ja ovelle asti, jos ohje niin sanoo. Varmista, että joku ottaa asiakkaan vastaan. Säännöt ovat erilaisia eri alueilla. Tarkista aina oman alueesi ohje.]\n\nHaet muistisairaan asiakkaan päivätoiminnasta kotiin. Tilaustiedoissa lukee, että kyseessä on saatettava asiakas: varmistat matkaoikeuden asiakkaan matkakortista, autat hänet turvavyöhön ja perille tultaessa saatat hänet ovelle asti. Ovella luovutat asiakkaan omaiselle ja varmistat, että hän on turvallisesti perillä, ennen kuin kuittaat matkan päättyneeksi tilaajan ohjeen mukaisesti.\n\nYleisin virhe on olettaa, että kaikkien alueiden ja tilaajien säännöt ovat samat, ja jättää matkaoikeus tarkistamatta. Väärin perustein ajettu tai kirjattu matka voi johtaa maksuriitoihin, väärinkäytösepäilyyn ja sopimusajojen menettämiseen.\n\nMuista: matkaoikeus on henkilökohtainen, avustaja kulkee asiakkaan mukana eikä koskaan yksin, ja odotus-, saatto- ja kirjauskäytännöt luetaan aina oman alueen voimassa olevasta sopimusohjeesta. Epäselvässä tilanteessa varmista asia välityskeskuksesta ennen matkaa."}, {"id": "M28", "slug": "dispatch-technology-payments-and-account-security", "title": "Dispatch Technology Payments And Account Security", "en": "When the dispatch system offers you a ride, check the pickup location and estimated arrival time before accepting — only accept rides you can genuinely complete. The booking data usually shows the customer's name, pickup address, destination and any notes, such as mobility aids or child passengers. At the pickup point, confirm you have the right customer: ask for the name or booking reference before starting the trip. If the customer does not appear, follow your dispatch operator's procedure: wait the agreed time, try to reach the customer through the app, and record the no-show correctly in the system.\n  [Simplified: Check the pickup place before you accept a ride. Only accept rides you can really do. Ask the customer's name when they get in. If the customer does not come, wait a short time, try to call, and mark the trip in the system as instructed.]\n\nThe taximeter or pricing app and the payment terminal work together: start and end each trip correctly in the system so that the price, the payment and the receipt all match. Always offer the customer a receipt — digital or printed — and make sure a digital receipt goes to the right address. Protect customer privacy: position and lock your screens so that passengers and bystanders cannot see other customers' booking details. Keep your driver account secure — use a strong password, never share your login details, and sign out of shared devices.\n  [Simplified: Start and end the trip correctly in the device. Then the price and the receipt are correct. Always give the customer a receipt. Do not let anyone see other customers' information. Never give your password to anyone.]\n\nYou receive a booking: \"Virtanen, Asemakatu 12, destination: the airport.\" At the pickup point, two people wave at your taxi. You calmly ask, \"What name is the booking under?\" One of them answers \"Virtanen\", and you confirm the destination before setting off — this way the trip, the meter and the receipt are recorded for the right customer.\n\nA common mistake is letting the first person who waves get in without verifying the booking. The real customer is left without a ride, the payment and receipt are recorded incorrectly, and the dispatch operator may take action against you.\n\nA professional driver always confirms three things: the right customer, a correctly started meter, and a receipt for every trip. Your driver login details are personal — never share them.\n\nIn the middle of an evening shift, your payment terminal stops working. You calmly explain the situation to the customer, contact the dispatch centre and follow your company's fallback procedure: you carefully note down the trip details and agree on the payment according to the instructions. After the shift, you report the device fault so it is fixed before the next shift.", "fi": "Kun välitysjärjestelmä tarjoaa kyytiä, tarkista noutopaikka ja arvioitu saapumisaika ennen hyväksymistä — ota vastaan vain ajoja, jotka pystyt oikeasti ajamaan. Tilaustiedoissa näkyvät yleensä asiakkaan nimi, noutopaikka, määränpää ja mahdolliset lisätiedot, kuten apuvälineet tai lapsimatkustajat. Varmista noutopaikalla, että kyydissä on oikea asiakas: kysy nimi tai tilausviite ennen matkan aloittamista. Jos asiakas ei saavu, noudata välitysyhtiön ohjetta: odota sovittu aika, yritä tavoittaa asiakas sovelluksen kautta ja kirjaa tilanne järjestelmään oikein.\n  [Simplified: Katso noutopaikka ennen kuin hyväksyt kyydin. Ota vain kyytejä, jotka ehdit ajaa. Kysy asiakkaan nimi, kun hän tulee kyytiin. Jos asiakas ei tule, odota hetki, yritä soittaa ja merkitse kyyti järjestelmään ohjeen mukaan.]\n\nTaksamittari tai hinnoittelusovellus ja maksupääte toimivat yhdessä: aloita ja päätä matka järjestelmässä oikein, jotta hinta, maksu ja kuitti täsmäävät. Tarjoa asiakkaalle aina kuitti — digitaalinen tai paperinen — ja varmista, että digitaalinen kuitti lähtee oikeaan osoitteeseen. Muista tietosuoja: sijoita ja lukitse laitteiden näytöt niin, etteivät matkustajat tai ulkopuoliset näe muiden asiakkaiden tilaustietoja. Pidä kuljettajatilisi turvassa — käytä vahvaa salasanaa, älä koskaan jaa tunnuksiasi ja kirjaudu ulos yhteiskäytössä olevista laitteista.\n  [Simplified: Aloita ja lopeta matka laitteessa oikein. Silloin hinta ja kuitti ovat oikein. Anna asiakkaalle aina kuitti. Älä näytä muiden asiakkaiden tietoja kenellekään. Älä anna salasanaasi kenellekään.]\n\nSaat tilauksen: \"Virtanen, Asemakatu 12, määränpäänä lentoasema.\" Noutopaikalla kaksi ihmistä viittoo taksillesi. Kysyt rauhallisesti: \"Kenen nimellä tilaus on?\" Toinen vastaa \"Virtanen\", ja varmistat vielä määränpään ennen liikkeellelähtöä — näin matka, mittari ja kuitti kirjautuvat oikealle asiakkaalle.\n\nYleinen virhe on ottaa kyytiin ensimmäinen taksia viittova henkilö varmistamatta tilausta. Silloin oikea asiakas jää ilman kyytiä, maksu ja kuitti kirjautuvat väärin ja välitysyhtiö voi puuttua toimintaasi.\n\nAmmattikuljettaja varmistaa aina kolme asiaa: oikea asiakas, oikein käynnistetty mittari ja kuitti jokaisesta matkasta. Kuljettajatunnuksesi ovat henkilökohtaiset — älä koskaan jaa niitä.\n\nKesken iltavuoron maksupääte lakkaa toimimasta. Kerrot asiakkaalle tilanteesta rauhallisesti, otat yhteyttä välityskeskukseen ja toimit yhtiösi varamenettelyn mukaan: kirjaat matkan tiedot huolellisesti muistiin ja sovit maksusta ohjeiden mukaisesti. Vuoron jälkeen ilmoitat laiteviasta, jotta se korjataan ennen seuraavaa vuoroa."}, {"id": "M29", "slug": "electric-hybrid-taxi-range-charging-eco-driving", "title": "Electric Hybrid Taxi Range Charging Eco Driving", "en": "An electric taxi's range must be planned for the whole shift: in cold weather the battery delivers less energy and cabin heating consumes more, so winter range can be significantly shorter than in summer. A professional driver starts the shift with a sufficient charge and knows the charging points along their regular routes. Time your charging to natural breaks — a meal break or a quiet moment at the rank — so fast charging does not eat into driving hours.\n  [Simplified: Cold weather clearly shortens an electric car's range. Start your shift with a full or nearly full battery. Learn where the charging points are along your routes. Charge during breaks, not in the middle of trips.]\n\nRegenerative braking converts the car's motion back into electricity: when the driver anticipates traffic and lifts off the accelerator early, the motor slows the car and recharges the battery at the same time. A steady speed, gentle acceleration and an anticipatory driving style cut energy use in every drivetrain — petrol and diesel included. Unnecessary idling burns fuel and produces emissions, and in an electric car every extra minute of stationary heating eats into your range.\n  [Simplified: An electric car recharges its battery when you slow down using the motor. Drive with anticipation: ease off the accelerator early and avoid hard braking. Smooth driving saves energy in every car. Avoid unnecessary idling.]\n\nIt is a Friday evening in January, 15 degrees below zero. At the start of the shift, electric-taxi driver Ville sees the display promising 280 kilometres, but he knows from experience that the real winter range will be clearly shorter. He preheats the car while it is still plugged in, drives the evening rush and schedules a 20-minute fast charge for a quiet moment at 9 p.m. — using the same stop as his break. The shift continues into the early hours without a single trip lost to charging.\n\nThe most common mistake is trusting the range you learned in summer once winter arrives: in freezing weather the battery delivers clearly less, and a battery that runs flat mid-shift means cancelled trips, a tow and lost earnings.\n\nRemember for the exam: cold weather clearly shortens an electric car's range, charging is timed to breaks, and an anticipatory driving style that uses regenerative braking saves energy in every drivetrain.\n\nCharging safety basics: use only an undamaged charging cable and a charging point intended for vehicles, inspect the plug and cable for damage, and do not charge through an extension lead unless the manufacturer expressly permits it. Breakdowns differ by drivetrain: a driver never touches the high-voltage components of an electric or hybrid car — especially the orange cables — and the car is moved by professional recovery according to the manufacturer's instructions. In an accident, call the emergency number 112 and tell the operator that an electric or hybrid vehicle is involved.\n  [Simplified: Use only an undamaged charging cable and a proper charging point. If an electric car breaks down, do not touch the orange cables. Call professional help. In an emergency, call 112 and say the car is electric or hybrid.]", "fi": "Sähkötaksin toimintamatka on suunniteltava koko työvuoron mitalle: kylmällä säällä akku luovuttaa vähemmän energiaa ja sisätilan lämmitys kuluttaa enemmän, joten talvitoimintamatka voi olla merkittävästi lyhyempi kuin kesällä. Ammattikuljettaja aloittaa vuoron riittävällä varauksella ja tuntee latauspisteet vakioreittiensä varrella. Lataus kannattaa ajoittaa luonnollisiin taukoihin — esimerkiksi ruokatauolle tai hiljaiseen hetkeen tolpalla — jolloin pikalataus ei syö ajotunteja.\n  [Simplified: Kylmä sää lyhentää sähköauton toimintamatkaa selvästi. Aloita vuoro täydellä tai lähes täydellä akulla. Opettele, missä latauspisteet ovat reittiesi varrella. Lataa taukojen aikana, älä kesken kyytien.]\n\nRegeneratiivinen jarrutus muuttaa auton liike-energiaa takaisin sähköksi: kun kuljettaja ennakoi liikennettä ja hellittää kaasua ajoissa, auto hidastaa moottorilla ja lataa samalla akkua. Tasainen nopeus, pehmeät kiihdytykset ja ennakoiva ajotapa pienentävät energiankulutusta kaikissa voimalinjoissa — myös bensiini- ja dieselautoissa. Tarpeeton tyhjäkäynti kuluttaa polttoainetta ja tuottaa päästöjä, ja sähköautossa jokainen ylimääräinen lämmitysminuutti paikallaan syö toimintamatkaa.\n  [Simplified: Sähköauto lataa akkua, kun hidastat moottorilla. Aja ennakoiden: hellitä kaasua ajoissa ja vältä äkkijarrutuksia. Tasainen ajo säästää energiaa kaikissa autoissa. Vältä turhaa tyhjäkäyntiä.]\n\nOn tammikuinen perjantai-ilta ja pakkasta 15 astetta. Sähkötaksin kuljettaja Ville näkee vuoron alussa mittarin lupaavan 280 kilometriä, mutta hän tietää kokemuksesta, että todellinen talvimatka jää selvästi lyhyemmäksi. Hän esilämmittää auton latausjohdon ollessa vielä kiinni, ajaa iltaruuhkan kyydit ja ajoittaa 20 minuutin pikalatauksen hiljaiseen hetkeen kello 21 — samalla hän ehtii pitää tauon. Vuoro jatkuu aamuyöhön ilman yhtäkään latauksen takia menetettyä kyytiä.\n\nYleisin virhe on luottaa kesällä opittuun toimintamatkaan myös talvella: pakkasella akusta saa selvästi vähemmän, ja kesken vuoron tyhjenevä akku tarkoittaa peruttuja kyytejä, hinausta ja menetettyjä ansioita.\n\nMuista kokeessa: kylmä sää lyhentää sähköauton toimintamatkaa selvästi, lataus ajoitetaan taukoihin, ja ennakoiva ajotapa regeneratiivista jarrutusta hyödyntäen säästää energiaa jokaisessa voimalinjassa.\n\nLatausturvallisuuden perusasiat: käytä vain ehjää latauskaapelia ja ajoneuvolle tarkoitettua latauspistettä, tarkista pistoke ja kaapeli vaurioiden varalta äläkä lataa jatkojohdon kautta, ellei valmistaja sitä nimenomaisesti salli. Rikkoutumistilanteet eroavat voimalinjoittain: sähkö- ja hybridiauton suurjännitejärjestelmän osiin, erityisesti oransseihin kaapeleihin, kuljettaja ei koskaan koske itse, vaan auton siirtää ammattilainen valmistajan ohjeiden mukaan. Onnettomuustilanteessa soita hätänumeroon 112 ja kerro, että kyseessä on sähkö- tai hybridiauto.\n  [Simplified: Käytä vain ehjää latauskaapelia ja kunnollista latauspistettä. Jos sähköauto rikkoutuu, älä koske oransseihin kaapeleihin. Kutsu ammattilainen paikalle. Hätätilanteessa soita 112 ja kerro, että auto on sähkö- tai hybridiauto.]"}, {"id": "M30", "slug": "occupational-health-fatigue-and-fitness-to-drive", "title": "Occupational Health Fatigue And Fitness To Drive", "en": "Fatigue impairs driving ability as seriously as intoxicants: reaction time slows, perception narrows and microsleeps strike without warning. Plan your shifts so that you get enough sleep before work, and remember that night work is especially hard on the body because it works against the natural circadian rhythm. Warning signs of fatigue include yawning, heavy eyelids, wandering thoughts and drifting in the lane — once you notice them, the only effective remedy is to stop and rest.\n  [Simplified: Driving tired is dangerous. Sleep enough before your shift. Night work makes you very tired. If you yawn or your eyes feel heavy, stop and rest.]\n\nA professional driver assesses their fitness to drive before every shift: alcohol, its after-effects (a hangover) and many medicines impair driving ability even when you feel normal. Check with your doctor or pharmacy whether your medication affects driving, and never start a shift if you are unsure of your condition. Take regular breaks during the shift — even a short break with light movement and some water restores alertness better than coffee alone.\n  [Simplified: Ask yourself before every shift: am I fit to drive? Alcohol, hangovers and many medicines make driving worse. Ask your doctor or pharmacy if your medicine is safe for driving. Take breaks during your shift.]\n\nTaxi work strains both body and mind: adjust your seat and mirrors properly, lift luggage with your legs and a straight back, and stretch your legs between customers, because long periods of sitting make you stiff and tired. Prolonged stress weakens sleep and concentration, so release the pressure through exercise, rest and talking about it — never by racing in traffic. Be prepared for the risk of violence as well: stay calm, do not let yourself be provoked, keep your distance from a threatening customer and call 112 for help when needed — your own safety always comes before money.\n  [Simplified: Adjust your seat well. Lift bags with your legs, not your back. Walk a little during breaks. If a customer threatens you, stay calm and do not
