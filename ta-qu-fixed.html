argue. In an emergency, call 112. Your safety matters more than money.]\n\nIt is 3.40 a.m. and you have been driving a night shift for eight hours. During an airport ride you notice you are yawning constantly, and at one point you jolt awake — you cannot remember the last hundred metres. You pull in at the next service station, tell the dispatch centre you are taking a break, walk outside for a few minutes and drink some water. You honestly assess your alertness and decide to end the shift an hour earlier than planned — that is the professional decision.\n\nThe most common mistake is downplaying fatigue: the driver opens a window, turns up the music and keeps driving, even though a microsleep can lead to running off the road or a collision within seconds. Fatigue is not beaten with willpower — only with sleep and rest.\n\nAssessing your fitness to drive is a professional driver's everyday task: sufficient sleep, regular breaks, staying free of intoxicants and knowing how your medicines affect you protect both you and your passengers. Check the current requirements from official sources when needed.", "fi": "Väsymys heikentää ajokykyä yhtä vakavasti kuin päihteet: reaktioaika pitenee, havainnointi kaventuu ja mikrounet iskevät varoittamatta. Suunnittele vuorosi niin, että ehdit nukkua riittävästi ennen työvuoroa, ja muista, että yötyö kuormittaa elimistöä erityisen paljon, koska se sotii kehon luonnollista vuorokausirytmiä vastaan. Väsymyksen varoitusmerkkejä ovat haukottelu, raskaat silmäluomet, ajatusten harhailu ja kaistalla vaeltelu – kun huomaat ne, ainoa tehokas keino on pysähtyä ja levätä.\n  [Simplified: Väsyneenä ajat huonosti. Nuku tarpeeksi ennen työvuoroa. Yötyö väsyttää erityisen paljon. Jos haukottelet tai silmäsi painuvat kiinni, pysähdy ja lepää.]\n\nAmmattikuljettaja arvioi ajokuntonsa ennen jokaista vuoroa: alkoholi, sen jälkitila eli krapula sekä monet lääkkeet heikentävät ajokykyä, vaikka olo tuntuisi normaalilta. Selvitä lääkäriltä tai apteekista, vaikuttaako lääkityksesi ajamiseen, äläkä koskaan lähde ajoon epävarmana kunnostasi. Pidä vuoron aikana säännöllisiä taukoja – lyhytkin tauko, kevyt jaloittelu ja vesi palauttavat vireystilaa paremmin kuin pelkkä kahvi.\n  [Simplified: Mieti ennen jokaista vuoroa: olenko ajokunnossa? Alkoholi, krapula ja monet lääkkeet heikentävät ajamista. Kysy lääkäriltä tai apteekista, sopiiko lääkkeesi ajamiseen. Pidä taukoja vuoron aikana.]\n\nTaksityö kuormittaa sekä kehoa että mieltä: säädä istuin ja peilit oikein, nosta matkalaukut jalkojen voimalla selkä suorana ja jaloittele asiakkaiden välillä, sillä pitkä istuminen jäykistää ja väsyttää. Pitkittynyt stressi heikentää unta ja keskittymistä, joten pura kuormitusta liikunnalla, levolla ja puhumalla – ei kaahaamalla liikenteessä. Varaudu myös väkivallan riskiin: pysy rauhallisena, älä provosoidu, pidä etäisyyttä uhkaavaan asiakkaaseen ja hälytä tarvittaessa apua numerosta 112 – oma turvallisuutesi menee aina rahan edelle.\n  [Simplified: Säädä istuin hyvin. Nosta laukut jaloilla, ei selällä. Kävele vähän taukojen aikana. Jos asiakas uhkailee, pysy rauhallisena äläkä väittele. Hätätilanteessa soita 112. Sinun turvallisuutesi on tärkeämpi kuin raha.]\n\nKello on 03.40, ja olet ajanut yövuoroa kahdeksan tuntia. Lentokenttäkeikan aikana huomaat haukottelevasi jatkuvasti, ja yhdessä vaiheessa säpsähdät hereille – et muista edellistä sataa metriä. Ajat seuraavalle huoltoasemalle, ilmoitat välityskeskukselle pitäväsi tauon, kävelet ulkona muutaman minuutin ja juot vettä. Arvioit rehellisesti vireystilasi ja päätät lopettaa vuoron tuntia aiottua aiemmin – se on ammattilaisen ratkaisu.\n\nYleisin virhe on väsymyksen vähättely: kuljettaja avaa ikkunan, lisää musiikkia ja jatkaa ajamista, vaikka mikrouni voi johtaa ulosajoon tai törmäykseen sekunneissa. Väsymystä ei voiteta tahdonvoimalla, vaan ainoastaan unella ja levolla.\n\nAjokunnon arviointi on ammattikuljettajan jokapäiväinen tehtävä: riittävä uni, säännölliset tauot, päihteettömyys ja lääkkeiden vaikutusten tunteminen suojaavat sekä sinua että matkustajiasi. Tarkista ajantasaiset vaatimukset tarvittaessa virallisista lähteistä."}, {"id": "M30", "slug": "working-time-limits-for-employed-drivers", "title": "Working Time Limits For Employed Drivers", "en": "For an employed motor-vehicle driver whose work falls within the Working Hours Act, daily working time is limited to 11 hours during the 24 hours following daily rest. If the work cannot otherwise be arranged appropriately, it may be extended to no more than 13 hours, provided working time does not exceed 22 hours during the defined 48-hour follow-up period after daily rest. Including overtime, working time may average no more than 48 hours per week over four months.\n  [Simplified: An employed driver's daily working time is normally limited to 11 hours. It may reach 13 hours only under specific conditions. Over four months, working time may average no more than 48 hours per week.]\n\nDo not confuse working time with driving time. The 9 and 10-hour driving-time rule for heavy transport is not the general working-time limit for taxi drivers. An applicable collective agreement may affect the arrangements, and self-employed operators must assess their position separately.\n\nWorking Hours Act 872/2019: section 9 on a motor-vehicle driver's daily working time and section 18 on the maximum number of working hours.", "fi": "Työaikalain soveltamisalaan kuuluvan työsuhteisen moottoriajoneuvon kuljettajan vuorokautinen työaika saa olla enintään 11 tuntia vuorokausilepoa seuraavan 24 tunnin aikana. Jos työtä ei voida järjestää tarkoituksenmukaisesti muuten, työaika voidaan pidentää enintään 13 tuntiin, kunhan työaika ei ylitä 22 tuntia pidennetyn työajan jälkeistä vuorokausilepoa seuraavan 48 tunnin aikana. Työaika ylityöt mukaan lukien saa olla keskimäärin enintään 48 tuntia viikossa neljän kuukauden ajanjaksolla.\n  [Simplified: Työsuhteisen kuljettajan työaika on tavallisesti enintään 11 tuntia vuorokaudessa. Erityisehdoilla raja voi olla 13 tuntia. Neljän kuukauden aikana työaika saa olla keskimäärin enintään 48 tuntia viikossa.]\n\nÄlä sekoita työaikaa ja ajoaikaa. Raskaan liikenteen 9 ja 10 tunnin ajoaikasääntö ei ole taksinkuljettajan yleinen työaikaraja. Sovellettava työehtosopimus voi vaikuttaa järjestelyihin, ja yrittäjän asema on arvioitava erikseen.\n\nTyöaikalaki 872/2019: 9 § moottoriajoneuvon kuljettajan vuorokautisesta työajasta ja 18 § työtuntien enimmäismäärästä."}, {"id": "M30", "slug": "alcohol-limits-and-fitness-to-drive", "title": "Alcohol Limits And Fitness To Drive", "en": "In Finland, the drink-driving threshold for anyone driving a motor vehicle is at least 0.5‰ alcohol in the blood or at least 0.22 milligrams of alcohol per litre of exhaled air. The same Criminal Code threshold applies to taxi drivers and other motor-vehicle drivers. It is a minimum criminal-law threshold, not a target level for safe professional driving.\n  [Simplified: The drink-driving threshold is 0.5‰ in blood or 0.22 mg/l in exhaled air. It is the same for taxi drivers and other motorists. A safe taxi driver starts work sober.]\n\nA result below the threshold does not automatically mean that driving may continue. A person must not drive when intoxication removes the abilities needed to drive. If alcohol is detected and intoxication clearly affects driving ability, a police officer, Border Guard officer or Customs officer may prohibit and, if necessary, prevent driving even though the drink-driving threshold has not been reached.\n\nA driver's measured result is below 0.5‰, but they are unsteady, react slowly and cannot concentrate. They are not fit to drive and must not begin or continue the shift. A professional driver's decision is based on safe fitness to drive, not on how close the result is to the criminal-law threshold.\n\nThe alcohol interlock blocking threshold and the criminal drink-driving threshold are different. The interlock prevents the vehicle from starting or moving at a breath-alcohol concentration of at least 0.10 mg/l. The general criminal drink-driving threshold is 0.22 mg/l. An interlock is mandatory in the school and day-care transports covered by section 10 of the Alcohol Interlock Act, not automatically in every taxi journey involving a minor.\n\nCriminal Code 39/1889, chapter 23, sections 3–4: drink-driving and aggravated drink-driving. Road Traffic Act 729/2018, section 17: general driver requirements, and section 183: preventing driving due to intoxication. Alcohol Interlock Act 730/2016, sections 9–10: the blocking threshold and interlock use in school and day-care transport.", "fi": "Suomessa rattijuopumuksen raja moottorikäyttöisen ajoneuvon kuljettajalle on vähintään 0,5 promillea alkoholia veressä tai vähintään 0,22 milligrammaa alkoholia litrassa uloshengitysilmaa. Sama rikoslain raja koskee taksinkuljettajaa ja muita moottoriajoneuvon kuljettajia. Tämä on rikosoikeudellinen vähimmäisraja, ei tavoitetaso turvalliselle ammattiajolle.\n  [Simplified: Rattijuopumuksen raja on 0,5 promillea veressä tai 0,22 mg/l uloshengitysilmassa. Raja on sama taksinkuljettajalle ja muille autoilijoille. Turvallinen taksinkuljettaja lähtee työhön selvin päin.]\n\nRajan alittava tulos ei tarkoita automaattisesti, että ajamista saa jatkaa. Ajoneuvoa ei saa ajaa, jos päihtymys heikentää ajamiseen tarvittavia edellytyksiä. Kun alkoholia havaitaan ja päihtymys vaikuttaa selvästi ajokykyyn, poliisi, rajavartiomies tai tullimies voi kieltää ja tarvittaessa estää ajamisen, vaikka rattijuopumuksen raja ei ylity.\n\nKuljettajan mittaustulos jää alle 0,5 promillen, mutta hän horjuu, reagoi hitaasti eikä pysty keskittymään. Hän ei ole ajokunnossa eikä saa aloittaa tai jatkaa työvuoroa. Ammattikuljettajan ratkaisu perustuu turvalliseen ajokuntoon, ei siihen, kuinka lähellä rikosoikeudellista rajaa mittaustulos on.\n\nAlkolukon estoraja ja rattijuopumuksen rikosraja ovat eri asioita. Alkolukko estää ajoneuvon käynnistymisen tai liikkumisen, kun uloshengitysilman alkoholipitoisuus on vähintään 0,10 mg/l. Yleinen rattijuopumuksen rikosraja on 0,22 mg/l. Alkolukko on pakollinen alkolukkolain 10 §:ssä tarkoitetuissa koulu- ja päivähoitokuljetuksissa, ei automaattisesti kaikissa alaikäisten taksimatkoissa.\n\nRikoslaki 39/1889, 23 luku 3–4 §: rattijuopumus ja törkeä rattijuopumus. Tieliikennelaki 729/2018, 17 §: kuljettajan yleiset vaatimukset ja 183 §: ajon estäminen päihtymyksen vuoksi. Alkolukkolaki 730/2016, 9–10 §: käynnistyksen estoraja sekä alkolukon käyttö koulu- ja päivähoitokuljetuksissa."}, {"id": "M31", "slug": "customer-data-privacy-and-in-car-recording", "title": "Customer Data Privacy And In Car Recording", "en": "As a taxi driver you handle customers' personal data every day: names, addresses, phone numbers and trip details. The basic rule is data minimisation – collect and keep only what is needed to carry out the journey, and only for as long as it is needed. EU data protection rules (GDPR) guide how personal data is handled, and a professional driver always follows their company's data protection instructions. If you are unsure whether a piece of information may be stored or shared, ask first – never guess.\n  [Simplified: At work you learn customers' names, addresses and phone numbers. Collect only the information the trip needs. Do not keep data you no longer need. If you are not sure, ask your company first.]\n\nA customer's journey history is confidential information: who travelled, from where, to where and when. A professional driver does not share this with outsiders – not with family, friends or other customers – even if the passenger was a public figure. Remember the dispatch screen too: it can show other customers' names and addresses, so position the device so passengers cannot see it, and never show the screen to anyone else.\n  [Simplified: Customers' journeys are private. Do not tell anyone who you drove or where. The dispatch screen can show other customers' details. Turn the screen so passengers cannot see it.]\n\nNever photograph or film a customer – not even to capture a \"funny moment\". A photo or video of a customer is personal data, and taking it without permission violates the customer's privacy and trust. Using a dashcam involves data protection obligations: follow your company's policy on camera use and the handling of recordings, and check the current requirements from official sources such as the guidance of the Office of the Data Protection Ombudsman.\n  [Simplified: Never take photos or videos of customers. It violates their privacy. If the car has a dashcam, follow your company's rules. Check the current rules in the Data Protection Ombudsman's guidance.]\n\nDuring a break, a driver notices that the work phone is missing – it holds the dispatch app and customers' contact details. Instead of waiting, the driver immediately reports the loss to the company and the dispatch centre so the device can be locked and the app's access revoked. The company then assesses whether the situation requires further steps under data protection rules. Fast reporting is what matters most here: the sooner the information moves, the smaller the damage.\n\nThe most common mistake is passing on details of customers' rides – for example posting on social media who you drove and where. Even one such disclosure can be a privacy breach, and it erodes the trust that customers and your company place in you.\n\nRemember three rules for the exam and for work: collect only the data you need, keep customers' journeys and details confidential, and report a lost device or suspected data breach to your company immediately.", "fi": "Taksinkuljettaja käsittelee työssään asiakkaiden henkilötietoja joka päivä: nimiä, osoitteita, puhelinnumeroita ja matkatietoja. Hyvä perussääntö on tietojen minimointi – kerää ja säilytä vain se, mitä matkan hoitaminen edellyttää, ja vain niin kauan kuin sitä tarvitaan. EU:n tietosuojasääntely (GDPR) ohjaa henkilötietojen käsittelyä, ja ammattikuljettaja noudattaa aina yrityksensä tietosuojaohjeita. Jos et ole varma, saako jonkin tiedon tallentaa tai jakaa, kysy ensin – älä arvaa.\n  [Simplified: Saat työssä tietää asiakkaiden nimiä, osoitteita ja puhelinnumeroita. Kerää vain ne tiedot, joita matka vaatii. Älä säilytä tietoja turhaan. Jos et tiedä, saako tiedon tallentaa, kysy ensin yritykseltäsi.]\n\nAsiakkaan matkahistoria on luottamuksellista tietoa: kuka matkusti, mistä, minne ja milloin. Ammattikuljettaja ei kerro näitä tietoja ulkopuolisille – ei perheelle, kavereille eikä toisille asiakkaille – vaikka kyydissä olisi ollut julkisuuden henkilö. Muista myös ajovälitysjärjestelmän näyttö: siinä voi näkyä muiden asiakkaiden nimiä ja osoitteita, joten aseta laite niin, ettei matkustaja näe sitä, äläkä koskaan esittele näyttöä muille.\n  [Simplified: Asiakkaan matkat ovat salaisia. Älä kerro kenellekään, ketä kuljetit tai minne. Ajovälityksen näytössä voi näkyä muiden asiakkaiden tietoja. Käännä näyttö niin, ettei matkustaja näe sitä.]\n\nÄlä koskaan valokuvaa tai videoi asiakasta – et edes \"hauskaa tilannetta\" varten. Kuva tai video asiakkaasta on henkilötieto, ja sen ottaminen ilman lupaa loukkaa asiakkaan yksityisyyttä ja luottamusta. Autokameran (dashcam) käyttöön liittyy tietosuojavelvoitteita: noudata yrityksesi ohjeistusta kameran käytöstä ja tallenteiden käsittelystä, ja tarkista ajantasaiset vaatimukset virallisista lähteistä, kuten tietosuojavaltuutetun toimiston ohjeista.\n  [Simplified: Älä koskaan kuvaa asiakkaita. Kuvaaminen loukkaa asiakkaan yksityisyyttä. Jos autossa on kamera, noudata yrityksesi ohjeita. Tarkista säännöt tietosuojavaltuutetun toimiston ohjeista.]\n\nKuljettaja huomaa tauolla, että työpuhelin on kadonnut – siinä on ajovälityssovellus ja asiakkaiden yhteystietoja. Hän ei jää odottamaan, vaan ilmoittaa katoamisesta heti yritykselleen ja ajovälitykseen, jotta laite voidaan lukita ja sovelluksen käyttöoikeudet sulkea. Yritys arvioi sen jälkeen, edellyttääkö tilanne lisätoimia tietosuojasääntöjen mukaan. Nopea ilmoitus on tässä tärkeintä: mitä aiemmin tieto kulkee, sitä pienemmäksi vahinko jää.\n\nYleisin virhe on kertoa asiakkaiden kyydeistä eteenpäin – esimerkiksi julkaista sosiaalisessa mediassa, kenet kuljetti ja minne. Yksikin tällainen paljastus voi olla tietosuojaloukkaus, ja se murentaa asiakkaiden ja yrityksen luottamuksen kuljettajaan.\n\nMuista kokeessa ja työssä kolme sääntöä: kerää vain tarpeelliset tiedot, pidä asiakkaiden matkat ja tiedot salassa, ja ilmoita kadonneesta laitteesta tai epäillystä tietovuodosta heti yrityksellesi."}, {"id": "M32", "slug": "taxi-entrepreneurship-introduction", "title": "Taxi Entrepreneurship Introduction", "en": "In Finland, professional taxi operations involve two separate authorisations: the taxi driver's licence is a personal permit that entitles you to drive a taxi, while the taxi transport licence is granted to a company or entrepreneur and entitles them to operate a taxi business. A driver's licence alone does not make you a transport operator — you can drive for someone else's company, but running your own business requires your own transport licence. Setting up a business also involves choosing a company form, completing the necessary registrations and planning your finances; always check the current licence requirements from official sources.\n  [Simplified: There are two permits in the taxi business. The driver's licence is your personal permit to drive a taxi. The transport licence is the company's permit to run a taxi service. If you want your own taxi business, you need a transport licence. Always check the current requirements from official sources.]\n\nAs an entrepreneur you are responsible for your company's finances: business income is subject to taxation, and a careful entrepreneur sets up proper bookkeeping from day one, often with the help of an accounting firm. Insurance is also the entrepreneur's own responsibility — the insurance of a vehicle in professional use and the entrepreneur's own cover should be sorted out before starting operations. Check current tax and insurance matters with the Finnish Tax Administration, insurance companies and other official sources.\n  [Simplified: An entrepreneur takes care of the money, taxes and bookkeeping. Many entrepreneurs use an accounting firm to help. The entrepreneur also arranges insurance for the car and for themselves. Ask the Tax Administration and an insurance company for up-to-date information.]\n\nTaxi pricing in Finland is largely up to the operator, but a professional always tells the customer the price, or how it is determined, clearly before the journey — open price information is both good service and a core rule of the trade. If you drive through a dispatch company or an app platform, the platform usually charges a commission on every ride, which must be factored into your profitability calculations. As an employee you get a steady wage and an employer who handles a large share of the obligations; as an entrepreneur you get freedom and the chance of higher income — but you also carry all the risks and responsibilities.\n  [Simplified: A taxi entrepreneur can mostly set their own prices. Tell the customer the price clearly before the trip. App platforms take a share of every ride. As an employee you get a wage and the employer handles many things. As an entrepreneur you decide yourself, but you also carry the risks.]\n\nSara has driven a taxi as an employee for two years and is considering starting her own business. Before deciding, she finds out from official sources what applying for a taxi transport licence involves, discusses taxation and bookkeeping with an accounting firm, and calculates how large a share of each ride's price goes to the platform commission, insurance and vehicle costs. Only when the calculation shows the business would be profitable does she make her decision. This is how a careful future entrepreneur acts.\n\nA common mistake is to assume that the taxi driver's licence alone is enough to run your own taxi business — the driver's licence only entitles you to drive a taxi, not to operate a transport business. Operating without the proper transport licence can lead to serious consequences and the collapse of the entire business.\n\nRemember for the exam: the driver's licence is the driver's personal permit, while the transport licence is the company's permit to operate taxi services. An entrepreneur is personally responsible for taxes, bookkeeping, insurance and clear price information — always check the current requirements from official sources.", "fi": "Suomessa ammattimaiseen taksitoimintaan liittyy kaksi eri lupaa: taksinkuljettajan ajolupa on henkilökohtainen lupa, joka oikeuttaa kuljettamaan taksia, kun taas taksiliikennelupa myönnetään yritykselle tai yrittäjälle ja oikeuttaa harjoittamaan taksiliikennettä. Pelkkä ajolupa ei siis tee sinusta liikenteenharjoittajaa — voit ajaa toisen yrityksen taksia, mutta oman yrityksen pyörittäminen edellyttää omaa liikennelupaa. Yrityksen perustamiseen kuuluu myös yritysmuodon valinta, tarvittavat rekisteröinnit ja rahoituksen suunnittelu; ajantasaiset lupavaatimukset kannattaa aina tarkistaa viranomaisten virallisista lähteistä.\n  [Simplified: Taksialalla on kaksi lupaa. Ajolupa on sinun oma lupasi ajaa taksia. Liikennelupa on yrityksen lupa harjoittaa taksiliikennettä. Jos haluat oman taksiyrityksen, tarvitset liikenneluvan. Tarkista ajantasaiset vaatimukset aina virallisista lähteistä.]\n\nYrittäjänä vastaat itse yrityksesi taloudesta: yritystoiminnan tuloihin liittyy verotus, ja huolellinen yrittäjä järjestää kirjanpidon kuntoon heti alusta alkaen, usein tilitoimiston avulla. Myös vakuutukset ovat yrittäjän omalla vastuulla — ammattikäytössä olevan auton vakuutukset sekä yrittäjän oma turva kannattaa selvittää ennen toiminnan aloittamista. Ajantasaiset vero- ja vakuutusasiat kannattaa varmistaa Verohallinnosta, vakuutusyhtiöistä ja muista virallisista lähteistä.\n  [Simplified: Yrittäjä hoitaa itse rahat, verot ja kirjanpidon. Moni yrittäjä ottaa avuksi tilitoimiston. Yrittäjä hankkii myös itse vakuutukset autolle ja itselleen. Kysy ajantasaiset tiedot Verohallinnosta ja vakuutusyhtiöstä.]\n\nTaksimatkojen hinnoittelu on Suomessa pitkälti vapaata, mutta ammattilainen kertoo aina hinnan tai sen määräytymisperusteet asiakkaalle selkeästi ennen matkaa — avoin hintatieto on sekä hyvää palvelua että alan keskeinen pelisääntö. Jos ajat välitysyhtiön tai sovellusalustan kautta, alusta perii yleensä välityspalkkion jokaisesta kyydistä, mikä on huomioitava kannattavuuslaskelmissa. Työsuhteessa saat vakaan palkan ja työnantaja hoitaa suuren osan velvoitteista, yrittäjänä taas saat vapauden ja mahdollisuuden parempaan tuloon — mutta kannat myös kaikki riskit ja vastuut.\n  [Simplified: Taksiyrittäjä saa pääosin itse päättää hintansa. Kerro hinta asiakkaalle selkeästi ennen matkaa. Sovellusalustat ottavat osan jokaisen kyydin hinnasta. Työntekijänä saat palkkaa ja työnantaja hoitaa monta asiaa. Yrittäjänä päätät itse, mutta kannat myös riskit.]\n\nSara on ajanut kaksi vuotta taksia työsuhteessa ja harkitsee oman yrityksen perustamista. Ennen päätöstä hän selvittää virallisista lähteistä, mitä taksiliikenneluvan hakeminen edellyttää, keskustelee tilitoimiston kanssa verotuksesta ja kirjanpidosta sekä laskee, kuinka suuren osan alustan välityspalkkio, vakuutukset ja auton kulut vievät jokaisen kyydin hinnasta. Vasta kun laskelma näyttää toiminnan kannattavalta, hän tekee päätöksensä. Näin toimii huolellinen tuleva yrittäjä.\n\nYleinen virhe on luulla, että taksinkuljettajan ajolupa yksin riittää oman taksiyrityksen pyörittämiseen — ajolupa oikeuttaa vain kuljettamaan taksia, ei harjoittamaan liikennettä. Ilman asianmukaista liikennelupaa toimiminen voi johtaa vakaviin seuraamuksiin ja koko yritystoiminnan kaatumiseen.\n\nMuista tenttiin: ajolupa on kuljettajan henkilökohtainen lupa, liikennelupa on yrityksen lupa harjoittaa taksiliikennettä. Yrittäjä vastaa itse veroista, kirjanpidosta, vakuutuksista ja selkeästä hintatiedosta — tarkista ajantasaiset vaatimukset aina virallisista lähteistä."}, {"id": "M33", "slug": "lost-property-check-return-log", "title": "Lost Property — Check, Return, Log", "en": "A professional driver checks the vehicle after every journey: the back seat, footwells, door pockets and the boot. Do this before picking up the next customer — items are far easier to return when you catch them quickly.\n\nWhen you find something, note the time, pick-up location, drop-off location, and a brief description of the item. Follow your employer's or dispatch company's instructions for recording and returning found items.\n\nReturn lost property to the customer as quickly as possible. If the customer cannot be reached, deliver the item to the police lost-property office. Never leave items unattended in a visible spot in the car, and never go through the contents of a found phone, wallet or bag.\n\nIf a customer calls right after a ride to report forgotten medication or other urgent items, treat it as a priority — medication can be critical to someone's health.\n  [Simplified: Check the car after every ride. Note what you found and where. Return it quickly. Report it to your employer or the police.]", "fi": "Ammattitaitoinen kuljettaja tarkistaa ajoneuvon jokaisen kyydin jälkeen: takapenkki, jalkatila, ovitaskut ja tavaratila. Tee tämä ennen seuraavan asiakkaan hakemista — tavarat on paljon helpompi palauttaa, kun huomaat ne nopeasti.\n\nKun löydät jotain, kirjaa ylös kellonaika, noutopaikan ja jättöpaikan tiedot sekä lyhyt kuvaus tavarasta. Noudata työnantajan tai välitysyhtiön ohjeita löytötavaroiden kirjaamisessa ja palauttamisessa.\n\nPalauta löytötavara asiakkaalle mahdollisimman nopeasti. Jos asiakkaaseen ei saa yhteyttä, toimita tavara poliisin löytötavaratoimistoon. Älä jätä tavaroita näkyville paikkaan autossa, äläkä koskaan selaa löytyneen puhelimen, lompakon tai laukun sisältöä.\n\nJos asiakas soittaa heti kyydin jälkeen unohtuneiden lääkkeiden tai muun kiireellisen tavaran perään, hoida palautus ensisijaisesti — lääkkeet voivat olla jonkun terveydelle välttämättömiä.\n  [Simplified: Tarkista auto jokaisen kyydin jälkeen. Kirjaa löytö ylös. Palauta nopeasti. Ilmoita työnantajalle tai poliisille.]"}, {"id": "M34", "slug": "notice-period-employment", "title": "Notice Periods in Employment", "en": "In Finland, the notice period for a taxi driver employed under the Employment Contracts Act depends on how long the employment has lasted.\n\nEmployee's notice period (when the employee resigns):\n- Employment under 1 year: 14 days\n- Employment over 1 year, under 5 years: 1 month\n- Employment over 5 years, under 10 years: 2 months\n- Employment over 10 years: 3 months\n\nEmployer's notice period (when the employer dismisses) is generally longer and depends on the length of service. Always check the applicable collective agreement, as it may set different terms.\n\nThe notice period starts from the day the notice is given, not from the end of the month. During the notice period, the employee continues to work and receive normal pay.\n  [Simplified: If you resign after working 1–5 years, your notice period is 1 month. Under 1 year: 14 days. Over 5 years: 2 months.]", "fi": "Suomessa taksinkuljettajan irtisanomisaika työsopimuksen perusteella riippuu työsuhteen kestosta.\n\nTyöntekijän irtisanomisaika (kun työntekijä irtisanoutuu):\n- Alle 1 vuoden työsuhde: 14 päivää\n- Yli 1 vuosi, alle 5 vuotta: 1 kuukausi\n- Yli 5 vuotta, alle 10 vuotta: 2 kuukautta\n- Yli 10 vuotta: 3 kuukautta\n\nTyönantajan irtisanomisaika (kun työnantaja irtisanoo) on yleensä pidempi ja riippuu palvelussuhteen pituudesta. Tarkista aina sovellettava työehtosopimus, sillä se voi asettaa erilaisia ehtoja.\n\nIrtisanomisaika alkaa irtisanomispäivästä, ei kuukauden lopusta. Irtisanomisaikana työntekijä jatkaa työskentelyä ja saa normaalia palkkaa.\n  [Simplified: Jos irtisanoudut 1–5 vuoden työsuhteen jälkeen, irtisanomisaika on 1 kuukausi. Alle 1 vuosi: 14 päivää. Yli 5 vuotta: 2 kuukautta.]"}, {"id": "M35", "slug": "driver-logbook", "title": "Driver's Logbook", "en": "Every employed taxi driver is required to keep a driving log (ajopäiväkirja). The logbook records the start of the shift and break times taken during the working day.\n\nThe logbook is a legal document. Accurate record-keeping ensures compliance with working time legislation and helps resolve any disputes about hours worked. Your employer may use the logbook as part of payroll and working time monitoring.\n\nWhat is recorded in the logbook:\n- Start of shift (time and date)\n- Break times and their duration\n- End of shift\n\nWhat is NOT recorded: food consumed, personal notes, or opinions about events during the shift.\n  [Simplified: The logbook records when your shift starts and when you take breaks. It is a legal document — keep it accurate.]", "fi": "Jokaisen työsuhteessa olevan taksinkuljettajan on pidettävä ajopäiväkirjaa. Ajopäiväkirjaan merkitään työvuoron aloitusaika sekä työpäivän aikana pidettyjen taukojen ajankohdat.\n\nAjopäiväkirja on juridinen asiakirja. Tarkka kirjanpito varmistaa työaikalain noudattamisen ja auttaa ratkaisemaan mahdolliset riidat työtunneista. Työnantaja voi käyttää ajopäiväkirjaa osana palkanmaksua ja työaikavalvontaa.\n\nMitä ajopäiväkirjaan merkitään:\n- Työvuoron aloitus (kellonaika ja päivämäärä)\n- Taukojen ajankohdat ja kestot\n- Työvuoron lopetus\n\nMitä EI merkitä: nautittua ravintoa, henkilökohtaisia muistiinpanoja tai mielipiteitä vuoron tapahtumista.\n  [Simplified: Ajopäiväkirjaan merkitään työvuoron aloitus ja taukojen ajankohdat. Se on juridinen asiakirja — pidä se tarkkana.]"}, {"id": "M36", "slug": "cognitive-memory-disorders", "title": "Supporting Passengers with Cognitive Disabilities and Dementia", "en": "Not all disabilities are visible. Conditions such as dementia, intellectual disabilities, autism spectrum traits, and anxiety can all affect how a passenger communicates and experiences the journey. A professional driver recognises these needs and adapts without making the passenger feel singled out.\n\nFor a passenger with dementia or memory disorder:\n- Speak in short, calm, clear sentences — one instruction at a time.\n- Do not argue if they become confused about the route or destination; instead, calmly reassure them that you are taking them safely where they need to go.\n- If they cannot remember their destination, try to reach the booking guardian or care contact. Do not leave a confused passenger alone.\n- On arrival at a care facility, ensure a proper handover to staff or an agreed relative — never leave a memory-impaired passenger unattended.\n\nFor a passenger who needs extra time or simple instructions: give it without hesitation. Many cognitive challenges are invisible. Never require proof of disability before offering patience.\n  [Simplified: Speak clearly and slowly. If a passenger with dementia gets confused, stay calm and reassure them. Always ensure a safe handover at the destination.]", "fi": "Kaikki vammat eivät ole näkyviä. Muistisairaus, kehitysvamma, autismikirjon piirteet ja ahdistuneisuus voivat kaikki vaikuttaa siihen, miten matkustaja kommunikoi ja kokee kyydin. Ammattitaitoinen kuljettaja tunnistaa nämä tarpeet ja mukauttaa toimintaansa ilman, että matkustaja tuntee itsensä erikoiskohdeluksi.\n\nMuistisairaan tai muistihäiriöisen matkustajan kanssa:\n- Puhu lyhyillä, rauhallisilla ja selkeillä lauseilla — yksi ohje kerrallaan.\n- Älä väittele vastaan, jos hän hämmentyy reitin tai määränpään suhteen; sen sijaan rauhoita hänet rauhallisesti vakuuttamalla, että viet hänet turvallisesti perille.\n- Jos hän ei muista määränpäätä, yritä tavoittaa tilaava huoltaja tai hoitokontakti. Älä jätä sekavaa matkustajaa yksin.\n- Saavuttuasi hoitolaitokseen varmista asianmukainen luovutus henkilökunnalle tai sovitulle omaiselle — älä koskaan jätä muistihäiriöistä matkustajaa ilman valvontaa.\n\nMatkustajalle, joka tarvitsee lisäaikaa tai yksinkertaisia ohjeita: anna se epäröimättä. Monet kognitiiviset haasteet ovat näkymättömiä. Älä koskaan vaadi vamman todistamista ennen kuin tarjoat kärsivällisyyttäsi.\n  [Simplified: Puhu selkeästi ja hitaasti. Jos muistisairas hämmentyy, pysy rauhallisena ja rauhoita hänet. Varmista aina turvallinen luovutus määränpäässä.]"}, {"id": "M37", "slug": "cleaning-surcharge", "title": "Cleaning Surcharge", "en": "If a customer soils the taxi — for example by vomiting or leaving significant mess — the driver is entitled to charge a cleaning surcharge. The standard cleaning surcharge in Finland is 450 €.\n\nThe surcharge exists because soiling a vehicle may put the taxi out of service while it is cleaned, causing direct loss of earnings for the driver or entrepreneur. The charge covers both the cleaning cost and lost income during that time.\n\nThe cleaning surcharge is applied only when the vehicle is actually soiled in a way that requires special cleaning beyond normal tidying. It is not a penalty but a practical compensation. Document the damage (photograph if possible) before charging the surcharge.\n  [Simplified: If a customer makes a serious mess in the taxi, you can charge a 450 € cleaning fee. Document the damage before charging.]", "fi": "Jos asiakas sotaa taksin — esimerkiksi oksentamalla tai jättämällä merkittävää epäsiisteyttä — kuljettajalla on oikeus periä siivouslisämaksu. Suomessa vakiosiivouslisämaksu on 450 €.\n\nLisämaksu on olemassa siksi, että ajoneuvo voi olla epäkunnossa siivouksen ajan, mikä aiheuttaa suoraa ansionmenetystä kuljettajalle tai yrittäjälle. Maksu kattaa sekä siivouskustannukset että siivouksen aikaisen menetetyn ansion.\n\nSiivouslisämaksu peritään vain silloin, kun ajoneuvo on todella sotattu tavalla, joka edellyttää erityissiivousta tavanomaisen siistimisen lisäksi. Se ei ole rangaistus vaan käytännöllinen korvaus. Dokumentoi vahinko (valokuvaa mahdollisuuksien mukaan) ennen lisämaksun perimistä.\n  [Simplified: Jos asiakas sotaa taksin vakavasti, voit periä 450 € siivousmaksun. Dokumentoi vahinko ennen maksun perimistä.]"}, {"id": "M38", "slug": "disability-services-transport", "title": "Disability Services Transport (Vammaispalvelulain mukainen kuljetus)", "en": "In Finland, municipalities and wellbeing-services counties arrange disability-service transport (vammaispalvelulain mukainen kuljetus) for persons with severe disabilities who cannot use public transport due to their disability.\n\nThis transport is separate from Kela-reimbursed taxi transport. It is granted by a specific administrative decision from the local wellbeing-services county, not automatically. The customer must apply for it.\n\nKey points for drivers:\n- Transport covers trips related to work, study, errands, recreation and social participation.\n- The customer typically pays only the equivalent of a local public transport fare; the rest is covered by the municipality.\n- Always check the current contract and instructions for your area — billing, assistance requirements and procedures vary by municipality and contract.\n- A customer with a disability-services transport decision may also have the right to a companion travelling free of charge — check the decision.\n  [Simplified: Disability-services transport is a local authority grant for people with severe disabilities. The customer pays only a small fare. Check local instructions for how to handle billing and assistance.]", "fi": "Suomessa kunnat ja hyvinvointialueet järjestävät vammaispalvelulain mukaisia kuljetuksia vaikeavammaisille henkilöille, jotka eivät vammansa vuoksi pysty käyttämään joukkoliikennettä.\n\nTämä kuljetus on erillinen Kelan korvaamasta taksimatkasta. Se myönnetään hyvinvointialueen erillisellä hallintopäätöksellä, ei automaattisesti. Asiakkaan on haettava sitä.\n\nTärkeää kuljettajille:\n- Kuljetus kattaa työ-, opiskelu-, asiointi-, virkistys- ja yhteiskuntaosallistumismatkat.\n- Asiakas maksaa yleensä vain paikallisen joukkoliikennelipun hinnan vastaavan omavastuun; loppuosa katetaan kunnasta.\n- Tarkista aina voimassa oleva sopimus ja ohjeet alueeltasi — laskutus, avustamisvaatimukset ja käytännöt vaihtelevat kunnittain ja sopimuksittain.\n- Vammaispalvelukuljetuspäätöksen omaavalla asiakkaalla voi olla myös oikeus maksuttomaan saattajaan — tarkista päätöksestä.\n  [Simplified: Vammaispalvelukuljetus on kunnan myöntämä palvelu vaikeavammaisille. Asiakas maksaa pienen omavastuun. Tarkista paikalliset ohjeet laskutuksesta ja avustamisesta.]"}, {"id": "M39", "slug": "taxi-licence-requirements", "title": "Taxi Driver's Licence Requirements", "en": "To obtain a taxi driver's licence in Finland, an applicant must meet the following requirements:\n\n1. Age: at least 21 years old.\n2. Driving licence: must hold a valid category B driving licence that has been held for at least 1 year.\n3. Health: must meet the health requirements for driving — demonstrated by a doctor's examination and certificate.\n4. Good conduct: must not have convictions that would prevent granting the licence. A person who has committed drink-driving may not apply for a taxi licence for three years.\n5. Local knowledge examination: must pass the local knowledge test for the area where they will operate.\n6. Language: must have sufficient language skills to serve customers and carry out job duties.\n\nThe taxi driver's licence is issued by Traficom (Transport and Communications Agency). It is a personal licence valid throughout mainland Finland, for a maximum of five years. It is not the same as a taxi transport licence (taksiliikennelupa), which is a business licence to operate a taxi company.\n  [Simplified: To get a taxi licence you need: category B licence held 1+ year, be 21+, pass a health check and local knowledge test, and have no disqualifying criminal record. Traficom issues the licence.]", "fi": "Taksinkuljettajan ajoluvan saamiseksi Suomessa hakijan on täytettävä seuraavat vaatimukset:\n\n1. Ikä: vähintään 21 vuotta.\n2. Ajokortti: voimassa oleva B-luokan ajokortti, joka on ollut voimassa vähintään 1 vuoden ajan.\n3. Terveys: täytettävä ajamista koskevat terveysvaatimukset — osoitetaan lääkärintodistuksella.\n4. Hyvä käytös: ei tuomioita, jotka estäisivät luvan myöntämisen. Rattijuopumukseen syyllistynyt ei voi hakea taksiajolupaa kolmeen vuoteen.\n5. Paikallistuntemuskoetta: on läpäistävä paikallistuntemuskokeinen sillä alueella, jolla aikoo toimia.\n6. Kielitaito: riittävä kielitaito asiakkaiden palvelemiseen ja työtehtävien hoitamiseen.\n\nTaksinkuljettajan ajoluvan myöntää Traficom (Liikenne- ja viestintävirasto). Se on henkilökohtainen lupa, joka on voimassa koko Manner-Suomessa enintään viisi vuotta. Se ei ole sama asia kuin taksiliikennelupa, joka on yritykselle myönnettävä liikelupa.\n  [Simplified: Taksiajoluvan saamiseksi tarvitset: vähintään 1 vuoden ajan voimassa olleen B-ajokortin, yli 21 vuoden iän, lääkärintodistuksen ja paikallistuntemuskokeen läpäisemisen, eikä sinulla saa olla estäviä rikostuomioita. Traficom myöntää luvan.]"}];
const ANSWERS={"1":["C","A professional driver assesses each intoxicated passenger individually based on their general condition and ability to communicate, making a transport decision on safety and professional judgement — not refusing everyone automatically nor accepting all unconditionally."],"2":["A","When a tyre punctures, the safest immediate action is to stop in a safe place and change the tyre. Continuing slowly risks further damage and loss of control."],"3":["A","Leg straps prevent the legs from sliding or moving during braking or cornering, which could cause injury — the same principle as upper-body and pelvic belts."],"4":["B","Stop so the passenger exits onto the pavement side, and check especially for cyclists coming from behind before opening doors. Stopping at the left edge is dangerous."],"5":["C","Finnish law requires a child under 135 cm to always use an appropriate safety device in a vehicle, including a taxi."],"6":["B","A receipt must always be given for every taxi trip — this is a legal requirement under Finnish transport law."],"7":["B","For an elderly passenger needing mobility assistance, the task is complete only when the driver has confirmed the passenger has got safely indoors."],"8":["A","Health requirements for a taxi driver's licence are demonstrated by a doctor's examination and the certificate obtained at the time of application."],"9":["A","Professional assistance begins by asking — always ask the passenger whether they want help and what kind, before touching them or their mobility aid."],"10":["C","Release the stretcher lock only once the stretcher is supported and the wheels are on the ground or the lowering mechanism is under control — to prevent the stretcher from dropping."],"11":["C","Report the situation to your employer. Never speed, and never stay silent — the employer must be informed so they can arrange alternative pick-ups."],"12":["A","Place the unconscious but breathing patient in the recovery position, monitor breathing, and call emergency services 112."],"13":["C","Speak calmly and briefly, maintain a polite tone, and avoid arguing. De-escalation through calm communication is the professional approach."],"14":["C","Fix the receipt printer (e.g. replace the roll or find another way to give a receipt) so the customer receives one — a receipt is always required."],"15":["C","Sufficient language skill means the driver can serve the customer and carry out work duties in the required language — not fluent conversation on any topic."],"16":["B","A stretcher patient lying on their back must be secured with shoulder belt, pelvic belt, and leg belt — all three points are required for safe transport."],"17":["B","A working dog is identified by its identification harness (tunnistevaljaat), which distinguishes it from a regular pet."],"18":["B","Assist the elderly customer safely into the vehicle and ensure seat belts are correctly fastened. There is no rule requiring elderly passengers to sit in the front."],"19":["A","Tell the customer you cannot speed, but do your best to get them there safely via the fastest possible route. Speeding is never permitted."],"20":["B","The main goal of anticipatory driving is to avoid ending up in dangerous or accident situations in the first place."],"21":["B","Calm an aggressive passenger by speaking to them calmly and kindly — de-escalation through composed, friendly communication."],"22":["C","Check with your employer whether you can work as a regular taxi driver for this passenger — the specifics of Kela-funded regular taxi rights depend on employer and contract details."],"23":["A","Under the Finnish Employment Contracts Act, when an employee resigns, the notice period is 14 days if employment has continued for no longer than five years. The 1-month and longer brackets apply only when the employer dismisses the employee. Kalle is quitting voluntarily after 4 years, so his notice period is 14 days."],"24":["C","A taxi stand is reserved for taxis in service. The driver waits their turn in the queue and does not leave the car unattended."],"25":["B","Symptoms of confusion, sweating, and apparent drunkenness without alcohol smell in a known diabetic suggest hypoglycaemia (low blood sugar). Take it into account and call 112 if needed."],"26":["B","A category B driving licence must have been held for at least one year before a taxi driver's licence can be granted in Finland."],"27":["B","Let the customer transfer by themselves and assist only if necessary — respect the customer's autonomy."],"28":["C","Battery performance drops in cold temperatures and heating the cabin and battery uses energy, reducing the electric taxi's range in winter."],"29":["C","In freezing weather, continue driving only when you have made sure the customer has gotten indoors — duty of care extends to ensuring the vulnerable customer's safety."],"30":["A","The wheelchair is secured from the frame at four different points and the chair's brakes are applied — the four-point tie-down system is the standard safe method."],"31":["A","Stay in the car and keep the doors locked while waiting — this is safe practice and respects the customer's request."],"32":["A","Reduce background noise (e.g. turn down the radio) because a hearing aid amplifies all sounds including background noise, making communication harder."],"33":["C","The alcohol interlock in school and daycare transport prevents the car from starting if breath alcohol is 0.10 mg/l or more."],"34":["A","Apologise that you cannot take them and suggest ordering a vehicle equipped with an appropriate child safety device — you must not transport a child under 135 cm without one."],"35":["A","You must not exceed the maximum permitted load the manufacturer has marked on the lift — this applies to all wheelchairs regardless of type."],"36":["B","The taxi light/sign must always be displayed when the vehicle is operating as a taxi."],"37":["A","A professional driver refuels or recharges sufficiently be     btn.textContent=`${start}–${end}`;
    btn.dataset.ctab=idx;
    btn.onclick=()=>switchChildTab(idx);
    bar.appendChild(btn);
    const panel=document.createElement('div');
    panel.className='child-panel'+(idx===0?' active':'');
    panel.id='cpanel-'+idx;
    group.forEach(q=>{
      const ad=ANSWERS[String(q.num)];
      const cl=ad?ad[0]:null,cr=ad?ad[1]:'';
      const cn=CONFLICTS[String(q.num)]||null;
      const preview=q.en||q.fi||'';
      const el=document.createElement('div');
      el.className='q-group';
      let aHTML='';
      ['A','B','C'].forEach(l=>{
        const a=q.answers[l];if(!a)return;
        aHTML+=`<div class="answer-row"><div class="answer-letter">${l}</div><div class="answer-fi">${esc(a.fi)}</div><div class="answer-en">${esc(a.en)}</div></div>`;
      });
      const isFlawed=cl==='NONE';
      const corrHTML=cl&&!isFlawed?`<div class="correct-answer-box"><div class="ca-label">✓ Correct Answer</div><div class="ca-letter">Answer: ${cl}</div><div class="ca-reason">${esc(cr)}</div></div>`:isFlawed?`<div class="correct-answer-box" style="background:var(--conflict-bg);border-color:var(--conflict-border)"><div class="ca-label" style="color:#b8860b">⚠️ Flawed Question</div><div class="ca-reason">${esc(cr)}</div></div>`:`<div style="font-size:.78rem;color:var(--text-muted);font-style:italic">Correct answer not available</div>`;
      const confHTML=cn?`<div class="conflict-box"><div class="cf-label">⚠️ Note – Verify This Question</div>${esc(cn)}</div>`:'';
      el.innerHTML=`<div class="q-group-header" onclick="this.parentElement.classList.toggle('open')"><span class="q-num">Q${q.num}</span><span class="q-category">${esc(q.category)}</span><span class="q-preview">${esc(preview.substring(0,90))}${preview.length>90?'…':''}</span><span class="q-chevron">▼</span></div><div class="q-body">${q.fi?`<div class="q-question-fi">${esc(q.fi)}</div>`:''}${q.en?`<div class="q-question-en">${esc(q.en)}</div>`:''}<div class="answers-list">${aHTML}</div>${corrHTML}${confHTML}</div>`;
      panel.appendChild(el);
    });
    content.appendChild(panel);
  });
}

function vocabRowId(fi){
  return 'vrow-' + fi.replace(/[^a-zA-ZäöåÄÖÅ0-9]/g,'_');
}

function jumpToVocab(fi){
  const id = vocabRowId(fi);
  const row = document.getElementById(id);
  if(!row) return;
  row.scrollIntoView({behavior:'smooth', block:'center'});
  row.classList.remove('vocab-row-highlight');
  void row.offsetWidth; // reflow to restart animation
  row.classList.add('vocab-row-highlight');
}

function buildM00VocabTable(){
  let html = `<div class="vocab-section">
    <div class="vocab-section-label">📖 New words from this lesson</div>
    <table class="vocab-table">
      <thead><tr><th>Finnish word</th><th>Roots &amp; meaning</th><th>Full meaning</th></tr></thead>
      <tbody>`;
  M00_VOCAB.forEach(group => {
    html += `<tr><td colspan="3" class="vocab-group-header">${esc(group.group)}</td></tr>`;
    group.words.forEach(w => {
      const rowId = vocabRowId(w.fi);
      const rootsHTML = w.roots.map(([pill]) =>
        `<span class="vocab-root-pill">${esc(pill)}</span>`
      ).join(' ') + '<div class="vocab-root-detail">' + w.roots.map(([pill, detail]) =>
        `<b>${esc(pill)}</b> = ${esc(detail)}`
      ).join(' · ') + '</div>';
      html += `<tr id="${rowId}">
        <td><div class="vocab-fi">${esc(w.fi)}</div></td>
        <td><div class="vocab-roots">${rootsHTML}</div></td>
        <td class="vocab-en">${esc(w.en)}</td>

    });
  });
  html += `</tbody></table></div>`;
  return html;
}

function buildVocabTable(lessonId){
  const data = ALL_VOCAB[lessonId];
  if(!data) return '';
  let html = '<div class="vocab-section"><div class="vocab-section-label">\u{1F4D6} New words from this lesson</div><table class="vocab-table"><thead><tr><th>Finnish word</th><th>Roots &amp; meaning</th><th>Full meaning</th></tr></thead><tbody>';
  data.groups.forEach(function(group){
    html += '<tr><td colspan="3" class="vocab-group-header">' + esc(group.group) + '</td></tr>';
    group.words.forEach(function(w){
      var rowId = vocabRowId(w.fi + '_' + lessonId);
      var rootsHTML = w.roots.map(function(r){ return '<span class="vocab-root-pill">' + esc(r[0]) + '</span>'; }).join(' ')
        + '<div class="vocab-root-detail">' + w.roots.map(function(r){ return '<b>' + esc(r[0]) + '</b> = ' + esc(r[1]); }).join(' &middot; ') + '</div>';
      html += '<tr id="' + rowId + '"><td><div class="vocab-fi">' + esc(w.fi) + '</div></td><td><div class="vocab-roots">' + rootsHTML + '</div></td><td class="vocab-en">' + esc(w.en) + '</td></tr>';
    });
  });
  html += '</tbody></table></div>';
  return html;
}

function buildM01VocabTable(){
  let html = `<div class="vocab-section">
    <div class="vocab-section-label">📖 New words from this lesson</div>
    <table class="vocab-table">
      <thead><tr><th>Finnish word</th><th>Roots &amp; meaning</th><th>Full meaning</th></tr></thead>
      <tbody>`;
  M01_VOCAB.forEach(group => {
    html += `<tr><td colspan="3" class="vocab-group-header">${esc(group.group)}</td></tr>`;
    group.words.forEach(w => {
      const rowId = vocabRowId(w.fi);
      const rootsHTML = w.roots.map(([pill]) =>
        `<span class="vocab-root-pill">${esc(pill)}</span>`
      ).join(' ') + '<div class="vocab-root-detail">' + w.roots.map(([pill, detail]) =>
        `<b>${esc(pill)}</b> = ${esc(detail)}`
      ).join(' · ') + '</div>';
      html += `<tr id="${rowId}">
        <td><div class="vocab-fi">${esc(w.fi)}</div></td>
        <td><div class="vocab-roots">${rootsHTML}</div></td>
        <td class="vocab-en">${esc(w.en)}</td>
      </tr>`;
    });
  });
  html += `</tbody></table></div>`;
  return html;
}

function buildM01TermPatterns(){
  const allForms = [];
  M01_SURFACE_FORMS.forEach(({forms, key}) => {
    forms.forEach(form => allForms.push({form, key}));
  });
  allForms.sort((a,b) => b.form.length - a.form.length);
  return allForms.map(({form, key}) => ({
    regex: new RegExp(form.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'),
    key
  }));
}

function linkM01VocabTerms(container){
  const patterns = buildM01TermPatterns();

  function segmentText(text){
    const segments = [{type:'text', value: text}];
    for(const {regex, key} of patterns){
      const next = [];
      for(const seg of segments){
        if(seg.type !== 'text'){ next.push(seg); continue; }
        let remaining = seg.value;
        let safety = 0;
        while(remaining.length && safety++ < 200){
          regex.lastIndex = 0;
          const m = regex.exec(remaining);
          if(!m){ next.push({type:'text', value: remaining}); break; }
          if(m.index > 0) next.push({type:'text', value: remaining.slice(0, m.index)});
          next.push({type:'link', text: m[0], key});
          remaining = remaining.slice(m.index + m[0].length);
        }
      }
      segments.length = 0;
      segments.push(...next);
    }
    return segments;
  }

  function processTextNode(node){
    if(!node.parentNode) return;
    const text = node.textContent;
    const segs = segmentText(text);
    if(segs.length === 1 && segs[0].type === 'text') return;
    const frag = document.createDocumentFragment();
    segs.forEach(seg => {
      if(seg.type === 'text'){
        frag.appendChild(document.createTextNode(seg.value));
      } else {
        const btn = document.createElement('button');
        btn.className = 'vocab-link';
        btn.textContent = seg.text;
        btn.title = 'See in vocabulary table ↓';
        btn.setAttribute('onclick', `jumpToVocab(${JSON.stringify(seg.key)})`);
        frag.appendChild(btn);
      }
    });
    node.parentNode.replaceChild(frag, node);
  }

  function walkNode(node){
    if(node.nodeType === 3){
      processTextNode(node);
    } else if(node.nodeType === 1 && !['BUTTON','A','SCRIPT','STYLE'].includes(node.tagName)){
      Array.from(node.childNodes).forEach(walkNode);
    }
  }

  container.querySelectorAll('.lesson-col .lesson-text').forEach(el => walkNode(el));
}

function renderLessons(){
  const container=document.getElementById('lessonsContent');
  // Separate original and new lessons
  const origLessons=LESSONS.filter(l=>!NEW_LESSON_IDS.has(l.id));
  const newLessons=LESSONS.filter(l=>NEW_LESSON_IDS.has(l.id));

  function makeCard(lesson,isNew){
    const card=document.createElement('div');
    card.className='lesson-card'+(isNew?' new-lesson':'');
    const enF=lesson.en&&lesson.en.trim()?formatLessonText(lesson.en):'<p style="color:var(--text-muted);font-style:italic">No English content.</p>';
    const fiF=lesson.fi&&lesson.fi.trim()?formatLessonText(lesson.fi):'<p style="color:var(--text-muted);font-style:italic">Ei suomenkielistä sisältöä.</p>';
    const badge=isNew?'<span class="new-badge">NEW</span>':'';
    const vocabHTML = lesson.id === 'M00' ? buildM00VocabTable() : lesson.id === 'M01' ? buildM01VocabTable() : buildVocabTable(lesson.id === 'M03' ? (lesson.slug && lesson.slug.includes('unaccompanied') ? 'M03b' : 'M03a') : lesson.id === 'M30' ? (lesson.slug && lesson.slug.includes('working') ? 'M30b' : lesson.slug && lesson.slug.includes('alcohol') ? 'M30c' : 'M30a') : lesson.id);
    card.innerHTML=`<div class="lesson-header" onclick="this.parentElement.classList.toggle('open')"><span class="lesson-id">${esc(lesson.id)}</span>${badge}<span class="lesson-title">${esc(lesson.title)}</span><span class="lesson-chevron">▼</span></div><div class="lesson-body"><div class="lesson-content"><div class="lesson-col"><div class="lesson-col-label">🇫🇮 Suomi</div>${fiF}</div><div class="lesson-col"><div class="lesson-col-label">🇬🇧 English</div>${enF}</div></div>${vocabHTML}</div>`;
    return card;
  }

  origLessons.forEach(l=>{
    const card = makeCard(l,false);
    container.appendChild(card);

  });

  if(newLessons.length>0){
    const div=document.createElement('div');
    div.className='section-divider';
    div.textContent='📌 Additional Study Topics — Added to Cover All Exam Questions';
    container.appendChild(div);
    newLessons.forEach(l=>container.appendChild(makeCard(l,true)));
  }
}

function switchParentTab(id){
  document.querySelectorAll('.ptab-btn').forEach(b=>b.classList.toggle('active',b.dataset.ptab===id));
  document.querySelectorAll('.parent-panel').forEach(p=>p.classList.toggle('active',p.id==='ppanel-'+id));
  document.getElementById('qaControls').style.display=id==='qa'?'flex':'none';
}
function switchChildTab(idx){
  document.querySelectorAll('.ctab-btn').forEach(b=>b.classList.toggle('active',+b.dataset.ctab===idx));
  document.querySelectorAll('.child-panel').forEach(p=>p.classList.toggle('active',p.id==='cpanel-'+idx));
  const btn=document.querySelector(`.ctab-btn[data-ctab="${idx}"]`);
  if(btn)btn.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
function toggleAll(open){
  const a=document.querySelector('.child-panel.active');
  if(a)a.querySelectorAll('.q-group').forEach(g=>g.classList.toggle('open',open));
}
let isDark=false;
function toggleTheme(){
  isDark=!isDark;
  document.documentElement.setAttribute('data-theme',isDark?'dark':'');
  document.getElementById('themeBtn').textContent=isDark?'☀️':'🌙';
}
