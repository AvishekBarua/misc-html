<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ec; --card:#ffffff; --ink:#2f2318; --muted:#8a7565;
  --border:#ecdcc6; --shadow:rgba(90,60,20,.14);
  --done-bg:#e7f8e3; --done-line:#3aa93a; --done-ink:#1f6b22;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1610; --card:#2a231b; --ink:#f7ecdd; --muted:#b5a48f;
    --border:#3d3227; --shadow:rgba(0,0,0,.45);
    --done-bg:#20361f; --done-line:#5fd35f; --done-ink:#a8e6a3;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1610; --card:#2a231b; --ink:#f7ecdd; --muted:#b5a48f;
  --border:#3d3227; --shadow:rgba(0,0,0,.45);
  --done-bg:#20361f; --done-line:#5fd35f; --done-ink:#a8e6a3;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  font-weight:500; padding:14px 12px 44px;
  max-width:1100px; margin:0 auto; overflow-x:hidden;
}

/* routine switcher */
.routines{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.routines button{
  flex:1 1 140px;min-width:0;font-family:inherit;font-size:clamp(14px,3.6vw,19px);font-weight:700;
  background:var(--card);color:var(--muted);
  border:3px solid var(--border);border-radius:999px;
  padding:12px 4px;cursor:pointer;box-shadow:0 4px 0 var(--shadow);
}
.routines button.on{color:var(--ink);border-color:#f2b705;background:rgba(242,183,5,.16)}
.routines button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}

/* kid tabs (small screens) */
.tabs{display:none;gap:10px;margin-bottom:12px}
.tabs button{
  flex:1;font-family:inherit;font-size:18px;font-weight:700;
  background:var(--card);color:var(--muted);
  border:3px solid var(--border);border-radius:999px;padding:9px;cursor:pointer;
}
.tabs button.on{border-color:var(--kidcolor);color:var(--ink);background:var(--kidtint)}

.routine{display:none}
.routine.active{display:block}
.board{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col{display:block;min-width:0}

@media (max-width:640px){
  .tabs{display:flex}
  .board{grid-template-columns:1fr}
  .col{display:none}
  .col.active{display:block}
}

.kidhead{
  display:flex;align-items:center;gap:10px;
  background:var(--kidtint);border:3px solid var(--kidcolor);
  border-radius:20px;padding:8px 12px;margin-bottom:10px;
}
.kidhead .face{font-size:34px;line-height:1}
.kidhead input{
  flex:1;min-width:0;font-family:inherit;font-size:22px;font-weight:700;
  color:var(--ink);background:transparent;border:none;
  border-bottom:2px dashed transparent;padding:2px 0;
}
.kidhead input:focus{outline:none;border-bottom-color:var(--kidcolor)}

.progress-wrap{
  background:var(--card);border:2px solid var(--border);border-radius:999px;
  padding:5px;display:flex;align-items:center;gap:8px;
  box-shadow:0 3px 0 var(--shadow);margin-bottom:6px;
}
.bar{flex:1;height:14px;background:var(--border);border-radius:999px;overflow:hidden}
.bar > span{display:block;height:100%;width:0%;border-radius:999px;background:var(--kidcolor);transition:width .35s ease}
.count{font-weight:700;font-size:15px;padding-right:8px;white-space:nowrap}

h2{
  font-size:14px;font-weight:600;color:var(--muted);
  margin:18px 0 8px;display:flex;align-items:center;gap:8px;
  text-transform:uppercase;letter-spacing:1px;
}
h2::after{content:"";flex:1;height:2px;background:var(--border);border-radius:2px}

.step{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  background:var(--card);color:var(--ink);
  border:2px solid var(--border);border-left:9px solid var(--kidcolor);
  border-radius:18px;padding:10px 12px;margin-bottom:9px;
  font-family:inherit;font-size:18px;font-weight:600;cursor:pointer;
  box-shadow:0 4px 0 var(--shadow);
  transition:transform .12s ease,background .2s ease,border-color .2s ease,box-shadow .12s ease;
}
.step:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}

.num{
  flex:0 0 auto;width:28px;height:28px;border-radius:50%;
  background:var(--kidcolor);color:#2f2318;
  display:grid;place-items:center;font-size:15px;font-weight:700;
}
.icon{flex:0 0 auto;font-size:32px;line-height:1;position:relative;width:42px;text-align:center}
.icon .badge{
  position:absolute;right:-5px;bottom:-6px;font-size:16px;
  background:var(--card);border-radius:50%;line-height:1;padding:1px;
}
.icon svg{width:34px;height:34px;display:block;margin:0 auto}
.label{flex:1;line-height:1.2}
.check{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;
  border:3px dashed var(--border);display:grid;place-items:center;
  font-size:19px;color:transparent;
}

.step.done{background:var(--done-bg);border-color:var(--done-line);border-left-color:var(--done-line)}
.step.done .label{text-decoration:line-through;text-decoration-thickness:3px;color:var(--done-ink)}
.step.done .icon{opacity:.55}
.step.done .num{background:var(--done-line);color:#fff}
.step.done .check{border:3px solid var(--done-line);background:var(--done-line);color:#fff;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

.reset{
  display:block;margin:14px auto 0;font-family:inherit;font-size:15px;font-weight:600;
  background:var(--card);color:var(--muted);border:2px solid var(--border);
  border-radius:999px;padding:9px 20px;cursor:pointer;box-shadow:0 3px 0 var(--shadow);
}
.reset:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}

#party{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.45);z-index:20;padding:20px}
#party.show{display:grid}
.party-card{
  background:var(--card);border:4px solid var(--done-line);border-radius:28px;
  padding:24px 26px;text-align:center;max-width:340px;
  box-shadow:0 10px 0 var(--shadow);animation:pop .35s ease;
}
.party-card .big{font-size:60px;line-height:1.1}
.party-card p{font-size:24px;font-weight:700;margin:10px 0 18px}
.party-card button{
  font-family:inherit;font-size:18px;font-weight:700;background:var(--done-line);
  color:#fff;border:none;border-radius:999px;padding:12px 28px;cursor:pointer;
}
.confetti{position:fixed;top:-40px;font-size:26px;pointer-events:none;z-index:25;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(420deg);opacity:.9}}

.rocket{
  position:fixed;width:6px;height:16px;border-radius:3px;
  pointer-events:none;z-index:30;
  transition:transform .62s cubic-bezier(.2,.75,.4,1);
}
.spark{
  position:fixed;width:10px;height:10px;border-radius:50%;
  pointer-events:none;z-index:30;
  --tx:0px; --ty:0px; --dur:1.2s;
  animation:burst var(--dur) cubic-bezier(.15,.6,.35,1) forwards;
}
.spark.emo{width:auto;height:auto;border-radius:0;background:none!important;box-shadow:none!important;font-size:26px;line-height:1}
@keyframes burst{
  0%{transform:translate(0,0) scale(1.15);opacity:1}
  65%{opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(.25);opacity:0}
}
</style>
</head>
<body>

<div class="routines" id="routines"></div>
<div class="tabs" id="tabs"></div>
<div id="stage"></div>

<div id="party">
  <div class="party-card" id="partyCard">
    <div class="big" id="partyBig">🎉🌟🎉</div>
    <p id="partyText">All done!</p>
    <button id="closeParty">Yay!</button>
  </div>
</div>

<script>
(function(){

  var ICONS = {
    coat:
      '<svg viewBox="0 0 48 48" aria-hidden="true">' +
        '<path d="M16 10 L32 10 L38 13 L44 34 L37 37 L34 20 L34 42 Q24 45 14 42 L14 20 L11 37 L4 34 L10 13 Z" fill="#f0a0a6" stroke="#b25a63" stroke-width="2.2" stroke-linejoin="round"/>' +
        '<path d="M18 10 L24 20 L30 10 L27 9 L24 14 L21 9 Z" fill="#b25a63"/>' +
        '<path d="M5 29 L12 32 M43 29 L36 32" stroke="#b25a63" stroke-width="2" fill="none" stroke-linecap="round"/>' +
        '<circle cx="24" cy="26" r="1.9" fill="#b25a63"/>' +
        '<circle cx="24" cy="33" r="1.9" fill="#b25a63"/>' +
        '<circle cx="24" cy="39" r="1.7" fill="#b25a63"/>' +
      '</svg>',
    hoodie:
      '<svg viewBox="0 0 48 48" aria-hidden="true">' +
        '<path d="M17 13 Q24 2 31 13 Q24 18 17 13 Z" fill="#2c5680"/>' +
        '<path d="M16 11 L32 11 L38 14 L44 34 L37 37 L34 21 L34 42 Q24 45 14 42 L14 21 L11 37 L4 34 L10 14 Z" fill="#6fa8dc" stroke="#2c5680" stroke-width="2.2" stroke-linejoin="round"/>' +
        '<path d="M18 11 Q24 19 30 11" fill="none" stroke="#2c5680" stroke-width="2.2"/>' +
        '<path d="M24 19 L24 42" stroke="#2c5680" stroke-width="2"/>' +
        '<path d="M17 30 L31 30 L31 37 L17 37 Z" fill="none" stroke="#2c5680" stroke-width="1.8" stroke-linejoin="round"/>' +
        '<path d="M5 29 L12 32 M43 29 L36 32" stroke="#2c5680" stroke-width="2" fill="none" stroke-linecap="round"/>' +
      '</svg>'
  };

  var BADGE = { off:"⬇️", away:"🧺" };

  var KIDS = [
    { id:"girl", face:"👧", name:"My girl", color:"#f4978e", tint:"rgba(244,151,142,.18)",
      jacket:"coat", houseIcon:"👗", houseText:"Put on your house dress" },
    { id:"boy", face:"👦", name:"My boy", color:"#6fa8dc", tint:"rgba(111,168,220,.18)",
      jacket:"hoodie", houseIcon:"🩳", houseText:"Put on your home clothes" }
  ];

  var ROUTINES = [
    {
      id:"morning", label:"☀️ Morning",
      groups:[ {k:"home", t:"🏠 At home"}, {k:"go", t:"🚗 On the way"}, {k:"care", t:"🎒 At daycare"} ],
      milestones:[
        {at:6,  text:"is dressed and ready!", rockets:5},
        {at:11, text:"is all done!", rockets:8}
      ],
      steps:function(kid){
        return [
          {g:"home", icon:"🚽", text:"Go to the toilet"},
          {g:"home", icon:"👕", text:"Put on your shirt"},
          {g:"home", icon:"👖", text:"Put on your trousers"},
          {g:"home", svg:kid.jacket, text:"Put on your jacket"},
          {g:"home", icon:"🧦", text:"Put on your socks"},
          {g:"home", icon:"👟", text:"Put on your shoes"},
          {g:"go",   icon:"🏫", text:"Go to daycare"},
          {g:"care", icon:"👟", badge:"off", text:"Take off your shoes"},
          {g:"care", svg:kid.jacket, badge:"off", text:"Take off your jacket"},
          {g:"care", icon:"🥿", text:"Put on indoor shoes"},
          {g:"care", icon:"🧼", text:"Wash your hands"}
        ];
      }
    },
    {
      id:"pickup", label:"🎒 Pick-up",
      groups:[ {k:"care", t:"🎒 At daycare"}, {k:"go", t:"🚗 Going home"} ],
      milestones:[ {at:6, text:"is ready to go home!", rockets:8} ],
      steps:function(kid){
        return [
          {g:"care", icon:"🤗", text:"Come to me"},
          {g:"care", icon:"🚪", text:"Go to the room"},
          {g:"care", icon:"🧸", text:"Tidy up your things"},
          {g:"care", icon:"🧼", text:"Wash your hands"},
          {g:"care", icon:"🎒", text:"Take your bag"},

          {g:"go",   icon:"🚗", text:"Go to the car"}
        ];
      }
    },
    {
      id:"athome", label:"🏡 At home",
      groups:[ {k:"arrive", t:"🏡 Coming in"}, {k:"off", t:"👟 Take off and put away"},
               {k:"after", t:"✨ Then"} ],
      milestones:[
        {at:9,  text:"put everything away!", rockets:5},
        {at:13, text:"is all done!", rockets:8}
      ],
      steps:function(kid){
        return [
          {g:"arrive", icon:"🏡", text:"Arrive home"},

          {g:"off", icon:"👟", badge:"off",  text:"Take off your shoes"},
          {g:"off", icon:"👟", badge:"away", text:"Put your shoes in their place"},
          {g:"off", icon:"🧦", badge:"off",  text:"Take off your socks"},
          {g:"off", icon:"🧦", badge:"away", text:"Put your socks in the basket"},
          {g:"off", icon:"👕", badge:"off",  text:"Take off your top"},
          {g:"off", icon:"👕", badge:"away", text:"Put your top in its place"},
          {g:"off", icon:"👖", badge:"off",  text:"Take off your trousers"},
          {g:"off", icon:"👖", badge:"away", text:"Put your trousers in their place"},

          {g:"after", icon:"👕", text:"Put on your shirt"},
          {g:"after", icon:"👖", text:"Put on your trousers"},
          {g:"after", icon:"🚽", text:"Go to the toilet"},
          {g:"after", icon:"🧼", text:"Wash your hands and face"}
        ];
      }
    },
    {
      id:"night", label:"🌙 Evening",
      groups:[ {k:"food", t:"🍽️ Dinner"}, {k:"bed", t:"🪥 Before bed"} ],
      milestones:[
        {at:4, text:"finished the food!", rockets:5},
        {at:8, text:"is all done!", rockets:8}
      ],
      steps:function(kid){
        return [
          {g:"food", icon:"🧼", text:"Clean your hands"},
          {g:"food", icon:"🍽️", text:"Go to the table"},
          {g:"food", icon:"🍲", text:"Finish your food"},
          {g:"food", icon:"🧼", text:"Clean your hands"},

          {g:"bed", icon:"🪥", text:"Come and brush your teeth"},
          {g:"bed", icon:"🦷", text:"Finish brushing"},
          {g:"bed", icon:"🧽", text:"Clean your mouth and face"},
          {g:"bed", icon:"🚽", text:"Go to the toilet"}
        ];
      }
    }
  ];

  var routinesBar = document.getElementById("routines");
  var tabsBar = document.getElementById("tabs");
  var stage = document.getElementById("stage");
  var party = document.getElementById("party");
  var partyText = document.getElementById("partyText");
  var partyCard = document.getElementById("partyCard");
  var partyBig = document.getElementById("partyBig");
  var partyBtn = document.getElementById("closeParty");

  var nameInputs = { girl:[], boy:[] };
  var tabButtons = {};
  var activeKid = KIDS[0].id;

  function today(){
    var d = new Date();
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }
  function storeKey(r,k){ return "routine-v3-"+r.id+"-"+k.id; }
  function nameKey(k){ return "routine-name-"+k.id; }

  function loadDone(r,k){
    try{
      var raw = localStorage.getItem(storeKey(r,k));
      if(!raw) return [];
      var d = JSON.parse(raw);
      if(!d || d.date !== today()) return [];
      return Array.isArray(d.done) ? d.done : [];
    }catch(e){ return []; }
  }
  function saveDone(r,k,col){
    try{
      var done = [].slice.call(col.querySelectorAll(".step.done")).map(function(s){return s.dataset.i;});
      localStorage.setItem(storeKey(r,k), JSON.stringify({date:today(), done:done}));
    }catch(e){}
  }
  function loadName(k){
    try{ return localStorage.getItem(nameKey(k)) || k.name; }catch(e){ return k.name; }
  }
  function setName(k, value){
    try{ localStorage.setItem(nameKey(k), value); }catch(e){}
    nameInputs[k.id].forEach(function(inp){ if(inp.value !== value) inp.value = value; });
    if(tabButtons[k.id]) tabButtons[k.id].lastChild.nodeValue = " " + value;
  }

  var FX = {
    girl:{ palette:["#ff5d8f","#ffa6c9","#ffd166","#c77dff","#ffffff"],
           emojis:["💖","🌸","⭐","✨","🦋","🌈"], big:"🎆💖🎆" },
    boy: { palette:["#4cc9f0","#4361ee","#70e000","#ffd166","#ffffff"],
           emojis:["🚀","⚡","⭐","✨","🏆","🎉"], big:"🎆🚀🎆" }
  };

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function burst(x, y, fx){
    for(var i=0;i<22;i++){
      var el = document.createElement("div");
      var isEmoji = (i % 6 === 0);
      el.className = "spark" + (isEmoji ? " emo" : "");
      var ang = Math.random()*Math.PI*2;
      var dist = 55 + Math.random()*120;
      el.style.setProperty("--tx", (Math.cos(ang)*dist).toFixed(1)+"px");
      el.style.setProperty("--ty", (Math.sin(ang)*dist + 45).toFixed(1)+"px");
      el.style.setProperty("--dur", (0.9 + Math.random()*0.7).toFixed(2)+"s");
      el.style.left = x + "px";
      el.style.top = y + "px";
      if(isEmoji){
        el.textContent = pick(fx.emojis);
      }else{
        var c = pick(fx.palette);
        el.style.background = c;
        el.style.boxShadow = "0 0 12px " + c;
      }
      document.body.appendChild(el);
      (function(node){ setTimeout(function(){ node.remove(); }, 2000); })(el);
    }
  }

  function rocket(fx){
    var x = window.innerWidth * (0.12 + Math.random()*0.76);
    var y = window.innerHeight * (0.14 + Math.random()*0.38);
    var r = document.createElement("div");
    r.className = "rocket";
    var c = pick(fx.palette);
    r.style.background = c;
    r.style.boxShadow = "0 0 10px " + c;
    r.style.left = x + "px";
    r.style.top = window.innerHeight + "px";
    document.body.appendChild(r);
    requestAnimationFrame(function(){
      r.style.transform = "translateY(" + (y - window.innerHeight) + "px)";
    });
    setTimeout(function(){ r.remove(); burst(x, y, fx); }, 640);
  }

  function celebrateFor(kid, name, msg, rockets){
    var fx = FX[kid.id] || FX.girl;
    var shots = rockets || 8;
    partyBig.textContent = fx.big;
    partyCard.style.borderColor = kid.color;
    partyBtn.style.background = kid.color;
    partyBtn.style.color = "#2f2318";
    partyText.innerHTML = (name || "All") + " " + (msg || "is all done!") + "<br>Great job!";
    party.classList.add("show");

    for(var i=0;i<shots;i++){
      (function(i){ setTimeout(function(){ rocket(fx); }, i*330); })(i);
    }
    for(var j=0;j<shots*3;j++){
      (function(j){
        setTimeout(function(){
          var el = document.createElement("div");
          el.className = "confetti";
          el.textContent = pick(fx.emojis);
          el.style.left = Math.random()*95 + "vw";
          el.style.animationDuration = (2 + Math.random()*1.8) + "s";
          document.body.appendChild(el);
          setTimeout(function(){ el.remove(); }, 4200);
        }, 400 + j*110);
      })(j);
    }
  }

  function buildColumn(routine, kid){
    var steps = routine.steps(kid);
    var col = document.createElement("section");
    col.className = "col" + (kid.id === activeKid ? " active" : "");
    col.dataset.kid = kid.id;
    col.style.setProperty("--kidcolor", kid.color);
    col.style.setProperty("--kidtint", kid.tint);

    var head = document.createElement("div");
    head.className = "kidhead";
    head.innerHTML = '<span class="face">'+kid.face+'</span>';
    var input = document.createElement("input");
    input.value = loadName(kid);
    input.setAttribute("aria-label","Name");
    input.addEventListener("input", function(){ setName(kid, input.value); });
    head.appendChild(input);
    nameInputs[kid.id].push(input);
    col.appendChild(head);

    var prog = document.createElement("div");
    prog.className = "progress-wrap";
    prog.innerHTML = '<div class="bar"><span></span></div><div class="count"><b>0</b>/'+steps.length+' ⭐</div>';
    col.appendChild(prog);
    var fill = prog.querySelector(".bar span");
    var countEl = prog.querySelector(".count b");

    var saved = loadDone(routine, kid);

    routine.groups.forEach(function(group){
      var inGroup = steps.filter(function(s){ return s.g === group.k; });
      if(!inGroup.length) return;
      var h2 = document.createElement("h2");
      h2.textContent = group.t;
      col.appendChild(h2);

      inGroup.forEach(function(step){
        var i = steps.indexOf(step);
        var btn = document.createElement("button");
        btn.className = "step";
        btn.dataset.i = String(i);
        btn.innerHTML =
          '<span class="num">'+(i+1)+'</span>' +
          '<span class="icon">' + (step.svg ? ICONS[step.svg] : step.icon) +
            (step.badge ? '<span class="badge">'+BADGE[step.badge]+'</span>' : '') +
          '</span>' +
          '<span class="label">'+step.text+'</span>' +
          '<span class="check">✓</span>';
        if(saved.indexOf(String(i)) > -1) btn.classList.add("done");
        btn.addEventListener("click", function(){
          btn.classList.toggle("done");
          saveDone(routine, kid, col);
          update(true);
        });
        col.appendChild(btn);
      });
    });

    var reset = document.createElement("button");
    reset.className = "reset";
    reset.textContent = "↺ Start again";
    reset.addEventListener("click", function(){
      [].slice.call(col.querySelectorAll(".step")).forEach(function(s){ s.classList.remove("done"); });
      saveDone(routine, kid, col);
      update(false);
    });
    col.appendChild(reset);

    var milestones = routine.milestones || [{at:steps.length, text:"is all done!", rockets:8}];
    var fired = {};

    function update(celebrate){
      var n = col.querySelectorAll(".step.done").length;
      countEl.textContent = n;
      fill.style.width = (n / steps.length * 100) + "%";
      Object.keys(fired).forEach(function(k){ if(Number(k) > n) delete fired[k]; });
      if(celebrate && !fired[n]){
        for(var m=0;m<milestones.length;m++){
          if(milestones[m].at === n){
            fired[n] = true;
            celebrateFor(kid, input.value, milestones[m].text, milestones[m].rockets);
            break;
          }
        }
      }
    }
    update(false);
    return col;
  }

  ROUTINES.forEach(function(routine, ri){
    var wrap = document.createElement("div");
    wrap.className = "routine" + (ri === 0 ? " active" : "");
    var board = document.createElement("div");
    board.className = "board";
    KIDS.forEach(function(kid){ board.appendChild(buildColumn(routine, kid)); });
    wrap.appendChild(board);
    stage.appendChild(wrap);

    var rBtn = document.createElement("button");
    rBtn.textContent = routine.label;
    if(ri === 0) rBtn.classList.add("on");
    rBtn.addEventListener("click", function(){
      [].slice.call(stage.children).forEach(function(w){ w.classList.remove("active"); });
      [].slice.call(routinesBar.children).forEach(function(b){ b.classList.remove("on"); });
      wrap.classList.add("active");
      rBtn.classList.add("on");
      window.scrollTo(0,0);
    });
    routinesBar.appendChild(rBtn);
  });

  KIDS.forEach(function(kid){
    var tBtn = document.createElement("button");
    tBtn.innerHTML = kid.face;
    tBtn.appendChild(document.createTextNode(" " + loadName(kid)));
    if(kid.id === activeKid) tBtn.classList.add("on");
    tBtn.style.setProperty("--kidcolor", kid.color);
    tBtn.style.setProperty("--kidtint", kid.tint);
    tBtn.addEventListener("click", function(){
      activeKid = kid.id;
      [].slice.call(document.querySelectorAll(".col")).forEach(function(c){
        c.classList.toggle("active", c.dataset.kid === kid.id);
      });
      [].slice.call(tabsBar.children).forEach(function(b){ b.classList.remove("on"); });
      tBtn.classList.add("on");
    });
    tabButtons[kid.id] = tBtn;
    tabsBar.appendChild(tBtn);
  });

  document.getElementById("closeParty").addEventListener("click", function(){
    party.classList.remove("show");
  });
  party.addEventListener("click", function(e){
    if(e.target === party) party.classList.remove("show");
  });
})();
</script>
</body>
</html>
